name: patch-v053
on:
  push:
    branches: [main]
    paths: ['patch-v053.json']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node patch-v053.js
      - run: node -e "const fs=require('fs');let s=fs.readFileSync('sw.js','utf8');if(!s.includes('archiviste-a0-v54')){console.error('sw v54 introuvable');process.exit(1);}fs.writeFileSync('sw.js',s.split('archiviste-a0-v54').join('archiviste-a0-v55'));console.log('sw v55 OK');"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V0.53 — la Cible affirmée : traits 8 px, œil 10, empreinte agrandie [skip ci]"
          git push
