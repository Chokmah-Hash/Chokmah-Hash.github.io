name: patch-v055
on:
  push:
    branches: [main]
    paths: ['patch-v055.json']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node patch-v055.js
      - run: node -e "const fs=require('fs');let s=fs.readFileSync('sw.js','utf8');if(!s.includes('archiviste-a0-v56')){console.error('sw v56 introuvable');process.exit(1);}fs.writeFileSync('sw.js',s.split('archiviste-a0-v56').join('archiviste-a0-v57'));console.log('sw v57 OK');"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V0.55 — IDs internes GM : GM-0001/2/3, packs renommés [skip ci]"
          git push
