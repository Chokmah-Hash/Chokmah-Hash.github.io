name: patch-v056
on:
  push:
    branches: [main]
    paths: ['patch-v056.json']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node patch-v056.js
      - run: node -e "const fs=require('fs');let s=fs.readFileSync('sw.js','utf8');if(!s.includes('archiviste-a0-v57')){console.error('sw v57 introuvable');process.exit(1);}fs.writeFileSync('sw.js',s.split('archiviste-a0-v57').join('archiviste-a0-v58'));console.log('sw v58 OK');"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V0.56 — Protocole Ω : GM-0001 change de nom d'affichage [skip ci]"
          git push
