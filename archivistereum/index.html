  <noscript>L'Archivisterium a besoin de JavaScript pour évaluer votre clé.</noscript>

  <!-- La garde de l'antichambre : si la salle n'ouvre pas, elle parle au lieu de figer -->

    setTimeout(function () {

      if (a) a.innerHTML = "⚠ La salle tarde — rechargez la page (Ctrl+Shift+R).";
    }, 12000);

  <script>
    /* Clé publique Supabase — publique par design (RLS protège les données) */
    var CLE_PUBLIQUE = "sb_publishable_U_ADFiAlPqWodkQFybynPg_5Mbctjov";
  </script>

  <script>
window.ARCHIVISTERIUM_CLOUD = (function () {
  "use strict";
  var URL = "https://dnbnkdakmobufqcrqzpq.supabase.co";
  var CLE = "larchivistereum_session_v1";

  function lire() {
    try { return JSON.parse(localStorage.getItem(CLE) || "null"); } catch (e) { return null; }
  }
  function ecrire(m) {
    try {
      if (m) localStorage.setItem(CLE, JSON.stringify(m));
      else localStorage.removeItem(CLE);
    } catch (e) { /* mode privé : on vivra sans restauration */ }
  }

  function api(chemin, opts) {
    opts = opts || {};
    var headers = { apikey: CLE_PUBLIQUE, "Content-Type": "application/json" };
    if (opts.token) headers["Authorization"] = "Bearer " + opts.token;
    if (opts.prefer) headers["Prefer"] = opts.prefer;
    /* no-store : le registre ne se lit jamais dans la poussière du cache —
       chaque requête repart vers la Tombe chercher la vérité. */
    return fetch(URL + chemin, {
      cache: "no-store",
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (!res.ok) {
          var code = (data && (data.error_code || data.code)) || "";
          var msgBrut = (data && (data.msg || data.message)) || "";
          var msgs = {
            invalid_credentials: "Email ou mot de passe incorrect.",
            email_not_confirmed: "Cet email n'est pas encore confirmé — ouvrez le message reçu, puis revenez.",
            over_email_rate_limit: "Trop d'essais — patientez quelques minutes.",
            user_already_exists: "Un compte existe déjà sur cet email.",
            weak_password: "Mot de passe trop faible — 4 caractères minimum.",
            email_address_invalid: "Adresse email invalide — vérifiez son orthographe.",
            signups_disabled: "Les inscriptions sont fermées sur le serveur.",
            "23505": "Un compte existe déjà avec cet email — la Tombe n'accepte pas les doublons."
          };
          var err = new Error(msgs[code] || msgBrut || "Serveur injoignable — vérifiez votre connexion.");
          err.code = code;
          err.statut = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  /* ── V0.35b : LA SESSION NE MEURT PLUS EN SILENCE — l'access_token de
     Supabase ne vit qu'une heure ; l'ancien client l'envoyait tel quel
     jusqu'à ce que la Tombe refuse TOUT (« La Tombe a refusé. » sur la
     Corbeille, le sceau, la console…). Le remède du launcher, greffé
     ici : avant chaque appel, on lit l'expiration DANS le jeton (le
     payload base64 du JWT) ; s'il expire dans moins d'une minute on
     l'échange contre un neuf grâce au refresh_token gardé à la
     connexion. Un seul échange à la fois (anti-tempête) ; si le
     rafraîchissement échoue, la session s'éteint proprement — retour
     à l'écran de connexion, plus de fantôme qui agit et échoue. ── */
  function expirationJeton(m) {
    try {
      var p = String(m.access_token || "").split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      while (p.length % 4) { p += "="; }
      var claims = JSON.parse(atob(p));
      return (claims && claims.exp) ? claims.exp * 1000 : 0;
    } catch (e) { return 0; }
  }
  var rajeunissementEnCours = null;
  function rajeunir() {
    var m = lire();
    if (!m || !m.access_token) return Promise.reject(new Error("Hors salle."));
    var expire = expirationJeton(m);
    if (expire === 0 || expire > Date.now() + 60000) return Promise.resolve(m.access_token);
    if (!m.refresh_token) { ecrire(null); return Promise.reject(new Error("Session éteinte — reconnectez-vous.")); }
    if (rajeunissementEnCours) return rajeunissementEnCours;
    rajeunissementEnCours = api("/auth/v1/token?grant_type=refresh_token", {
      method: "POST", body: { refresh_token: m.refresh_token }
    }).then(function (d) {
      rajeunissementEnCours = null;
      ecrire({ access_token: d.access_token, refresh_token: d.refresh_token, user_id: m.user_id });
      return d.access_token;
    }).catch(function (e) {
      rajeunissementEnCours = null;
      ecrire(null);
      throw e;
    });
    return rajeunissementEnCours;
  }

  /* ── Charger la salle : comptes + mémoires, selon ce que le RLS laisse voir ── */
  function chargerSalle(token, userId) {
    return api("/rest/v1/archiviste_comptes?select=*&order=cree_le.desc", { token: token })
      .then(function (comptes) {
        /* Un admin voit TOUTES les lignes ; un joueur seulement la sienne (RLS). */
        var moi = null;
        for (var i = 0; i < comptes.length; i++) {
          if (comptes[i].compte_id === userId) { moi = comptes[i]; break; }
        }
        if (!moi || moi.role !== "admin") {
          var err = new Error("Ces archives ne vous sont pas ouvertes.");
          err.refus = true;
          throw err;
        }
        return api("/rest/v1/archiviste_memoire?select=compte_id,contenu,maj_le", { token: token })
          .then(function (memoires) {
            return api("/rest/v1/parametres?select=cle,valeur", { token: token })
              .then(function (parametres) {
                return { profil: moi, comptes: comptes, memoires: memoires, parametres: parametres || [] };
              });
          });
      });
  }

  /* ══ TEMPS RÉEL — la poussée de la Tombe (Supabase Realtime) ══
     La base PRÉVIENT : plus de pulsation, la vérité arrive en poussée.
     WebSocket zéro dépendance, protocole Phoenix : jointure d'un canal
     postgres_changes + battement de cœur toutes les 25 s. La RLS
     s'applique AUSSI au canal — chaque écran ne reçoit que les lignes
     qu'il a le droit de voir. En coupure, on rebranche seul (délai
     croissant) ; l'app relit alors toute la Tombe pour rattraper ce
     qui a poussé pendant l'absence. */
  function tempsReel(opts) {
    opts = opts || {};
    var tables = opts.tables || [];
    var surChangement = opts.surChangement || function () {};
    var surEtat = opts.surEtat || function () {};
    var presenceCle = opts.presenceKey || null; /* s'annoncer sur le canal des présents */
    var surPresence = opts.surPresence || null; /* écouter qui entre et qui sort */
    if (typeof WebSocket === "undefined") { surEtat("coupure"); return { fermer: function () {} }; }
    var m0 = lire();
    if (!m0 || !m0.access_token) { surEtat("coupure"); return { fermer: function () {} }; }

    var ws = null, coeur = null, ferme = false, essais = 0;

    function brancher() {
      if (ferme) return;
      var jeton = ((lire() || m0) || {}).access_token || "";
      try {
        ws = new WebSocket("wss://dnbnkdakmobufqcrqzpq.supabase.co/realtime/v1/websocket?apikey=" + CLE_PUBLIQUE + "&vsn=1.0.0");
      } catch (e) { retomber(); return; }
      ws.onopen = function () {
        essais = 0;
        if (coeur) clearInterval(coeur);
        coeur = setInterval(function () {
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ topic: "phoenix", event: "heartbeat", payload: {}, ref: "battement" }));
          }
        }, 25000);
        tables.forEach(function (t) {
          var suivi = { event: "*", schema: "public", table: t.table };
          if (t.filtre) suivi.filter = t.filtre;
          ws.send(JSON.stringify({
            topic: "realtime:public:" + t.table,
            event: "phx_join",
            payload: {
              config: { broadcast: { self: false }, presence: { key: "" }, postgres_changes: [suivi] },
              access_token: jeton
            },
            ref: t.table
          }));
        });
        /* La PRÉSENCE : tant que cette socket vit, l'Archivisterium écoute la
           ronde des présents sur le canal « tombe ». Chaque launcher connecté
           s'y annonce ; fermer la fenêtre ferme sa socket — le serveur le
           remarque seul. Aucune écriture en base, aucun code à la fermeture. */
        if (presenceCle) {
          ws.send(JSON.stringify({
            topic: "realtime:tombe",
            event: "phx_join",
            payload: {
              config: { broadcast: { self: false }, presence: { key: presenceCle }, postgres_changes: [] },
              access_token: jeton
            },
            ref: "presence"
          }));
          /* Le track : joindre ne suffit pas, il faut S'ANNONCER — la ronde
             ne diffuse que les états trackés (protocole Supabase v1 :
             event "presence", payload {type:"presence", event:"track"}).
             Le serveur traite les pushes dans l'ordre : join puis track.
             PERDU une fois du canvas : la greffe l'a écrasé en ligne et le
             point rouge du registre est mort (suite 39, 2026-10-30) — plus jamais. */
          ws.send(JSON.stringify({
            topic: "realtime:tombe",
            event: "presence",
            payload: { type: "presence", event: "track", payload: { compte_id: presenceCle } },
            ref: "piste"
          }));
        }
        surEtat("branche");
      };
      ws.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.event === "postgres_changes" && msg.payload && msg.payload.data) {
          surChangement(msg.payload.data);
        }
        /* La ronde des présents : état initial puis entrées/sorties */
        if (surPresence && (msg.event === "presence_state" || msg.event === "presence_diff")) {
          surPresence(msg.payload || {});
        }
      };
      ws.onclose = retomber;
      ws.onerror = function () { try { ws.close(); } catch (e) {} };
    }
    function retomber() {
      if (coeur) { clearInterval(coeur); coeur = null; }
      if (ferme) return;
      surEtat("coupure");
      setTimeout(brancher, Math.min(5000 + essais * 5000, 30000));
      essais++;
    }
    brancher();
    return {
      fermer: function () {
        ferme = true;
        if (coeur) clearInterval(coeur);
        if (ws) { try { ws.close(); } catch (e) {} }
        ws = null;
      }
    };
  }

  return {
    connexion: function (email, mdp) {
      return api("/auth/v1/token?grant_type=password", {
        method: "POST", body: { email: email, password: mdp }
      }).then(function (d) {
        ecrire({ access_token: d.access_token, refresh_token: d.refresh_token, user_id: d.user.id });
        return chargerSalle(d.access_token, d.user.id);
      });
    },

    session: function () {
      var m = lire();
      if (!m || !m.access_token || !m.user_id) return Promise.resolve(null);
      return rajeunir().then(function (token) {
        return chargerSalle(token, m.user_id);
      }).catch(function () { ecrire(null); return null; });
    },

    recharger: function () {
      var m = lire();
      if (!m || !m.access_token || !m.user_id) return Promise.reject(new Error("Hors salle."));
      return rajeunir().then(function (token) {
        return chargerSalle(token, m.user_id);
      });
    },

    deconnexion: function () {
      var m = lire();
      ecrire(null);
      if (m && m.access_token) {
        return api("/auth/v1/logout", { method: "POST", token: m.access_token }).catch(function () {});
      }
      return Promise.resolve();
    },

    /* Le sceau de l'Archiviste : valider (actif) ou suspendre (en_attente)
       un compte du registre — la politique RLS ne le permet qu'aux admins. */
    majStatut: function (compteId, statut) {
      var m = lire();
      if (!m || !m.access_token) return Promise.reject(new Error("Hors salle."));
      return rajeunir().then(function (token) {
        return api("/rest/v1/archiviste_comptes?compte_id=eq." + compteId, {
          method: "PATCH", token: token, body: { statut: statut }
        });
      });
    },

    /* Le mode de validation des inscriptions : « admin » (sceau manuel),
       « email » (le lien de confirmation fait foi) ou « automatique »
       (le compte naît directement actif — ni email, ni sceau). */
    majMode: function (valeur) {
      var m = lire();
      if (!m || !m.access_token) return Promise.reject(new Error("Hors salle."));
      return rajeunir().then(function (token) {
        return api("/rest/v1/parametres", {
          method: "POST", token: token, prefer: "resolution=merge-duplicates",
          body: { cle: "mode_validation", valeur: valeur }
        });
      });
    },

    /* La Console Globale : l'institution parle aux joueurs (canal unique
       des événements de jeu, idée de Michael). Le message est GRAVÉ dans
       la Tombe — le trigger console_verite le signe du pseudo et du rôle
       admin de la ligne compte, personne ne se déguise. */
    /* V45 : le canal de destination — la parole de l'invention part
       dans le canal GLOBAL, ou dans celui de la partie choisie. */
    envoyerConsole: function (contenu, type, donnees, partieId) {
      var m = lire();
      if (!m || !m.access_token || !m.user_id) return Promise.reject(new Error("Hors salle."));
      return rajeunir().then(function (token) {
        return api("/rest/v1/archiviste_console", {
          method: "POST", token: token,
          body: { compte_id: m.user_id, contenu: contenu, type: type || "message", donnees: donnees || {}, partie_id: partieId || null }
        });
      });
    },

    /* Le fil de la Console : relu à l'entrée dans la salle — le journal
       commence où l'on arrive (les 60 derniers messages). V0.32 : le fil
       emporte le partie_id — l'institution voit TOUS les canaux (le global
       et chaque partie : la policy de lecture s'ouvre à est_admin()). */
    lireConsole: function () {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve([]);
      return rajeunir().then(function (token) {
        return api("/rest/v1/archiviste_console?select=id,pseudo,role,contenu,type,donnees,cree_le,partie_id&order=id.desc&limit=60", { token: token })
          .then(function (l) { return (l || []).slice().reverse(); });
      }).catch(function () { return []; });
    },

    /* V0.32 : LES PARTIES — toutes les tables qui vivent, ouvertes au
       recrutement, lancées ou closes. La vue lobby (security definer)
       porte le pseudo du MJ et le compte de joueurs ; lisible par tout
       identifié, l'admin n'a besoin de rien de plus. */
    lireParties: function () {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve([]);
      return rajeunir().then(function (token) {
        return api("/rest/v1/archiviste_parties_lobby?select=*&order=cree_le.desc", { token: token })
          .then(function (l) { return l || []; });
      }).catch(function () { return []; });
    },

    /* V46 : LA CORBEILLE DES PARTIES — le MJ efface, l'institution garde.
       restaurer rend la partie aux écrans ; purger efface UNE partie À
       JAMAIS (les FK cascades emportent joueurs, fiches, console) ; vider
       purge toute la Corbeille d'un coup. */
    restaurerPartie: function (id) {
      var m = lire();
      if (!m || !m.access_token) return Promise.reject(new Error("Hors salle."));
      return rajeunir().then(function (token) {
        return api("/rest/v1/rpc/archiviste_restaurer_partie", {
          method: "POST", token: token, body: { p_id: id }
        });
      });
    },
    purgerPartie: function (id) {
      var m = lire();
      if (!m || !m.access_token) return Promise.reject(new Error("Hors salle."));
      return rajeunir().then(function (token) {
        return api("/rest/v1/rpc/archiviste_purger_partie", {
          method: "POST", token: token, body: { p_id: id }
        });
      });
    },
    viderCorbeille: function () {
      var m = lire();
      if (!m || !m.access_token) return Promise.reject(new Error("Hors salle."));
      return rajeunir().then(function (token) {
        return api("/rest/v1/rpc/archiviste_vider_corbeille", {
          method: "POST", token: token, body: {}
        });
      });
    },

    /* Graver un compte joueur de la main de l'Archiviste : l'inscription part
       chez Supabase Auth, la ligne compte s'écrit avec la clé du nouveau venu
       (le garde du serveur force rôle joueur + statut selon le mode), puis on
       referme la porte derrière lui — la session de l'admin reste intacte. */
    creerCompte: function (pseudo, email, mdp) {
      return api("/auth/v1/signup", {
        method: "POST", body: { email: email, password: mdp, data: { pseudo: pseudo, avatar_ref: "crane" } }
      }).then(function (d) {
        var session = d.session || (d.access_token ? d : null);
        if (!session || !session.access_token || !d.user) {
          var err = new Error("Le serveur n'a pas ouvert de session — vérifiez le mode de validation.");
          err.code = "pas_de_session";
          throw err;
        }
        var u = d.user;
        return api("/rest/v1/archiviste_comptes", {
          method: "POST", token: session.access_token, prefer: "return=representation",
          body: { compte_id: u.id, pseudo: pseudo, email: u.email, avatar_ref: "crane" }
        }).then(function (cree) {
          /* On referme la porte derrière le nouveau venu — l'admin reste l'admin. */
          return api("/auth/v1/logout", { method: "POST", token: session.access_token })
            .catch(function () {})
            .then(function () { return (cree && cree[0]) || { pseudo: pseudo, email: u.email }; });
        });
      });
    },

    /* La sentence : la ligne compte ET sa mémoire s'effacent du registre.
       Le RLS ne le permet qu'à l'admin — et JAMAIS sur sa propre ligne ;
       le tombeau du serveur empêche l'adresse de ressusciter. */
    supprimerCompte: function (compteId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.reject(new Error("Hors salle."));
      return rajeunir().then(function (token) {
        return api("/rest/v1/archiviste_comptes?compte_id=eq." + compteId, {
          method: "DELETE", token: token, prefer: "return=representation"
        }).then(function (supprimes) {
          if (!supprimes || !supprimes.length) {
            throw new Error("Le serveur a refusé la sentence.");
          }
          return api("/rest/v1/archiviste_memoire?compte_id=eq." + compteId, {
            method: "DELETE", token: token
          }).catch(function () {});
        });
      });
    },

    /* V3 : le dé roule DANS LA TOMBE (rpc lancer_des) — le serveur seul
       connaît le résultat avant de le graver, le client ne choisit plus
       son jet ; il l'apprend par la poussée, comme les autres. */
    lancerDes: function (nb, faces, note, partieId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve();
      return rajeunir().then(function (token) {
        return api("/rest/v1/rpc/lancer_des", {
          method: "POST", token: token,
          body: { nb: nb, faces: faces, note: note || null, p_partie: partieId || null }
        });
      }).catch(function () {});
    },

    /* Le canal temps réel : la Tombe pousse ses changements aux écrans
       branchés — la synchro devient de la poussée, pas du polling. */
    tempsReel: tempsReel
  };
})()
;

  </script>

const {
  useState,
  useRef,

} = React;
const BUILD = "0.38";

/* ── La clé publique Supabase et le client nuage EMBARQUÉ : le canvas vit
   dans la même réalité que la page en ligne — même base, mêmes comptes,
   aucun faux registre. Sur la page construite, le script pipeline a déjà posé
   window.ARCHIVISTERIUM_CLOUD : l'embarqué s'efface alors devant lui. ── */
const CLE_PUBLIQUE = "sb_publishable_U_ADFiAlPqWodkQFybynPg_5Mbctjov";
if (typeof window !== "undefined" && !window.ARCHIVISTERIUM_CLOUD) {
  /* ════════════════════════════════════════════════════════════════════
     ARCHIVISTERIUM_CLOUD — le client nuage de la salle d'administration.
     Zéro dépendance : fetch + l'API REST de Supabase.
     La porte : seul un compte de rôle « admin » franchit le seuil.
     La protection réelle vit dans les politiques RLS du serveur :
     un non-admin ne reçoit QUE sa propre ligne, jamais les autres.
     Il s'assigne lui-même à window.ARCHIVISTERIUM_CLOUD : la page en
     ligne et le canvas parlent à la MÊME Tombe — aucun faux registre.
     ════════════════════════════════════════════════════════════════════ */
  window.ARCHIVISTERIUM_CLOUD = function () {
    "use strict";

    var URL = "https://dnbnkdakmobufqcrqzpq.supabase.co";
    var CLE = "larchivistereum_session_v1";
    function lire() {
