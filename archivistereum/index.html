  <script>
    /* Clé publique Supabase — publique par design (RLS protège les données) */
    var CLE_PUBLIQUE = "sb_publishable_U_ADFiAlPqWodkQFybynPg_5Mbctjov";
  </script>

  <script>
/* ════════════════════════════════════════════════════════════════════
   ARCHIVISTERIUM_CLOUD — le client nuage de la salle d'administration.
   Zéro dépendance : fetch + l'API REST de Supabase.
   La porte : seul un compte de rôle « admin » franchit le seuil.
   La protection réelle vit dans les politiques RLS du serveur :
   un non-admin ne reçoit QUE sa propre ligne, jamais les autres.
   ════════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";
  var URL = "https://dnbnkdakmobufqcrqzpq.supabase.co";
  var CLE = "larchivistereum_session_v1";

  function lire() {
    try { return JSON.parse(localStorage.getItem(CLE) || "null"); } catch (e) { return null; }
  }
  function ecrire(m) {
    try {
      if (m) localStorage.setItem(CLE, JSON.stringify(m));
      else localStorage.removeItem(CLE);
    } catch (e) { /* mode privé : on vivra sans restauration */ }
  }

  function api(chemin, opts) {
    opts = opts || {};
    var headers = { apikey: CLE_PUBLIQUE, "Content-Type": "application/json" };
    if (opts.token) headers["Authorization"] = "Bearer " + opts.token;
    if (opts.prefer) headers["Prefer"] = opts.prefer;
    /* no-store : le registre ne se lit jamais dans la poussière du cache —
       chaque requête repart vers la Tombe chercher la vérité. */
    return fetch(URL + chemin, {
      cache: "no-store",
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (!res.ok) {
          var code = (data && (data.error_code || data.code)) || "";
          var msgBrut = (data && (data.msg || data.message)) || "";
          var msgs = {
            invalid_credentials: "Email ou mot de passe incorrect.",
            email_not_confirmed: "Cet email n'est pas encore confirmé — ouvrez le message reçu, puis revenez.",
            over_email_rate_limit: "Trop d'essais — patientez quelques minutes.",
            user_already_exists: "Un compte existe déjà sur cet email.",
            weak_password: "Mot de passe trop faible — 4 caractères minimum.",
            email_address_invalid: "Adresse email invalide — vérifiez son orthographe.",
            signups_disabled: "Les inscriptions sont fermées sur le serveur.",
            "23505": "Un compte existe déjà avec cet email — la Tombe n'accepte pas les doublons."
          };
          var err = new Error(msgs[code] || msgBrut || "Serveur injoignable — vérifiez votre connexion.");
          err.code = code;
          err.statut = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  /* ── Charger la salle : comptes + mémoires, selon ce que le RLS laisse voir ── */
  function chargerSalle(token, userId) {
    return api("/rest/v1/archiviste_comptes?select=*&order=cree_le.desc", { token: token })
      .then(function (comptes) {
        /* Un admin voit TOUTES les lignes ; un joueur seulement la sienne (RLS). */
        var moi = null;
        for (var i = 0; i < comptes.length; i++) {
          if (comptes[i].compte_id === userId) { moi = comptes[i]; break; }
        }
        if (!moi || moi.role !== "admin") {
          var err = new Error("Ces archives ne vous sont pas ouvertes.");
          err.refus = true;
          throw err;
        }
        return api("/rest/v1/archiviste_memoire?select=compte_id,contenu,maj_le", { token: token })
          .then(function (memoires) {
            return api("/rest/v1/parametres?select=cle,valeur", { token: token })
              .then(function (parametres) {
                return { profil: moi, comptes: comptes, memoires: memoires, parametres: parametres || [] };
              });
          });
      });
  }

  return {
    connexion: function (email, mdp) {
      return api("/auth/v1/token?grant_type=password", {
        method: "POST", body: { email: email, password: mdp }
      }).then(function (d) {
        ecrire({ access_token: d.access_token, refresh_token: d.refresh_token, user_id: d.user.id });
        return chargerSalle(d.access_token, d.user.id);
      });
    },

    session: function () {
      var m = lire();
      if (!m || !m.access_token || !m.user_id) return Promise.resolve(null);
      return chargerSalle(m.access_token, m.user_id).catch(function () { ecrire(null); return null; });
    },

    recharger: function () {
      var m = lire();
      if (!m || !m.access_token || !m.user_id) return Promise.reject(new Error("Hors salle."));
      return chargerSalle(m.access_token, m.user_id);
    },

    deconnexion: function () {
      var m = lire();
      ecrire(null);
      if (m && m.access_token) {
        return api("/auth/v1/logout", { method: "POST", token: m.access_token }).catch(function () {});
      }
      return Promise.resolve();
    },

    /* Le sceau de l'Archiviste : valider (actif) ou suspendre (en_attente)
       un compte du registre — la politique RLS ne le permet qu'aux admins. */
    majStatut: function (compteId, statut) {
      var m = lire();
      if (!m || !m.access_token) return Promise.reject(new Error("Hors salle."));
      return api("/rest/v1/archiviste_comptes?compte_id=eq." + compteId, {
        method: "PATCH", token: m.access_token, body: { statut: statut }
      });
    },

    /* Le mode de validation des inscriptions : « admin » (sceau manuel)
       ou « email » (le lien de confirmation fait foi). */
    majMode: function (valeur) {
      var m = lire();
      if (!m || !m.access_token) return Promise.reject(new Error("Hors salle."));
      return api("/rest/v1/parametres", {
        method: "POST", token: m.access_token, prefer: "resolution=merge-duplicates",
        body: { cle: "mode_validation", valeur: valeur }
      });
    },

    /* Graver un compte joueur de la main de l'Archiviste : l'inscription part
       chez Supabase Auth, la ligne compte s'écrit avec la clé du nouveau venu
       (le garde du serveur force rôle joueur + statut selon le mode), puis on
       referme la porte derrière lui — la session de l'admin reste intacte. */
    creerCompte: function (pseudo, email, mdp) {
      return api("/auth/v1/signup", {
        method: "POST", body: { email: email, password: mdp, data: { pseudo: pseudo, avatar_ref: "crane" } }
      }).then(function (d) {
        var session = d.session || (d.access_token ? d : null);
        if (!session || !session.access_token || !d.user) {
          var err = new Error("Le serveur n'a pas ouvert de session — vérifiez le mode de validation.");
          err.code = "pas_de_session";
          throw err;
        }
        var u = d.user;
        return api("/rest/v1/archiviste_comptes", {
          method: "POST", token: session.access_token, prefer: "return=representation",
          body: { compte_id: u.id, pseudo: pseudo, email: u.email, avatar_ref: "crane" }
        }).then(function (cree) {
          /* On referme la porte derrière le nouveau venu — l'admin reste l'admin. */
          return api("/auth/v1/logout", { method: "POST", token: session.access_token })
            .catch(function () {})
            .then(function () { return (cree && cree[0]) || { pseudo: pseudo, email: u.email }; });
        });
      });
    },

    /* La sentence : la ligne compte ET sa mémoire s'effacent du registre.
       Le RLS ne le permet qu'à l'admin — et JAMAIS sur sa propre ligne ;
       le tombeau du serveur empêche l'adresse de ressusciter. */
    supprimerCompte: function (compteId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.reject(new Error("Hors salle."));
      return api("/rest/v1/archiviste_comptes?compte_id=eq." + compteId, {
        method: "DELETE", token: m.access_token, prefer: "return=representation"
      }).then(function (supprimes) {
        if (!supprimes || !supprimes.length) {
          throw new Error("Le serveur a refusé la sentence.");
        }
        return api("/rest/v1/archiviste_memoire?compte_id=eq." + compteId, {
          method: "DELETE", token: m.access_token
        }).catch(function () {});
      });
    }
  };
})();

  </script>

  <script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

/* ════════════════════════════════════════════════════════════════════
   L'ARCHIVISTERIUM — la salle d'administration de L'Archiviste.
   Une PAGE À PART : elle vit à sa propre adresse, séparée du launcher,
   et sa porte ne s'ouvre qu'aux comptes portant le rôle « admin ».
   En simulation (canvas) : banc d'essai. En ligne : ARCHIVISTERIUM_CLOUD.
   ════════════════════════════════════════════════════════════════════ */
const CLOUD = (typeof window !== "undefined" && window.ARCHIVISTERIUM_CLOUD) || null;

/* ── La version de build, alignée sur le launcher (0.xx, +0.01 par build) ── */
const BUILD = "0.19";

/* ── Les packs du launcher (miroir de ses id pour les stats) ── */
const PACKS = [
  { id: "protocoles-eternels", nom: "Les Protocoles Éternels", accent: "#2ee6c9" },
  { id: "stormbringer", nom: "Stormbringer", accent: "#9d86e8" },
  { id: "bloodlust", nom: "Bloodlust", accent: "#e0524d" },
];

/* ── Banc d'essai : la salle en simulation, sans le nuage ── */
const BANC = {
  parametres: [
    { cle: "mode_validation", valeur: "admin" },
  ],
  comptes: [
    { compte_id: "sim-1", pseudo: "Test Archiviste", tag: "JR-0004", email: "archiviste.test@larchiviste.jdr", role: "admin", statut: "actif", cree_le: "2026-10-29T08:09:15Z", derniere_connexion: "2026-10-29T08:15:28Z" },
    { compte_id: "sim-2", pseudo: "Invité de la Tombe", tag: "JR-0005", email: "invite@larchiviste.jdr", role: "joueur", statut: "en_attente", cree_le: "2026-10-29T10:00:00Z", derniere_connexion: null },
  ],
  memoires: [
    { compte_id: "sim-1", contenu: { installes: ["protocoles-eternels", "stormbringer"], favoris: ["protocoles-eternels"], rolesPacks: {} } },
    { compte_id: "sim-2", contenu: { installes: ["bloodlust"], favoris: ["bloodlust"], rolesPacks: {} } },
  ],
};

/* ── Banc d'essai : la pierre locale. Les gestes du banc survivent aux
   Alt+F5 et aux rechargements — gravés dans localStorage, silencieusement
   ignoré si le navigateur refuse (mode privé, bac à sable…). ── */
const CLE_BANC = "archivistereum_banc_v1";
const lireBanc = () => {
  try {
    const brut = localStorage.getItem(CLE_BANC);
    if (!brut) return null;
    const d = JSON.parse(brut);
    if (!d || !Array.isArray(d.comptes)) return null;
    return {
      comptes: d.comptes,
      memoires: d.memoires || [],
      parametres: d.parametres || BANC.parametres,
    };
  } catch (e) { return null; }
};
const sauverBanc = (d) => {
  try {
    if (d) localStorage.setItem(CLE_BANC, JSON.stringify({
      comptes: d.comptes,
      memoires: d.memoires || [],
      parametres: d.parametres || BANC.parametres,
    }));
  } catch (e) { /* la pierre refuse : le banc vivra en mémoire vive */ }
};

/* ══════════ L'Icosaèdre — glyphe D20 de L'Archiviste ══════════ */
function Icosaedre({ size = 40, color = "#e8e4d8", fond = "transparent" }) {
  const V = [[50, 6], [88.5, 28.5], [88.5, 71.5], [50, 94], [11.5, 71.5], [11.5, 28.5]];
  const C = [50, 50];
  const P = (p) => p.join(",");
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" style={{ display: "block" }}>
      <rect width="100" height="100" fill={fond} rx="14" />
      <g fill="none" stroke={color} strokeWidth="3.8" strokeLinejoin="round" strokeLinecap="round">
        <polygon points={V.map(P).join(" ")} />
        {V.map((v, i) => (<polyline key={i} points={P(v) + " " + P(C)} />))}
      </g>
    </svg>
  );
}

/* ══════════ Petites mains ══════════ */
function dateCourte(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
}
function heureCourte(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }) + " · " +
    d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}
const ACTIF_7J = 7 * 24 * 60 * 60 * 1000;

/* ══════════ La porte : email + mot de passe ══════════ */
function Porte({ email, mdp, setEmail, setMdp, onEntrer, erreur, enChargement, simulation }) {
  const champ = { background: "#0c0d10", border: "1px solid #3f3f46", color: "#e8e4d8", outline: "none" };
  return (
    <div className="min-h-screen flex flex-col" style={{ background: "#0c0d10", fontFamily: "'Rajdhani','Segoe UI',system-ui,sans-serif" }}>
      <div className="flex-1 flex items-center justify-center p-4">
        <form onSubmit={(e) => { e.preventDefault(); onEntrer(); }}
          className="rounded-2xl p-6 w-full max-w-sm"
          style={{ background: "#14161b", border: "1px solid #f0b24a44" }}>
          <div className="flex items-center justify-center mb-3">
            <Icosaedre size={52} color="#f0b24a" />
          </div>
          <div className="text-center font-bold text-xl tracking-wide" style={{ color: "#f0b24a" }}>
            ⚙ L'ARCHIVISTERIUM
          </div>
          <div className="text-center text-xs mb-5 tracking-widest" style={{ color: "#a1a1aa" }}>
            SALLE D'ADMINISTRATION — ACCÈS RÉSERVÉ
          </div>
          <div className="text-xs font-bold mb-1" style={{ color: "#c8c8ce" }}>Email :</div>
          <input value={email} onChange={(e) => { setEmail(e.target.value); }}
            placeholder="vous@exemple.fr" type="email" autoComplete="username"
            className="w-full rounded-lg px-3 py-2 mb-3 text-sm" style={champ} />
          <div className="text-xs font-bold mb-1" style={{ color: "#c8c8ce" }}>Mot de passe :</div>
          <input value={mdp} onChange={(e) => { setMdp(e.target.value); }}
            placeholder="••••••••" type="password" autoComplete="current-password"
            className="w-full rounded-lg px-3 py-2 mb-3 text-sm" style={champ} />
          <div className="text-xs mb-4" style={{ color: erreur ? "#fb7185" : "#52525b" }}>
            {erreur || "\u00a0"}
          </div>
          <button type="submit" disabled={enChargement}
            className="w-full px-4 py-2 rounded-lg font-bold text-sm text-black"
            style={{ background: "#f0b24a", opacity: enChargement ? 0.6 : 1 }}>
            {enChargement ? "La porte évalue…" : "Franchir le seuil"}
          </button>
          {simulation && (
            <div className="text-center text-xs mt-4 leading-relaxed" style={{ color: "#71717a" }}>
              Banc d'essai — la porte n'ouvre qu'à l'admin simulé :<br />
              <span style={{ color: "#f0b24a" }}>archiviste.test@larchiviste.jdr</span> · mot de passe libre (4+)
            </div>
          )}
          <div className="text-center mt-4 text-xs">
            <a href="https://chokmah-hash.github.io/" style={{ color: "#71717a" }}>⟁ Retour au launcher</a>
          </div>
        </form>
      </div>
      <footer className="text-center text-xs" style={{ color: "#52525b", padding: "5px 0" }}>
        Powered by <a href="https://chat.mistral.ai" target="_blank" rel="noopener noreferrer" style={{ color: "#a8adb8" }}>Vibe</a> · N° {BUILD}
      </footer>
    </div>
  );
}

/* ══════════ Le refus : ces archives ne sont pas pour tout le monde ══════════ */
function Refus({ onRetour }) {
  return (
    <div className="min-h-screen flex flex-col" style={{ background: "#0c0d10", fontFamily: "'Rajdhani','Segoe UI',system-ui,sans-serif" }}>
      <div className="flex-1 flex items-center justify-center p-4">
        <div className="text-center max-w-sm">
          <div className="flex justify-center mb-4"><Icosaedre size={64} color="#52525b" /></div>
          <div className="font-bold text-xl mb-2" style={{ color: "#e8e4d8" }}>Ces archives ne vous sont pas ouvertes.</div>
          <div className="text-sm mb-6" style={{ color: "#71717a" }}>
            Le rôle de votre compte ne porte pas la clé de cette salle.
            Seuls les Archivistes (rôle « admin ») franchissent ce seuil.
          </div>
          <button onClick={onRetour} className="px-4 py-2 rounded-lg font-bold text-sm text-black" style={{ background: "#a8adb8" }}>
            Revenir à la porte
          </button>
        </div>
      </div>
      <footer className="text-center text-xs" style={{ color: "#52525b", padding: "5px 0" }}>
        Powered by <a href="https://chat.mistral.ai" target="_blank" rel="noopener noreferrer" style={{ color: "#a8adb8" }}>Vibe</a> · N° {BUILD}
      </footer>
    </div>
  );
}

/* ══════════ Une carte de statistique ══════════ */
function Carte({ valeur, libelle, accent }) {
  return (
    <div className="rounded-xl p-4" style={{ background: "#14161b", border: "1px solid #27272a" }}>
      <div className="text-3xl font-bold leading-none" style={{ color: accent }}>{valeur}</div>
      <div className="text-xs mt-1 tracking-wider" style={{ color: "#71717a" }}>{libelle}</div>

/* ══════════ La salle : les stats de la Tombe ══════════ */
function Salle({ session, donnees, onSortir, onRafraichir, onStatut, onMode, onCreer, onSupprimer, simulation }) {
  const { comptes, memoires, parametres } = donnees;
  const [onglet, setOnglet] = useState("stat"); // stat | bibliotheque | comptes
  const [detail, setDetail] = useState(null); // la fiche ouverte, si ouverte
  const [confSuppr, setConfSuppr] = useState(false); // la sentence se prépare-t-elle ?
  const [motSuppr, setMotSuppr] = useState(""); // la consécration écrite : « suppression »
  const [supprEnCours, setSupprEnCours] = useState(false);
  const [supprErreur, setSupprErreur] = useState(null);
  const [creation, setCreation] = useState(false); // le cadre de gravure, si ouvert
  const [nPseudo, setNPseudo] = useState("");
  const [nEmail, setNEmail] = useState("");
  const [nMdp, setNMdp] = useState("");
  const [nErreur, setNErreur] = useState(null);
  const [nEnCours, setNEnCours] = useState(false);
  /* Garde anti-fantôme : si le compte de la fiche ouverte disparaît du
     registre (sentence prononcée ailleurs, synchronisation plus rapide),
     la fiche se referme d'elle-même. */
  useEffect(() => {
    if (detail && !comptes.some((c) => c.compte_id === detail.compte_id)) {
      setDetail(null);
      setConfSuppr(false);
      setMotSuppr("");
    }
  }, [comptes, detail]);
  const champ = { background: "#0c0d10", border: "1px solid #3f3f46", color: "#e8e4d8", outline: "none" };
  const admins = comptes.filter((c) => c.role === "admin").length;
  const enAttente = comptes.filter((c) => c.statut === "en_attente").length;
  const modeValidation = ((parametres || []).find((p) => p.cle === "mode_validation") || {}).valeur || "admin";
  /* La version de l'état de la base : la Tombe annonce elle-même son
     état — le pied de page dit ce qu'il CHARGE, pas ce qu'il est. */
  const versionBase = ((parametres || []).find((p) => p.cle === "version") || {}).valeur || null;
  const visites = comptes
    .filter((c) => c.derniere_connexion)
    .sort((a, b) => new Date(b.derniere_connexion) - new Date(a.derniere_connexion))
    .slice(0, 5);
  /* Les packs installés d'un compte, joliment nommés — pour la fiche */
  const packsDe = (c) => {
    const m = (memoires || []).find((mm) => mm.compte_id === c.compte_id);
    const ids = (m && m.contenu && m.contenu.installes) || [];
    return ids.length ? ids.map((id) => (PACKS.find((p) => p.id === id) || { nom: id }).nom).join(" · ") : null;
  };
  /* Graver un compte joueur à la main : le + du registre convoque la main de l'Archiviste */
  const graver = async () => {
    setNErreur(null);
    if (!nPseudo.trim() || !nEmail.trim() || nMdp.length < 4) {
      setNErreur("Pseudo, email et mot de passe requis (4 caractères min.).");
      return;
    }
    setNEnCours(true);
    try {
      await onCreer(nPseudo.trim(), nEmail.trim().toLowerCase(), nMdp);
      setCreation(false);
      setNPseudo(""); setNEmail(""); setNMdp("");
    } catch (e) {
      setNErreur((e && e.message) || "La pierre a refusé la gravure.");
    } finally {
      setNEnCours(false);
    }
  };
  /* La sentence : effacer un compte du registre — après consécration écrite */
  const effacer = async () => {
    setSupprErreur(null);
    setSupprEnCours(true);
    try {
      await onSupprimer(detail);
      setDetail(null);
      setConfSuppr(false); setMotSuppr("");
    } catch (e) {
      setSupprErreur((e && e.message) || "La pierre a refusé l'effacement.");
    } finally {
      setSupprEnCours(false);
    }
  };
  /* Ouvrir une fiche saine : la sentence précédente ne suit pas */
  const ouvrirFiche = (c) => {
    setDetail(c);
    setConfSuppr(false); setMotSuppr(""); setSupprErreur(null);
  };
  const actifs = comptes.filter(
    (c) => c.derniere_connexion && (Date.now() - new Date(c.derniere_connexion).getTime() < ACTIF_7J)
  ).length;
  const totalInstalles = memoires.reduce(
    (n, m) => n + ((m.contenu && m.contenu.installes) || []).length, 0
  );

  const statsPack = PACKS.map((p) => {
    const installs = memoires.filter(
      (m) => (m.contenu && m.contenu.installes || []).includes(p.id)
    ).length;
    const favoris = memoires.filter(
      (m) => (m.contenu && m.contenu.favoris || []).includes(p.id)
    ).length;
    const pct = comptes.length ? Math.round((installs / comptes.length) * 100) : 0;
    return { ...p, installs, favoris, pct };
  });
  const pctMax = Math.max(...statsPack.map((s) => s.pct), 1);

  return (
    <div className="min-h-screen flex flex-col text-zinc-200" style={{ background: "#0c0d10", fontFamily: "'Rajdhani','Segoe UI',system-ui,sans-serif" }}>
      <style>{`@keyframes glisseHaut { from { transform: translateY(-110%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.glisseHaut { animation: glisseHaut 280ms ease-out; }`}</style>

              <div className="text-2xl font-bold tracking-wide leading-tight" style={{ color: "#f0b24a" }}>
                ⚙ L'ARCHIVISTERIUM
              </div>
              <div className="text-xs tracking-widest" style={{ color: "#a1a1aa" }}>SALLE D'ADMINISTRATION</div>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <button onClick={onRafraichir} title="Rafraîchir les données"
              className="px-3 py-2 rounded-lg font-bold text-sm"
              style={{ background: "#a8adb814", color: "#a8adb8", border: "1px solid #27272a" }}>
              ↻
            </button>
            <button onClick={onSortir}
              className="px-4 py-2 rounded-lg font-bold text-sm text-black" style={{ background: "#a8adb8" }}>
              Sortir
            </button>
          </div>
        </header>

        {/* Onglets Stat / Bibliothèque / Comptes — l'ergonomie du launcher, en or */}
        <div className="flex gap-1 mb-6" style={{ borderBottom: "1px solid #27272a" }}>
          {[["stat", "STAT"], ["bibliotheque", "BIBLIOTHÈQUE"], ["comptes", "COMPTES"]].map(([id, lbl]) => (
            <button key={id} onClick={() => setOnglet(id)}
              className="px-4 py-2 text-sm font-bold tracking-wider"
              style={{
                background: onglet === id ? "#f0b24a12" : "transparent",
                color: onglet === id ? "#f0b24a" : "#71717a",
                borderBottom: onglet === id ? "2px solid #f0b24a" : "2px solid transparent",
                marginBottom: -1
              }}>
              {lbl}
              {id === "comptes" && comptes.length ? <span style={{ opacity: 0.7 }}> ({comptes.length})</span> : null}
            </button>
          ))}
        </div>

        {/* ── Les grandes lignes ── */}
        {onglet === "stat" && (<div className="mb-8">
        <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
          <Carte valeur={comptes.length} libelle="COMPTES" accent="#e8e4d8" />
          <Carte valeur={admins} libelle="ADMINISTRATEURS" accent="#f0b24a" />
          <Carte valeur={enAttente} libelle="EN ATTENTE" accent="#fb7185" />
          <Carte valeur={actifs} libelle="ACTIFS (7 JOURS)" accent="#2ee6c9" />
          <Carte valeur={totalInstalles} libelle="INSTALLATIONS" accent="#9d86e8" />
        </div>

        {/* ── Les dernières visites : qui est passé dans la Tombe ── */}
        <div className="text-sm font-bold tracking-widest mb-2 mt-8" style={{ color: "#a1a1aa" }}>
          DERNIÈRES VISITES
        </div>
        {visites.length ? (
          <div className="rounded-xl overflow-hidden" style={{ border: "1px solid #27272a" }}>
            {visites.map((c, i) => (
              <div key={c.compte_id} className="flex items-center gap-3 px-4 py-3"
                style={{ background: "#14161b", borderBottom: i < visites.length - 1 ? "1px solid #27272a" : "none" }}>
                <div className="w-2.5 h-2.5 rounded-full shrink-0"
                  style={{ background: (Date.now() - new Date(c.derniere_connexion).getTime() < ACTIF_7J) ? "#2ee6c9" : "#52525b" }} />
                <div className="font-bold text-sm flex-1 truncate" style={{ color: "#e8e4d8" }}>{c.pseudo}</div>
                <div className="text-xs" style={{ color: "#a1a1aa" }}>{c.tag}</div>
                <div className="text-xs w-44 text-right" style={{ color: "#71717a" }}>{heureCourte(c.derniere_connexion)}</div>
              </div>

        ) : (
          <div className="rounded-xl p-4 text-sm" style={{ border: "1px solid #27272a", color: "#71717a" }}>
            Aucune visite enregistrée pour l'instant.
          </div>

        </div>)}

        {/* ── Les packs du magasin ── */}
        {onglet === "bibliotheque" && (<div className="mb-8">

        <div className="rounded-xl overflow-hidden" style={{ border: "1px solid #27272a" }}>

        {/* ── La fiche du compte : le cadre doré, comme la porte ── */}
        {detail && (

              <div className="flex justify-center mb-3">
                <Icosaedre size={44} color="#f0b24a" />

              <div className="text-center font-bold text-xl" style={{ color: "#e8e4d8" }}>{detail.pseudo}</div>
              <div className="text-center text-xs tracking-widest mb-5" style={{ color: "#a1a1aa" }}>{detail.tag || "—"}</div>
              <div className="text-sm mb-5">
                {[["EMAIL", detail.email],
                  ["CRÉÉ LE", dateCourte(detail.cree_le)],

              {modeValidation === "admin" && session.email !== detail.email ? (
                <div className="flex gap-2">
                  {detail.statut === "en_attente" ? (
                    <button onClick={() => { onStatut(detail, "actif"); setDetail({ ...detail, statut: "actif" }); }}
                      className="flex-1 px-4 py-2 rounded-lg font-bold text-sm text-black" style={{ background: "#f0b24a" }}>
                      ✓ Valider
                    </button>
                  ) : (
                    <button onClick={() => { onStatut(detail, "en_attente"); setDetail({ ...detail, statut: "en_attente" }); }}
                      className="flex-1 px-4 py-2 rounded-lg font-bold text-sm"

              ) : (
                <button onClick={() => setDetail(null)}

                  Fermer
                </button>
              )}
              {/* ── La sentence : effacer le compte, jamais sur sa propre ligne ── */}
              {session.email !== detail.email && (
                <div className="mt-4 pt-3" style={{ borderTop: "1px solid #27272a" }}>
                  {!confSuppr ? (
                    <button onClick={() => { setConfSuppr(true); setSupprErreur(null); }}

                      ✕ Supprimer ce compte
                    </button>
                  ) : (
                    <div>
                      <div className="text-xs mb-2 leading-relaxed" style={{ color: "#fb7185" }}>
                        « {detail.pseudo} » et sa mémoire seront effacés du registre, à jamais.
                        Écrivez « suppression » pour sceller la sentence.
                      </div>
                      <input value={motSuppr} onChange={(e) => setMotSuppr(e.target.value)}
                        placeholder="suppression" type="text" autoComplete="off"
                        className="w-full rounded-lg px-3 py-2 mb-2 text-sm" style={champ} />
                      {supprErreur && (
                        <div className="text-xs mb-2" style={{ color: "#fb7185" }}>{supprErreur}</div>
                      )}
                      <div className="flex gap-2">
                        <button onClick={effacer} disabled={motSuppr !== "suppression" || supprEnCours}
                          className="flex-1 px-4 py-2 rounded-lg font-bold text-sm"
                          style={{ background: "#fb7185", color: "#0c0d10",
                            opacity: motSuppr !== "suppression" || supprEnCours ? 0.4 : 1 }}>
                          {supprEnCours ? "La pierre s'efface…" : "✕ Supprimer définitivement"}
                        </button>
                        <button onClick={() => { setConfSuppr(false); setMotSuppr(""); setSupprErreur(null); }}
                          className="px-4 py-2 rounded-lg text-xs font-bold"
                          style={{ background: "#a8adb814", color: "#a8adb8", border: "1px solid #27272a" }}>
                          Annuler
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        )}

        {/* ── La gravure : créer un compte joueur à la main ── */}
        {creation && (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4"
            style={{ background: "#0c0d10cc" }}
            onClick={() => setCreation(false)}>
            <div onClick={(e) => e.stopPropagation()}
              className="glisseHaut rounded-2xl p-6 w-full max-w-sm max-h-[85vh] overflow-y-auto"
              style={{ background: "#14161b", border: "1px solid #f0b24a44" }}>
              <div className="flex justify-center mb-3">
                <Icosaedre size={44} color="#f0b24a" />
              </div>
              <div className="text-center font-bold text-xl tracking-wide" style={{ color: "#f0b24a" }}>
                ⚙ GRAVER UN COMPTE
              </div>
              <div className="text-center text-xs mb-5 tracking-widest" style={{ color: "#a1a1aa" }}>
                NOUVEAU JOUEUR — DE LA MAIN DE L'ARCHIVISTE
              </div>
              <form onSubmit={(e) => { e.preventDefault(); graver(); }}>
                <div className="text-xs font-bold mb-1" style={{ color: "#c8c8ce" }}>Pseudo :</div>
                <input value={nPseudo} onChange={(e) => setNPseudo(e.target.value)} placeholder="Novice de la Tombe" type="text"
                  name="archiviste-pseudo" autoComplete="off"
                  className="w-full rounded-lg px-3 py-2 mb-3 text-sm" style={champ} />
                <div className="text-xs font-bold mb-1" style={{ color: "#c8c8ce" }}>Email :</div>
                <input value={nEmail} onChange={(e) => setNEmail(e.target.value)} placeholder="novice@exemple.fr" type="email"
                  name="archiviste-email" autoComplete="off"
                  className="w-full rounded-lg px-3 py-2 mb-3 text-sm" style={champ} />
                <div className="text-xs font-bold mb-1" style={{ color: "#c8c8ce" }}>Mot de passe :</div>
                <input value={nMdp} onChange={(e) => setNMdp(e.target.value)} placeholder="••••••••" type="password"
                  name="archiviste-mdp" autoComplete="new-password"
                  className="w-full rounded-lg px-3 py-2 mb-3 text-sm" style={champ} />
                <div className="text-xs mb-4" style={{ color: nErreur ? "#fb7185" : "#52525b" }}>
                  {nErreur || "\u00a0"}
                </div>
                <div className="flex gap-2">
                  <button type="submit" disabled={nEnCours}
                    className="flex-1 px-4 py-2 rounded-lg font-bold text-sm text-black"
                    style={{ background: "#f0b24a", opacity: nEnCours ? 0.6 : 1 }}>
                    {nEnCours ? "La pierre grave…" : "+ Graver le compte"}
                  </button>
                  <button type="button" onClick={() => setCreation(false)}
                    className="px-4 py-2 rounded-lg font-bold text-sm text-black" style={{ background: "#a8adb8" }}>
                    Fermer
                  </button>
                </div>
              </form>
            </div>
          </div>
        )}
      </div>
      <footer className="mt-auto text-center text-xs" style={{ color: "#52525b", padding: "5px 0" }}>
        {/* N° : l'état de la BASE (Supabase, parametre « version ») — le pied de
            page dit ce qu'il charge ; en banc d'essai, la version locale. */}
        Powered by <a href="https://chat.mistral.ai" target="_blank" rel="noopener noreferrer" style={{ color: "#a8adb8" }}>Vibe</a> · N° {versionBase || BUILD}
      </footer>
    </div>
  );
}

/* ══════════ L'App : la porte, le refus, la salle ══════════ */
function App() {
  const [phase, setPhase] = useState("porte"); // porte | salle | refus
  const [email, setEmail] = useState("");
  const [mdp, setMdp] = useState("");
  const [erreur, setErreur] = useState(null);
  const [enChargement, setEnChargement] = useState(false);
  const [session, setSession] = useState(null);
  const [donnees, setDonnees] = useState(null);

  /* Restauration de session au chargement (mode en ligne) */
  useEffect(() => {
    if (!CLOUD) return;
    let vivant = true;
    CLOUD.session().then((res) => {
      if (!vivant || !res) return;
      setSession({ pseudo: res.profil.pseudo, email: res.profil.email });
      setDonnees({ comptes: res.comptes, memoires: res.memoires, parametres: res.parametres });
      setPhase("salle");
    }).catch(() => {});
    return () => { vivant = false; };
  }, []);

  /* Banc d'essai : chaque geste se grave dans la pierre locale —
     les modifications survivent aux Alt+F5 et aux rechargements. */
  useEffect(() => {
    if (!CLOUD && donnees) sauverBanc(donnees);
  }, [donnees]);

  /* ════════ Le module de Synchronisation (Core) ════════
     Le nuage local ne fait foi : après chaque geste, et en pulsation
     toutes les 12 secondes, la salle réinterroge la Tombe — aucune
     info fantôme ne survit à une synchronisation. (En ligne seulement :
     le banc d'essai vit sa vie de simulation.) */
  const synchroniser = async () => {
    const res = await CLOUD.recharger();
    setDonnees({ comptes: res.comptes, memoires: res.memoires, parametres: res.parametres });
  };

  useEffect(() => {
    if (!CLOUD || phase !== "salle") return;
    const pulsation = setInterval(() => {
      synchroniser().catch(() => {}); /* la Tombe sommeille : on retentera */
    }, 12000);
    return () => clearInterval(pulsation);
  }, [phase]);

  const entrer = async () => {
    setErreur(null);
    if (!email.trim() || mdp.length < 4) {
      setErreur("Email et mot de passe requis (4 caractères min.).");
      return;
    }
    /* Simulation (canvas) : la porte se comporte comme en ligne — elle
       n'ouvre qu'au compte admin du registre simulé (le banc d'essai, lui,
       garde la mémoire à travers les déco-reco de la session). */
    if (!CLOUD) {
      const banc = donnees || lireBanc() || BANC;
      const cible = banc.comptes.find((c) => c.email === email.trim().toLowerCase());
      if (!cible) {
        setErreur("Sceau brisé : identifiants non reconnus par la Tombe.");
        return;
      }
      if (cible.role !== "admin") {
        setPhase("refus");
        return;
      }
      setSession({ pseudo: cible.pseudo + " (banc d'essai)", email: cible.email });
      setDonnees((d) => d || banc);
      setPhase("salle");
      return;
    }
    setEnChargement(true);
    try {
      const res = await CLOUD.connexion(email.trim().toLowerCase(), mdp);
      setSession({ pseudo: res.profil.pseudo, email: res.profil.email });
      setDonnees({ comptes: res.comptes, memoires: res.memoires, parametres: res.parametres });
      setPhase("salle");
    } catch (e) {
      if (e && e.refus) { setPhase("refus"); return; }
      setErreur((e && e.message) || "Serveur injoignable — vérifiez votre connexion.");
    } finally {
      setEnChargement(false);
    }
  };

  const rafraichir = async () => {
    /* Banc d'essai : la mémoire du banc survit au rafraîchissement,
       pas de retour aux comptes d'origine ici non plus. */
    if (!CLOUD) return;
    try {
      await synchroniser();
    } catch (e) { /* la salle garde ses chiffres en attendant mieux */ }
  };

  /* Poser ou retirer le sceau : valider / suspendre un compte du registre */
  const poserSceau = async (compte, statut) => {
    if (!CLOUD) {
      setDonnees(d => ({ ...d, comptes: d.comptes.map(c => (c.compte_id === compte.compte_id ? { ...c, statut } : c)) }));
      return;
    }
    try {
      await CLOUD.majStatut(compte.compte_id, statut);
      await synchroniser();
    } catch (e) { /* la salle garde ses chiffres en attendant mieux */ }
  };

  /* Basculer le mode de validation des inscriptions : sceau de l'admin ou lien email */
  const choisirMode = async (mode) => {
    const courant = (((donnees || {}).parametres || []).find(p => p.cle === "mode_validation") || {}).valeur;
    if (mode === courant) return;
    if (!CLOUD) {
      setDonnees(d => ({ ...d, parametres: [{ cle: "mode_validation", valeur: mode }] }));
      return;
    }
    try {
      await CLOUD.majMode(mode);
      await synchroniser();
    } catch (e) { /* la salle garde ses chiffres en attendant mieux */ }
  };

  /* Graver un compte joueur à la main : inscription + ligne compte,
     puis la salle se recharge pour inscrire le nouveau venu au registre. */
  const creerJoueur = async (pseudo, email, mdp) => {
    /* Avant toute gravure : la Tombe n'accepte pas deux sceaux sur le même
       email — le registre de l'admin voit toutes les lignes. */
    const existant = ((donnees || {}).comptes || []).some(
      (c) => (c.email || "").toLowerCase() === email.toLowerCase()
    );
    if (existant) {
      throw new Error("Un compte existe déjà avec cet email — la Tombe n'accepte pas les doublons.");
    }
    if (!CLOUD) {
      /* Banc d'essai : la ligne apparaît dans le registre — avec un
         identifiant TOUJOURS unique (max des sim-N + 1), même après des
         effacements : plus jamais deux comptes au même sceau, effacés ensemble. */
      setDonnees(d => {
        const nums = d.comptes
          .map((c) => /^sim-(\d+)$/.exec(c.compte_id || ""))
          .filter(Boolean)
          .map((m) => Number(m[1]));
        const n = (nums.length ? Math.max(...nums) : 0) + 1;
        return { ...d, comptes: [...d.comptes, {
          compte_id: "sim-" + n, pseudo: pseudo, tag: "JR-" + String(n + 3).padStart(4, "0"),
          email: email, role: "joueur", statut: "en_attente",
          cree_le: new Date().toISOString(), derniere_connexion: null
        }] };
      });
      return;
    }
    await CLOUD.creerCompte(pseudo, email, mdp);
    await synchroniser();
  };

  /* La sentence : effacer un compte et sa mémoire du registre — le
     serveur scelle l'adresse dans le tombeau, elle ne ressuscite pas. */
  const supprimerJoueur = async (compte) => {
    if (!CLOUD) {
      /* Banc d'essai : la ligne s'efface du registre simulé */
      setDonnees(d => ({ ...d, comptes: d.comptes.filter(c => c.compte_id !== compte.compte_id) }));
      return;
    }
    await CLOUD.supprimerCompte(compte.compte_id);
    await synchroniser();
  };

  const sortir = () => {
    if (CLOUD) CLOUD.deconnexion();
    setSession(null);
    /* En banc d'essai, la mémoire du banc survit à la déconnexion ;
       en ligne, la salle se vide — la prochaine entrée rechargera tout. */
    if (CLOUD) setDonnees(null);
    setEmail("");
    setMdp("");
    setPhase("porte");
  };

  if (phase === "salle") {
    return (
      <Salle session={session} donnees={donnees} onSortir={sortir}
        onRafraichir={rafraichir} onStatut={poserSceau} onMode={choisirMode} onCreer={creerJoueur}
        onSupprimer={supprimerJoueur} simulation={!CLOUD} />
    );
  }
  if (phase === "refus") {
    return <Refus onRetour={() => { setMdp(""); setPhase("porte"); }} />;
  }
  return (
    <Porte email={email} mdp={mdp} setEmail={setEmail} setMdp={setMdp}
      onEntrer={entrer} erreur={erreur} enChargement={enChargement} simulation={!CLOUD} />
  );
}

var _attente = document.getElementById("attente"); if (_attente) _attente.remove();
ReactDOM.createRoot(document.getElementById("racine")).render(<App />);
  </script>

  <script>
    /* PWA : service worker propre à la salle (portée /archivistereum/) */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
