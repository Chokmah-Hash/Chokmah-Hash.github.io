        Nom → châssis → code de fabrique → arme. PV et Rfx viennent du châssis (PV = W×3).
        Modules, wargear et protocoles : hors alpha — les places Mémoire/Calcul sont gravées pour la suite.
      </div>

      {/* ① Identité */}
      <input value={nom} onChange={e => setNom(e.target.value)} placeholder="Désignation de l'unité…"
        className="w-full rounded-lg px-3 py-2 mb-3 text-sm"
        style={{ background: "#0c0d10", border: "1px solid #3f3f46", color: "#e8e4d8" }} />

      {/* ② Châssis */}
      <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
        {PE_CHASSIS.map(c => (
          <button key={c.n} onClick={() => setChNom(c.n)} className="rounded-lg p-2.5 text-left"
            style={{ border: "1px solid " + (chNom === c.n ? accent : "#3f3f46"), background: chNom === c.n ? "#ffffff0d" : "#ffffff08" }}>
            <div className="font-bold text-sm" style={{ color: chNom === c.n ? accent : "#e8e4d8" }}>{c.n}</div>
            <div className="text-xs mt-0.5" style={{ color: "#a1a1aa" }}>
              CC {c.cc} · CT {c.ct} · F {c.f} · E {c.e} · PV {c.pv} · A {c.a} · Sv {c.sv} · Rfx {c.rfx}
            </div>
            <div className="text-xs mt-0.5" style={{ color: "#71717a" }}>Mémoire {c.mem} · Calcul {c.cal}</div>
          </button>
        ))}
      </div>

      {ch && (<>
        {/* ③ Code de fabrique */}
        <div className="text-xs mt-4 mb-1.5" style={{ color: "#71717a" }}>Code de fabrique de la lignée</div>
        <div className="flex flex-wrap gap-1.5">
          {PE_CODES.map(c => (
            <button key={c} onClick={() => setCode(c)} className="px-2.5 py-1 rounded-lg text-sm font-bold"
              style={{ background: code === c ? accent : "#14161b", color: code === c ? "#0a120f" : "#c8c8ce", border: "1px solid " + (code === c ? accent : "#3f3f46") }}>
              {c}
            </button>
          ))}
        </div>

        {/* ④ Arme de départ */}
        <div className="text-xs mt-4 mb-1.5" style={{ color: "#71717a" }}>Arme de départ — arsenal neutre (choix libre dans l'alpha)</div>
        <select value={armeId} onChange={e => setArmeId(e.target.value)} className="w-full rounded px-2 py-1.5 text-sm"
          style={{ background: "#14161b", color: "#e8e4d8", border: "1px solid #3f3f46" }}>
          {PE_ARMES.map(a => (
            <option key={a.id} value={a.id}>
              {a.nom} · {a.tir ? "tir" : "mêlée"} · {a.portee} · A {a.att} · F {a.f} · PA {a.pa} · D {a.d} · T{a.taille}
            </option>
          ))}
        </select>
        <div className="text-xs mt-1" style={{ color: "#71717a" }}>{arme.regle}</div>

        {/* ⑤ Aperçu dérivé */}
        <div className="flex gap-2 mt-3 text-center text-xs">
          <div className="flex-1 rounded-lg py-1.5" style={{ background: "#ffffff0d", color: "#e8e4d8" }}>PV <b>{ch.pv}</b></div>
          <div className="flex-1 rounded-lg py-1.5" style={{ background: "#ffffff0d", color: "#e8e4d8" }}>Initiative 1D6 <b>Rfx {ch.rfx}</b></div>
          <div className="flex-1 rounded-lg py-1.5" style={{ background: "#ffffff0d", color: "#e8e4d8" }}>Mémoire <b>{ch.mem}</b> · Calcul <b>{ch.cal}</b></div>
        </div>
        <div className="text-xs mt-2 rounded p-2" style={{ background: "#ffffff08", color: "#c8c8ce" }}>
          <b style={{ color: "#e8e4d8" }}>Aptitude de châssis — </b>{ch.apt}
        </div>
        <div className="flex flex-wrap gap-1 mt-2">
          {ch.cp.map(c => (
            <span key={c} className="text-xs px-1.5 py-0.5 rounded" style={{ background: accent + "22", color: accent }}>{c}</span>
          ))}
        </div>
      </>)}

      {/* Pied : annuler / éveiller */}
      <div className="flex gap-2 mt-4">
        <button onClick={onAnnule} className="flex-1 py-2 rounded-lg text-sm font-bold"
          style={{ background: "#0c0d10", color: "#a1a1aa", border: "1px solid #3f3f46" }}>✕ Annuler</button>
        <button onClick={valider} disabled={!peutValider}
          className="flex-1 py-2 rounded-lg text-sm font-bold"
          style={{ background: peutValider ? accent : "#27272a", color: peutValider ? "#0a120f" : "#71717a" }}>
          {peutValider ? `⟁ Éveiller ${nom.trim()}` : "⟁ Châssis, code et nom requis"}
        </button>
      </div>
    </div>
  );
}

/* ══════════ PackViewD100 : squelette alpha des packs d100 ══════════ */
function PackViewD100({ pack, onRetour, role }) {
  const T = pack.theme;
  const sb = pack.id === "stormbringer";
  const { journal, log, corrigerDernier } = useJournal();

  /* — état Stormbringer — */
  const [persoSBCree, setPersoSBCree] = useState(null); /* aventurier né de la création (remplace Vyon-Kesh) */
  const [enCreationSB, setEnCreationSB] = useState(false); /* écran de création de l'aventurier */
  const sbPerso = persoSBCree || SB_PERSO; /* fiche active : Vyon-Kesh (démo) ou l'aventurier créé */
  const c = sbPerso.caracs;
  const sourcesSB = [
    ...SB_7.map(k => ({ label: `${k} ${c[k]} — carac brute (${c[k]} %)`, seuil: c[k] })),
    { label: `POU×3 — lier un démon (${c.POU * 3} %)`, seuil: c.POU * 3 },
    { label: `CHA×2 — marchander (${c.CHA * 2} %)`, seuil: c.CHA * 2 },
    { label: `CHA×5 — marché démoniaque (${c.CHA * 5} %)`, seuil: c.CHA * 5 },
    ...Object.entries(sbPerso.competences || {}).map(([k, v]) => ({ label: `${k} (${v} %)`, seuil: v }))
  ];
  const [srcIdx, setSrcIdx] = useState(0);
  const [san, setSan] = useState(SB_PERSO.sanMax);
  const [ronde, setRonde] = useState(0);
  const [lutteFinie, setLutteFinie] = useState(null);

  /* — état Bloodlust — */
  const [enCreation, setEnCreation] = useState(false);   /* écran de création du porteur */
  const [persoCree, setPersoCree] = useState(null);      /* porteur né de la création (remplace Urkhar) */
  const [compIdx, setCompIdx] = useState(0);
  const [palierIdx, setPalierIdx] = useState(2);
  const [pts, setPts] = useState(BL_ARME.base); /* base de l'épée longue : 20 pts (livre p. 95) */
  const [acquis, setAcquis] = useState([]);
  const [jetsTable, setJetsTable] = useState({});    /* tableId → jets consommés */
  const [forge, setForge] = useState(null);          /* { a, b, tableId } — chiffres tirés, ordre à choisir */
  const [choixLibre, setChoixLibre] = useState(null);/* { tableId } — « Au choix du joueur » */
  const [armeEveillee, setArmeEveillee] = useState(false);
  const perso = persoCree || BL_PORTEUR; /* fiche active : Urkhar (démo) ou le porteur créé */
  const compsBL = Object.keys(perso.competences);

  /* Stormbringer : la lutte de POU (surcharge : 50 % ± 5 %/pt d'écart) */
  const lutterPOU = () => {
    const ecart = SB_DEMON.pou - c.POU;
    const pJ = 50 - 5 * ecart, pD = 50 + 5 * ecart;
    const rJ = resoudreD100(pJ, 0, "brp"), rD = resoudreD100(pD, 0, "brp");
    log("pou.jet", `Lutte de POU (round ${ronde + 1}) — ${sbPerso.nom} ${pJ} % → ${fmtD100(rJ.de)}${rJ.nat ? " · " + rJ.nat : ""} ; ${SB_DEMON.nom} ${pD} % → ${fmtD100(rD.de)}${rD.nat ? " · " + rD.nat : ""}`);
    if (rJ.reussi && !rD.reussi) {
      setLutteFinie("victoire"); setRonde(0);
      log("pou.victoire", "L'octogone tient — le démon est renvoyé au plan d'où il vient");
    } else if (rD.reussi && !rJ.reussi) {
      const perte = d6();
      const nv = Math.max(0, san - perte);
      setSan(nv); setLutteFinie("defaite"); setRonde(0);
      log("pou.defaite", `Le démon brise la lutte — ${perte} SAN perdus (${nv}/${sbPerso.sanMax})`);
      if (nv === 0) log("san.perdu", `SAN à zéro — l'âme de ${sbPerso.nom} vacille… (un repos la restaurera, squelette alpha)`);
    } else {
      setRonde(r => r + 1);
      log("pou.tension", "Les deux volontés tiennent — la lutte continue");
    }
  };
  const reposerSAN = () => {
    setSan(sbPerso.sanMax);
    log("san.repos", `Repos — Santé Mentale de ${sbPerso.nom} restaurée (squelette alpha)`);
  };

  /* Bloodlust : la forge de l'Arme vivante (tables officielles p. 96-100 ;
     total > 100 → l'arme s'éveille ; prix = palier 1 ; jets max par table) */
  const lancerForge = (tableId) => {
    if (armeEveillee) return;
    const t = BL_TABLES.find(x => x.id === tableId);
    if (!t || (t.max !== null && (jetsTable[tableId] || 0) >= t.max)) return;
    const a = Math.floor(Math.random() * 10), b = Math.floor(Math.random() * 10);
    setForge({ a, b, tableId });
    log("forge.des", `Forge d'${BL_ARME.nom} (${t.nom}) — d% tiré : ${a} et ${b} — le joueur choisit l'ordre des chiffres (la règle d'or du livre :D)`);
  };
  const ajouterPouvoir = (tableId, cle, pouvoir) => {
    if (acquis.some(p => p.tableId === tableId && p.nom === pouvoir.nom)) {
      log("forge.refus", `${pouvoir.nom} — déjà possédé : un même pouvoir ne s'acquiert qu'une fois, relancez`);
      return;
    }
    const t = BL_TABLES.find(x => x.id === tableId);
    const prixN1 = pouvoir.prix[0];
    const nvPts = pts + prixN1;
    const nvAcquis = [...acquis, { cle, tableId, nom: pouvoir.nom, prix: prixN1 }];
    const prestige = BL_TABLES.reduce((s, tb) => s + tb.prestige * nvAcquis.filter(p => p.tableId === tb.id).length, 0);
    setJetsTable(j => ({ ...j, [tableId]: (j[tableId] || 0) + 1 }));
    setAcquis(nvAcquis);
    setPts(nvPts);
    log("forge.achat", `${t.nom} ${fmtD100(cle)} — ${pouvoir.nom} · ${prixN1 > 0 ? "+" : ""}${prixN1} → total ${nvPts}/100`);
    if (nvPts > 100 && !armeEveillee) {
      setArmeEveillee(true);
      log("forge.fin", `Total ${nvPts} > 100 — ${BL_ARME.nom} s'ÉVEILLE ⚔ l'épée est terminée (prestige de l'arme : ${prestige} pts — nouveaux pouvoirs uniquement en jeu)`);
    }
  };
  const choisirOrdreForge = (premier) => {
    const { a, b, tableId } = forge;
    const t = BL_TABLES.find(x => x.id === tableId);
    setForge(null);
    const n = premier === "a" ? a * 10 + b : b * 10 + a;
    const cle = n === 0 ? 100 : n;
    const trouve = t.table.find(p => cle >= p.de[0] && cle <= p.de[1]);
    if (!trouve) return;
    if (trouve.prix === null) {
      setChoixLibre({ tableId });
      setJetsTable(j => ({ ...j, [tableId]: (j[tableId] || 0) + 1 }));
      log("forge.choix", `d% = ${fmtD100(cle)} — « Au choix du joueur » : le porteur désigne un pouvoir de la table ${t.nom}`);
      return;
    }
    ajouterPouvoir(tableId, cle, trouve);
  };
  /* Stormbringer : validation de la création d'un aventurier (écran dédié) */
  const validerCreationSB = (p) => {
    setPersoSBCree(p);
    setEnCreationSB(false);
    setSan(p.sanMax);
    log("perso.creation", `Fait naître ${p.nom}, ${p.origine} — 7 caracs 3D6 (total ${SB_7.reduce((s, k) => s + p.caracs[k], 0)}/52) · SAN ${p.sanMax} (POU ${p.caracs.POU}×5)`);
  };

  /* Bloodlust : validation de la création d'un porteur (écran dédié) */
  const validerCreation = (p) => {
    setPersoCree(p);
    setEnCreation(false);
    log("perso.creation", `Fait naître ${p.nom}, ${p.peuple} — PV ${p.caracs.EN * 2} · contrôle ${p.caracs.VO * 5} % (l'arme, elle, attend sa forge)`);
  };

  const testerControle = () => {
    const seuil = perso.caracs.VO * 5;
    const r = resoudreD100(seuil, 0, "bloodlust");
    log("controle.jet", `Test de contrôle — VO ${perso.caracs.VO} ×5 = ${seuil} % → ${fmtD100(r.de)}${r.nat ? " · " + r.nat : ""} — ${r.reussi ? "réussi" : "ÉCHOUÉ"}`);
    if (r.reussi) log("controle.ok", `${perso.nom} garde la main — la lame rumuse, mais elle obéit`);
    else log("controle.perdu", `${BL_ARME.nom} prend le dessus — ce round, c'est la Violence qui décide 😈`);
  };

  /* Jet libre étiqueté (la primitive du noyau-d100) */
  const jetLibre = () => {
    if (sb) {
      const src = sourcesSB[srcIdx];
      const r = resoudreD100(src.seuil, 0, "brp");
      log("libre.jet", `Jet libre — ${src.label} → ${fmtD100(r.de)}${r.nat ? " · " + r.nat : ""} — ${r.reussi ? "RÉUSSI" : "ÉCHOUÉ"}`);
    } else {
      const comp = compsBL[compIdx];
      const seuil = perso.competences[comp];
      const p = PALIERS_BL[palierIdx];
      const r = resoudreD100(seuil, p.mod, "bloodlust");
      const modTxt = p.mod > 0 ? "+" + p.mod : p.mod < 0 ? "−" + Math.abs(p.mod) : "±0";
      log("libre.jet", `Jet libre — ${comp} ${seuil} % (${p.label} ${modTxt}) → seuil ${r.sFinal} % → ${fmtD100(r.de)}${r.nat ? " · " + r.nat : ""} — ${r.reussi ? "RÉUSSI" : "ÉCHOUÉ"}`);
    }
  };

  return (
    <div className="min-h-screen" style={{ background: T.fond, fontFamily: "'Rajdhani','Segoe UI',system-ui,sans-serif" }}>
      <div className="max-w-4xl mx-auto px-5 py-6">
        <header className="flex items-center justify-between mb-6 pb-4" style={{ borderBottom: "1px solid " + T.accent + "33" }}>
          <button onClick={onRetour} className="px-3 py-1.5 rounded-lg text-sm font-bold" style={{ border: "1px solid " + T.accent + "66", color: T.accent }}>
            ← Hub
          </button>
          <div className="text-center">
            <div className="text-xl font-bold flex items-center justify-center gap-2" style={{ color: "#e8e4d8" }}>
              {pack.nom}
              {role && (
                <span className="text-xs px-1.5 py-0.5 rounded font-bold"
                  style={{ background: role === "mj" ? "#f0b24a22" : "#2ee6c922", color: role === "mj" ? "#f0b24a" : "#2ee6c9" }}>
                  {role === "mj" ? "MJ" : "JOUEUR"}
                </span>
              )}
            </div>
            <div className="text-xs" style={{ color: "#71717a" }}>
              {pack.type} · dépend de {pack.depend_de.map(d => d.id + "@" + d.format_min).join(", ")} · v{pack.version} · privé
            </div>
          </div>
          <div style={{ color: T.or }}>{pack.glyphs}</div>
        </header>

        <div className="grid md:grid-cols-2 gap-4 mb-5">
          {sb ? (
            enCreationSB ? (
              <div className="md:col-span-2">
                <EcranCreationAventurier accent={T.accent} onValide={validerCreationSB} onAnnule={() => setEnCreationSB(false)} />
              </div>
            ) : (
            <>
              {/* Fiche Stormbringer */}
              <div className="rounded-xl p-4" style={{ background: "#ffffff08", border: "1px solid " + T.accent + "33" }}>
                <div className="flex items-baseline justify-between mb-3">
                  <div className="font-bold text-lg" style={{ color: T.accent }}>{sbPerso.nom}</div>
                  <div className="text-xs" style={{ color: "#71717a" }}>{sbPerso.origine}</div>
                </div>
                <div className="grid grid-cols-4 gap-2 text-center text-sm">
                  {Object.entries(sbPerso.caracs).map(([k, v]) => (
                    <div key={k} className="rounded py-1.5" style={{ background: "#ffffff0d", color: "#e8e4d8" }}>
                      <span className="text-xs" style={{ color: "#71717a" }}>{k} </span>{v}
                    </div>
                  ))}
                </div>
                {sbPerso.competences ? (
                  <div className="grid grid-cols-2 gap-1.5 mt-2 text-xs">
                    {Object.entries(sbPerso.competences).map(([k, v]) => (
                      <div key={k} className="flex justify-between rounded px-2 py-1" style={{ background: "#ffffff08", color: "#c8c8ce" }}>
                        <span>{k}</span><span style={{ color: "#e8e4d8" }}>{v} %</span>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="text-xs mt-2 rounded px-2 py-1.5" style={{ background: "#ffffff08", color: "#71717a" }}>
                    Compétences du ch. 4 pas encore extraites — les jets se font sous les caracs (brute, ×2, ×3, ×5)
                  </div>
                )}
                <div className="mt-3">
                  <div className="text-xs mb-1" style={{ color: "#71717a" }}>Santé Mentale — POU×5 ({sbPerso.sanMax})</div>
                  <BarrePct valeur={san} max={sbPerso.sanMax} accent={T.accent} label={`${san} / ${sbPerso.sanMax} SAN`} />
                </div>
                <button onClick={() => setEnCreationSB(true)} className="w-full py-2 rounded-lg text-sm font-bold mt-2"
                  style={{ background: "#0c0d10", border: "1px solid " + T.accent + "66", color: T.accent }}>
                  {persoSBCree ? "↺ Créer un nouvel aventurier" : "⚔ Créer un aventurier"}
                </button>
              </div>

              {/* Démon + lutte de POU */}
              <div className="rounded-xl p-4" style={{ background: "#ffffff08", border: "1px solid #3f3f46" }}>
                <div className="flex items-baseline justify-between mb-3">
                  <div className="font-bold text-lg" style={{ color: "#e8e4d8" }}>{SB_DEMON.nom}</div>
                  <div className="text-xs" style={{ color: "#71717a" }}>adversaire de test</div>
                </div>
                <div className="text-xs mb-3" style={{ color: "#c8c8ce" }}>{SB_DEMON.ligne}</div>
                <div className="rounded p-2 mb-3 text-xs" style={{ background: "#ffffff08", color: "#c8c8ce" }}>
                  Lutte de POU : 50 % ± 5 % par point d'écart — POU {c.POU} vs {SB_DEMON.pou} →
                  {" "}{50 - 5 * (SB_DEMON.pou - c.POU)} % contre {50 + 5 * (SB_DEMON.pou - c.POU)} %
                </div>
                <div className="flex flex-col gap-2">
                  <button onClick={lutterPOU} className="py-2.5 rounded-lg font-bold text-black" style={{ background: T.accent }}>
                    ⚡ Lutter un round (test)
                  </button>
                  <button onClick={reposerSAN} className="py-2 rounded-lg text-sm font-bold"
                    style={{ border: "1px solid " + T.accent + "66", color: T.accent, background: "transparent" }}>
                    Repos — restaurer la SAN
                  </button>
                  {lutteFinie && (
                    <div className="text-center text-sm py-2 rounded" style={{ background: "#ffffff0d", color: lutteFinie === "victoire" ? T.accent : "#fb7185" }}>
                      {lutteFinie === "victoire" ? "Victoire — le démon regagne son plan." : "Défaite — le pacte a un prix."}
                    </div>
                  )}
                  <div className="text-xs text-center" style={{ color: "#71717a" }}>
                    Les deux réussissent ou échouent : la lutte se prolonge (relancez)
                  </div>
                </div>
              </div>
            </>
            )
          ) : enCreation ? (
            <div className="md:col-span-2">
              <EcranCreationPorteur accent={T.accent} onValide={validerCreation} onAnnule={() => setEnCreation(false)} />
            </div>
          ) : (
            <>
              {/* Fiche du porteur Bloodlust */}
              <div className="rounded-xl p-4" style={{ background: "#ffffff08", border: "1px solid " + T.accent + "33" }}>
                <div className="flex items-baseline justify-between mb-3">
                  <div className="font-bold text-lg" style={{ color: T.accent }}>{perso.nom}</div>
                  <div className="text-xs" style={{ color: "#71717a" }}>{perso.peuple}</div>
                </div>
                <div className="grid grid-cols-3 gap-2 text-center text-sm">
                  {Object.entries(perso.caracs).map(([k, v]) => (
                    <div key={k} className="rounded py-1.5" style={{ background: "#ffffff0d", color: "#e8e4d8" }}>
                      <span className="text-xs" style={{ color: "#71717a" }}>{k} </span>{v}
                    </div>
                  ))}
                </div>
                <div className="flex gap-2 mt-2 text-center text-xs">
                  <div className="flex-1 rounded py-1.5" style={{ background: "#ffffff0d", color: "#e8e4d8" }}>PV = EN×2 <b>{perso.caracs.EN * 2}</b></div>
                  <div className="flex-1 rounded py-1.5" style={{ background: "#ffffff0d", color: "#e8e4d8" }}>Contrôle = VO×5 <b>{perso.caracs.VO * 5} %</b></div>
                </div>
                <div className="text-xs mt-3 mb-1" style={{ color: "#71717a" }}>Désirs du peuple {perso.peuple} (livre p. 88 — un PJ ajuste de ±1 à ±2 par désir)</div>
                {Object.entries(perso.desirs).map(([k, v]) => (
                  <div key={k} className="mb-1.5">
                    <div className="flex justify-between text-xs mb-0.5">
                      <span style={{ color: "#c8c8ce" }}>{k}</span>
                      <span style={{ color: "#e8e4d8" }}>{v}/10{v >= 9 ? " 🔥" : ""}</span>
                    </div>
                    <PvBarre pv={v} pvMax={10} accent={v >= 8 ? T.accent : "#a8adb8"} />
                  </div>
                ))}
                <button onClick={() => setEnCreation(true)} className="w-full py-2 rounded-lg text-sm font-bold mt-2"
                  style={{ background: "#0c0d10", border: "1px solid " + T.accent + "66", color: T.accent }}>
                  {persoCree ? "↺ Créer un nouveau porteur" : "🧬 Créer un porteur"}
                </button>
              </div>

              {/* L'Arme vivante : forge (tables officielles) + contrôle */}
              <div className="rounded-xl p-4" style={{ background: "#ffffff08", border: "1px solid " + T.or + "44" }}>
                <div className="flex items-baseline justify-between mb-3">
                  <div className="font-bold text-lg" style={{ color: T.or }}>{BL_ARME.nom}</div>
                  <div className="text-xs" style={{ color: "#71717a" }}>{BL_ARME.nature} · base {BL_ARME.base} pts</div>
                </div>
                <div className="mb-3">
                  <BarrePct valeur={Math.min(pts, 100)} max={100} accent={T.or}
                    label={armeEveillee
                      ? `${pts} points — l'arme s'éveille ⚔ · prestige : ${BL_TABLES.reduce((s, tb) => s + tb.prestige * acquis.filter(p => p.tableId === tb.id).length, 0)} pts`
                      : `${pts} / 100 points de forge (base épée longue : ${BL_ARME.base})`} />
                </div>
                {acquis.length === 0 ? (
                  <div className="text-xs mb-3 text-center py-2 rounded" style={{ color: "#71717a", background: "#ffffff08" }}>
                    L'âme dort encore dans le métal — tirez le d% sur une table, puis choisissez l'ordre des chiffres
                  </div>
                ) : (
                  <div className="flex flex-col gap-1.5 mb-3">
                    {acquis.map(p => (
                      <div key={p.tableId + "-" + p.cle} className="flex justify-between items-center rounded px-2 py-1 text-xs" style={{ background: "#ffffff08" }}>
                        <span style={{ color: "#e8e4d8" }}>
                          <span className="px-1 rounded mr-1" style={{ background: T.or + "22", color: T.or }}>
                            {BL_TABLES.find(t => t.id === p.tableId).court}
                          </span>
                          {p.nom}
                        </span>
                        <span style={{ color: p.prix > 0 ? T.or : "#7dd3fc" }}>{p.prix > 0 ? "+" : ""}{p.prix}</span>
                      </div>
                    ))}
                  </div>
                )}
                <div className="flex flex-col gap-2">
                  {forge ? (
                    <div className="rounded-lg p-3 text-center" style={{ background: "#ffffff0d", border: "1px solid " + T.or + "44" }}>
                      <div className="text-xs mb-2" style={{ color: "#c8c8ce" }}>
                        {BL_TABLES.find(x => x.id === forge.tableId).nom} — chiffres tirés :{" "}
                        <b style={{ color: T.or }}>{forge.a}</b> et <b style={{ color: T.or }}>{forge.b}</b> — quel ordre ?
                      </div>
                      <div className="flex gap-2 justify-center">
                        <button onClick={() => choisirOrdreForge("a")} className="px-5 py-2 rounded-lg font-bold text-black" style={{ background: T.or }}>{forge.a}{forge.b}</button>
                        <button onClick={() => choisirOrdreForge("b")} className="px-5 py-2 rounded-lg font-bold text-black" style={{ background: T.or }}>{forge.b}{forge.a}</button>
                      </div>
                    </div>
                  ) : choixLibre ? (
                    <div className="rounded-lg p-3" style={{ background: "#ffffff0d", border: "1px solid " + T.or + "44" }}>
                      <div className="text-xs mb-2" style={{ color: "#c8c8ce" }}>
                        « Au choix du joueur » — {BL_TABLES.find(x => x.id === choixLibre.tableId).nom} : désignez le pouvoir
                      </div>
                      <select
                        onChange={e => {
                          const t = BL_TABLES.find(x => x.id === choixLibre.tableId);
                          const p = t.table.find(x => String(x.de[0]) === e.target.value);
                          if (!p) return;
                          setChoixLibre(null);
                          ajouterPouvoir(choixLibre.tableId, p.de[0], p);
                        }}
                        className="w-full rounded px-2 py-1.5 text-sm"
                        style={{ background: "#14161b", color: "#e8e4d8", border: "1px solid #3f3f46" }}>
                        <option value="">— choisir un pouvoir —</option>
                        {BL_TABLES.find(x => x.id === choixLibre.tableId).table.filter(p => p.prix !== null).map(p => (
                          <option key={p.de[0]} value={p.de[0]}>
                            {p.de[1] === p.de[0] ? fmtD100(p.de[0]) : fmtD100(p.de[0]) + "-" + fmtD100(p.de[1])} · {p.nom} · {p.prix[0] > 0 ? "+" : ""}{p.prix[0]}
                          </option>
                        ))}
                      </select>
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 gap-2">
                      {BL_TABLES.map(t => {
                        const n = jetsTable[t.id] || 0;
                        const bloque = armeEveillee || (t.max !== null && n >= t.max);
                        return (
                          <button key={t.id} onClick={() => lancerForge(t.id)} disabled={bloque}
                            className="py-2 rounded-lg text-sm font-bold"
                            style={{ background: bloque ? "#52525b" : T.or, color: bloque ? "#a1a1aa" : "#0c0d10", cursor: bloque ? "not-allowed" : "pointer" }}>
                            🎲 {t.nom.replace("Pouvoirs ", "")}
                            {t.max !== null && <span className="text-xs font-normal ml-1">({n}/{t.max})</span>}
                          </button>
                        );
                      })}
                    </div>
                  )}
                  {armeEveillee && (
                    <div className="text-center text-sm py-2 rounded" style={{ background: "#ffffff0d", color: T.or }}>
                      ⚔ {BL_ARME.nom} est éveillée — la forge est close (nouveaux pouvoirs en jeu, par l'XP)
                    </div>
                  )}
                  <button onClick={testerControle} className="py-2 rounded-lg text-sm font-bold"
                    style={{ border: "1px solid " + T.accent + "66", color: T.accent }}>
                    Test de contrôle — VO×5 (test)
                  </button>
                  <div className="text-xs text-center" style={{ color: "#71717a" }}>
                    Tables officielles p. 96-100 · prix = palier 1 · un même pouvoir une seule fois ·
                    exotiques 4 jets max · limitations 2 jets max · « 99-00 » : au choix du joueur
                  </div>
                </div>
              </div>
            </>
          )}
        </div>

        {/* Jet libre (masqué pendant une création — Stormbringer ou Bloodlust) */}
        {(sb ? !enCreationSB : !enCreation) && (
        <div className="rounded-xl p-4 mb-5" style={{ background: "#ffffff08", border: "1px solid " + T.accent + "33" }}>
          <div className="font-bold mb-3" style={{ color: T.accent }}>🎲 Jet libre étiqueté</div>
          <div className="flex flex-wrap items-center gap-3">
            {sb ? (
              <label className="text-sm" style={{ color: "#c8c8ce" }}>
                Sous{" "}
                <select value={srcIdx} onChange={e => setSrcIdx(Number(e.target.value))}
                  className="ml-1 rounded px-2 py-1" style={{ background: "#14161b", color: "#e8e4d8", border: "1px solid #3f3f46" }}>
                  {sourcesSB.map((s, i) => <option key={i} value={i}>{s.label}</option>)}
                </select>
              </label>
            ) : (
              <>
                <label className="text-sm" style={{ color: "#c8c8ce" }}>
                  Compétence{" "}
                  <select value={compIdx} onChange={e => setCompIdx(Number(e.target.value))}
                    className="ml-1 rounded px-2 py-1" style={{ background: "#14161b", color: "#e8e4d8", border: "1px solid #3f3f46" }}>
                    {compsBL.map((k, i) => <option key={k} value={i}>{k} — {perso.competences[k]} %</option>)}
                  </select>
                </label>
                <div className="flex rounded overflow-hidden" style={{ border: "1px solid #3f3f46" }}>
                  {PALIERS_BL.map((p, i) => (
                    <button key={p.label} onClick={() => setPalierIdx(i)} className="px-2.5 py-1 text-xs"
                      style={{ background: palierIdx === i ? T.accent : "#14161b", color: palierIdx === i ? "#0c0d10" : "#c8c8ce" }}>
                      {p.label}
                    </button>
                  ))}
                </div>
              </>
            )}
            <button onClick={jetLibre} className="px-4 py-1.5 rounded-lg font-bold text-black" style={{ background: T.or }}>
              Lancer 1D100
            </button>
            <span className="text-xs" style={{ color: "#71717a" }}>
              1D100 ≤ seuil · plancher 5 % · « 00 » échec automatique
              {sb ? " · « 01 » réussite critique" : " · critique = unités 0, échec critique = unités 1"}
            </span>
          </div>
        </div>
        )}

        {/* Journal append-only */}
        <JournalBloc journal={journal} corriger={corrigerDernier} accent={T.accent} or={T.or}
          surcharges={SURCHARGES_D100[pack.id].join(" · ")} />
      </div>
    </div>
  );
}

/* ══════════ L'app : le hub, le chargement du pack, le pack ══════════ */
function App() {
  const [vue, setVue] = useState("hub");
  const [packActif, setPackActif] = useState(null);
  const [favoris, setFavoris] = useState([]);
  const [installes, setInstalles] = useState([]);
  const [enInstallation, setEnInstallation] = useState(null);
  const [toast, setToast] = useState(null);
  const [etapes, setEtapes] = useState([]);
  const [totalEtapes, setTotalEtapes] = useState(7);
  const [rolesPacks, setRolesPacks] = useState({}); // packId → rôle du DERNIER lancement ("mj" | "joueur")
  const [rolePour, setRolePour] = useState(null);    // pack en attente du choix de rôle, au lancement

  /* Les comptes — phase 1 : profils locaux (UUID stable). Tous les comptes sont
     joueurs ; le rôle (MJ ou joueur) se choisit pack par pack, au lancement.
     Le vrai mot de passe arrivera avec le serveur (Supabase) ; l'Archiviste ne
     garde jamais les mots de passe. */
  const [profils, setProfils] = useState(PROFILS_INIT);
  const [session, setSession] = useState(null);

  /* Sauvegarde simulée des choix PAR COMPTE : installations, favoris, rôles.
     Phase locale : en mémoire de l'app (tant qu'elle tourne). Phase serveur :
     ce sera exactement cette structure qui vivra dans la base du compte. */
  const [memoireComptes, setMemoireComptes] = useState({});

  const seConnecter = (p) => {
    /* En mode CLOUD, la mémoire arrive DU NUAGE avec le profil (p.memoire) ;
       en simulation, elle vit dans le sac du compte local. */
    const memo = (CLOUD && p.memoire) || memoireComptes[p.compteId] || {};
    setInstalles(memo.installes || []);
    setFavoris(memo.favoris || []);
    setRolesPacks(memo.rolesPacks || {});
    setSession(p);
    showToast((memo.installes || []).length
      ? `Bienvenue, ${p.pseudo} — bibliothèque restaurée (${memo.installes.length} pack${memo.installes.length > 1 ? "s" : ""})`
      : `Bienvenue, ${p.pseudo} — ${CLOUD ? "compte connecté" : "profil local connecté"}`);
  };

  const seDeconnecter = () => {
    /* On range les choix dans le sac du compte (installations, favoris, rôles),
       puis on rafraîchit l'écran : le launcher repart vierge, mais rien n'est
       perdu — la bibliothèque est restaurée à la reconnexion. */
    if (session) {
      setMemoireComptes(m => ({ ...m, [session.compteId]: { installes, favoris, rolesPacks } }));
    }
    if (CLOUD) CLOUD.deconnexion().catch(() => {});
    setSession(null);
    setInstalles([]);
    setFavoris([]);
    setRolesPacks({});
    setEnInstallation(null);
    setRolePour(null);
    setPackActif(null);
    showToast("Session fermée — le magasin reste ouvert");
  };

  const creerProfil = (profil) => {
    /* En mode CLOUD : le profil arrive du nuage — UUID serveur + tag JR-000n
       attribué par la base. En simulation : UUID local gravé à la création. */
    const p = profil.compteId ? profil : (() => {
      const n = profils.length + 1;
      return {
        compteId: Math.floor(Math.random() * 4294967296).toString(16).padStart(8, "0"),
        pseudo: profil.pseudo,
        tag: "JR-" + String(n).padStart(4, "0"),
        email: profil.email, avatarId: profil.avatarId
      };
    })();
    setProfils(l => [...l, p]);
    seConnecter(p);
  };

  const changerAvatar = (id) => {
    setSession(s => (s ? { ...s, avatarId: id } : s));
    setProfils(l => l.map(p => (session && p.compteId === session.compteId ? { ...p, avatarId: id } : p)));
    if (CLOUD && session) CLOUD.sauveCompte({ avatarId: id }).catch(() => {});
  };

  /* Mode CLOUD — restauration de session au démarrage : si un compte est déjà
     connecté (token gardé par le navigateur), sa bibliothèque est restaurée
     depuis le nuage, comme sur Steam. */
  useEffect(() => {
    if (!CLOUD) return;
    CLOUD.sessionActuelle().then(p => { if (p) seConnecter(p); }).catch(() => {});
  }, []);

  /* Mode CLOUD — le sac du compte (installations, favoris, rôles) part dans le
     nuage dès qu'il change (débouncé) : l'état vit dans le compte, jamais
     dans l'appareil. */
  useEffect(() => {
    if (!CLOUD || !session) return;
    const t = setTimeout(
      () => CLOUD.sauveMemoire(session.compteId, { installes, favoris, rolesPacks }).catch(() => {}),
      700
    );
    return () => clearTimeout(t);
  }, [session, installes, favoris, rolesPacks]);

  /* Le glyphe du launcher : l'Icosaèdre D20 — CHOISI par Michael, point final.
     La Cible aux quatre coupes reste dans la bibliothèque de symboles de
     l'Archivisterium. */
  const [symbole] = useState("d20");

  /* Détection navigateur / mobile : la largeur d'écran réelle du device.
     Sur mobile, le compte n'affiche que l'avatar (comme Steam). */
  const [estMobile, setEstMobile] = useState(false);
  const [ecran, setEcran] = useState("auto"); // auto | desktop | mobile (simulation forcée)
  useEffect(() => {
    if (typeof window === "undefined" || !window.matchMedia) return;
    const mq = window.matchMedia("(max-width: 640px)");
    const maj = () => setEstMobile(mq.matches);
    maj();
    mq.addEventListener("change", maj);
    return () => mq.removeEventListener("change", maj);
  }, []);
  const mobile = ecran === "auto" ? estMobile : ecran === "mobile";

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2600);
  };

  const basculerFavori = (id) =>
    setFavoris(f => (f.includes(id) ? f.filter(x => x !== id) : [...f, id]));

  /* Installer un pack depuis le magasin : simulation de téléchargement local —
     SANS choix de rôle (tous les comptes sont joueurs, le rôle se choisit au
     lancement). Une fois installé, la vignette du magasin passe en "Déjà
     installé" (grisée), et le pack se lance depuis la Bibliothèque. */
  const installerPack = (p) => {
    setEnInstallation(p.id);
    setTimeout(() => {
      setEnInstallation(null);
      setInstalles(l => (l.includes(p.id) ? l : [...l, p.id]));
      showToast(`${p.nom} installé — lancez-le depuis la Bibliothèque`);
    }, 1500);
  };

  /* Lancer un pack depuis la Bibliothèque : d'abord le choix du rôle (MJ ou
     joueur — c'est LÀ qu'on décide, pas à l'installation, pas dans le compte),
     puis le chargement simulé avec le rôle de session appliqué. */
  const lancerPack = (p) => setRolePour(p);

  const choisirRole = (role) => {
    const p = rolePour;
    setRolePour(null);
    setRolesPacks(r => ({ ...r, [p.id]: role }));
    setPackActif(p);
    setVue("chargement");
    setEtapes([]);
    const liste = etapesChargement(p, role);
    setTotalEtapes(liste.length);
    liste.forEach((t, i) => setTimeout(() => setEtapes(e => [...e, t]), 320 * (i + 1)));
    setTimeout(() => setVue("pack"), 320 * liste.length + 550);
  };

  return (
    <div className="min-h-screen" style={{ background: "#0c0d10" }}>
      {vue === "hub" && (
        <Hub key={session ? session.compteId : "anonyme"} packs={PACKS} favoris={favoris} onFavori={basculerFavori} onLancer={lancerPack} onInstaller={installerPack}
          showToast={showToast}
          joueur={session}
          avatar={session ? (AVATARS.find(a => a.id === session.avatarId) || AVATARS[0]) : null}
          onAvatar={changerAvatar}
          onLogout={seDeconnecter}
          onLogin={seConnecter} onCreer={creerProfil} profils={profils}
          mobile={mobile} ecran={ecran} setEcran={setEcran}
          installes={installes} enInstallation={enInstallation}
          symbole={symbole} />
      )}

      {vue === "chargement" && packActif && (
        <div className="min-h-screen flex items-center justify-center" style={{ background: packActif.theme.fond, fontFamily: "'Rajdhani','Segoe UI',system-ui,sans-serif" }}>
          <div className="rounded-2xl p-8 w-full max-w-md" style={{ background: "#ffffff0a", border: "1px solid " + packActif.theme.accent + "44" }}>
            <div className="flex items-center gap-3 mb-5">
              <Icosaedre size={38} color={packActif.theme.accent} />
              <div>
                <div className="font-bold text-lg" style={{ color: "#e8e4d8" }}>Chargement de {packActif.nom}…</div>
                <div className="text-xs" style={{ color: "#71717a" }}>pack installé — chargement local, aucune connexion requise</div>
              </div>
            </div>
            <div className="flex flex-col gap-2 text-sm">
              {etapes.map((e, i) => (
                <div key={i} style={{ color: "#c8c8ce" }}>✓ {e}</div>
              ))}
              {etapes.length < totalEtapes && <div className="animate-pulse" style={{ color: packActif.theme.accent }}>⟁ …</div>}
            </div>
          </div>
        </div>
      )}

      {vue === "pack" && packActif && (
        packActif.id === "stormbringer" || packActif.id === "bloodlust" ? (
          <PackViewD100 pack={packActif} role={rolesPacks[packActif.id]} onRetour={() => setVue("hub")} />
        ) : (
          <PackView pack={packActif} role={rolesPacks[packActif.id]} onRetour={() => setVue("hub")} />
        )
      )}

      {rolePour && (
        <ChoixRole pack={rolePour} onChoisi={choisirRole} onAnnuler={() => setRolePour(null)} />
      )}

      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-2.5 rounded-xl text-sm font-bold text-black shadow-2xl z-50"
          style={{ background: "#a8adb8" }}>
          {toast}
        </div>
      )}
    </div>
  );
}

var _attente = document.getElementById("attente"); if (_attente) _attente.remove();
ReactDOM.createRoot(document.getElementById("racine")).render(<App />);
  </script>

  <script>
    /* Le service worker : l'Archiviste s'installe et sait se rouvrir hors ligne */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
