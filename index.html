<!doctype html>
<html lang="fr">
<head>

  <meta name="description" content="L'Archiviste — le launcher des JDR papier : un moteur, des packs." />
  <!-- PWA : l'Archiviste est une APP à installer -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0c0d10" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="react-dom.production.min.js"></script>
  <!-- Tailwind COMPILÉ à la forge et hébergé dans le dépôt : plus AUCUN CDN dans la page -->

    body { margin: 0; background: #0c0d10; font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif; }

  </style>
</head>
<body>
  <div id="attente">⟁ L'ARCHIVISTE OUVRE SES ARCHIVES…</div>
  <div id="racine"></div>
  <noscript>L'Archiviste a besoin de JavaScript pour ouvrir ses archives.</noscript>

  <!-- La garde de l'antichambre : si les archives n'ouvrent pas, elle parle au lieu de figer -->
  <script>
    setTimeout(function () {
      var a = document.getElementById("attente");
      if (a) a.innerHTML = "⚠ Les archives tardent — rechargez la page (Ctrl+Shift+R).";
    }, 12000);
  </script>

  <script>
    /* Clé publique Supabase — publique par design (RLS protège les données) */
    var CLE_PUBLIQUE = "sb_publishable_U_ADFiAlPqWodkQFybynPg_5Mbctjov";
  </script>

  <script>window.LARCHIVISTE_CLOUD = function () {
  "use strict";

  var URL = "https://dnbnkdakmobufqcrqzpq.supabase.co";
  var CLE = "larchiviste_session_v1";
  var compteCourant = null;
  function lire() {
    try {
      return JSON.parse(localStorage.getItem(CLE) || "null");
    } catch (e) {
      return null;
    }
  }
  function ecrire(m) {
    try {
      if (m) localStorage.setItem(CLE, JSON.stringify(m));else localStorage.removeItem(CLE);
    } catch (e) {}
  }
  function api(chemin, opts) {
    opts = opts || {};
    var headers = {
      apikey: CLE_PUBLIQUE,
      "Content-Type": "application/json"
    };
    if (opts.token) headers["Authorization"] = "Bearer " + opts.token;
    if (opts.prefer) headers["Prefer"] = opts.prefer;
    return fetch(URL + chemin, {
      cache: "no-store",
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.json().catch(function () {
        return null;
      }).then(function (data) {
        if (!res.ok) {
          var code = data && (data.error_code || data.code) || "";
          var msgBrut = data && (data.msg || data.message) || "";
          var msgs = {
            invalid_credentials: "Email ou mot de passe incorrect.",
            user_already_exists: "Un compte existe déjà sur cet email — connectez-vous.",
            signups_disabled: "Les inscriptions sont fermées sur le serveur — l'administrateur doit les rouvrir.",
            weak_password: "Mot de passe trop faible — 4 caractères minimum.",
            over_email_rate_limit: "Trop d'emails envoyés par le serveur — patientez quelques minutes.",
            email_not_confirmed: "Cet email n'est pas encore confirmé — ouvrez le message reçu, puis revenez.",
            email_address_invalid: "Adresse email invalide — vérifiez son orthographe."
          };
          if (msgBrut.indexOf("inscriptions desactivees") >= 0) {
            code = "signups_disabled";
          }
          var err = new Error(msgs[code] || msgBrut || "Serveur injoignable — vérifiez votre connexion.");
          err.code = code;
          err.statut = res.status;
          throw err;
        }
        return data;
      });
    });
  }
  function profilDepuis(user, compte) {
    var meta = user && user.user_metadata || {};
    return {
      compteId: user.id,
      pseudo: compte && compte.pseudo || meta.pseudo || "Joueur",
      tag: compte && compte.tag || "JR-????",
      email: user.email,
      avatarId: compte && compte.avatar_ref || meta.avatar_ref || "tombe",
      statut: compte && compte.statut || "actif",
      role: compte && compte.role || "joueur",
      memoire: {}
    };
  }
  function chargerTout(token, user, opts) {
    var comptes = Promise.resolve(api("/rest/v1/archiviste_comptes?select=*", {
      token: token
    })).then(function (lignes) {
      if (lignes && lignes.length) return lignes[0];
      var meta = user.user_metadata || {};
      return api("/rest/v1/archiviste_comptes", {
        method: "POST",
        token: token,
        prefer: "return=representation",
        body: {
          compte_id: user.id,
          pseudo: meta.pseudo || "Joueur",
          email: user.email,
          avatar_ref: meta.avatar_ref || "tombe"
        }
      }).then(function (cree) {
        return cree && cree[0];
      });
    });
    return comptes.then(function (compte) {
      compteCourant = user.id;
      if (!opts || opts.horodater !== false) {
        api("/rest/v1/archiviste_comptes?compte_id=eq." + user.id, {
          method: "PATCH",
          token: token,
          body: {
            derniere_connexion: new Date().toISOString()
          }
        }).catch(function () {});
      }
      var profil = profilDepuis(user, compte);
      return api("/rest/v1/archiviste_memoire?select=contenu&compte_id=eq." + user.id, {
        token: token
      }).then(function (mem) {
        profil.memoire = mem && mem[0] && mem[0].contenu || {};
        return profil;
      });
    });
  }
  function tempsReel(opts) {
    opts = opts || {};
    var tables = opts.tables || [];
    var surChangement = opts.surChangement || function () {};
    var surEtat = opts.surEtat || function () {};
    var presenceCle = opts.presenceKey || null;
    var surPresence = opts.surPresence || null;
    var presenceInfo = typeof opts.presenceInfo === "function" ? opts.presenceInfo : null;
    var pister = function (payload) {
      if (!ws || ws.readyState !== 1 || !presenceCle) return;
      ws.send(JSON.stringify({
        topic: "realtime:tombe",
        event: "presence",
        payload: {
          type: "presence",
          event: "track",
          payload: payload || {
            compte_id: presenceCle
          }
        },
        ref: "piste"
      }));
    };
    if (typeof WebSocket === "undefined") {
      surEtat("coupure");
      return {
        fermer: function () {}
      };
    }
    var m0 = lire();
    if (!m0 || !m0.access_token) {
      surEtat("coupure");
      return {
        fermer: function () {}
      };
    }
    var ws = null,
      coeur = null,
      ferme = false,
      essais = 0;
    function brancher() {
      if (ferme) return;
      var jeton = (lire() || m0 || {}).access_token || "";
      try {
        ws = new WebSocket("wss://dnbnkdakmobufqcrqzpq.supabase.co/realtime/v1/websocket?apikey=" + CLE_PUBLIQUE + "&vsn=1.0.0");
      } catch (e) {
        retomber();
        return;
      }
      ws.onopen = function () {
        essais = 0;
        if (coeur) clearInterval(coeur);
        coeur = setInterval(function () {
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({
              topic: "phoenix",
              event: "heartbeat",
              payload: {},
              ref: "battement"
            }));
          }
        }, 25000);
        tables.forEach(function (t) {
          var suivi = {
            event: "*",
            schema: "public",
            table: t.table
          };
          if (t.filtre) suivi.filter = t.filtre;
          ws.send(JSON.stringify({
            topic: "realtime:public:" + t.table,
            event: "phx_join",
            payload: {
              config: {
                broadcast: {
                  self: false
                },
                presence: {
                  key: ""
                },
                postgres_changes: [suivi]
              },
              access_token: jeton
            },
            ref: t.table
          }));
        });
        if (presenceCle) {
          ws.send(JSON.stringify({
            topic: "realtime:tombe",
            event: "phx_join",
            payload: {
              config: {
                broadcast: {
                  self: false
                },
                presence: {
                  key: presenceCle
                },
                postgres_changes: []
              },
              access_token: jeton
            },
            ref: "presence"
          }));
          pister(presenceInfo ? presenceInfo() : {
            compte_id: presenceCle
          });
        }
        surEtat("branche");
      };
      ws.onmessage = function (ev) {
        var msg;
        try {
          msg = JSON.parse(ev.data);
        } catch (e) {
          return;
        }
        if (msg.event === "postgres_changes" && msg.payload && msg.payload.data) {
          surChangement(msg.payload.data);
        }
        if (surPresence && (msg.event === "presence_state" || msg.event === "presence_diff")) {
          surPresence(msg.payload || {}, msg.event);
        }
      };
      ws.onclose = retomber;
      ws.onerror = function () {
        try {
          ws.close();
        } catch (e) {}
      };
    }
    function retomber() {
      if (coeur) {
        clearInterval(coeur);
        coeur = null;
      }
      if (ferme) return;
      surEtat("coupure");
      setTimeout(brancher, Math.min(5000 + essais * 5000, 30000));
      essais++;
    }
    brancher();
    return {
      fermer: function () {
        ferme = true;
        if (coeur) clearInterval(coeur);
        if (ws) {
          try {
            ws.close();
          } catch (e) {}
        }
        ws = null;
      },
      annoncer: function (payload) {
        pister(payload);
      }
    };
  }
  return {
    connexion: function (email, mdp) {
      return api("/auth/v1/token?grant_type=password", {
        method: "POST",
        body: {
          email: email,
          password: mdp
        }
      }).then(function (d) {
        ecrire({
          access_token: d.access_token,
          refresh_token: d.refresh_token
        });
        return chargerTout(d.access_token, d.user);
      });
    },
    inscription: function (pseudo, email, mdp, avatarId) {
      return api("/auth/v1/signup", {
        method: "POST",
        body: {
          email: email,
          password: mdp,
          data: {
            pseudo: pseudo,
            avatar_ref: avatarId
          }
        }
      }).then(function (d) {
        var session = d.session || (d.access_token ? d : null);
        if (session && session.access_token) {
          ecrire({
            access_token: session.access_token,
            refresh_token: session.refresh_token
          });
          return chargerTout(session.access_token, d.user || session.user);
        }
        var err = new Error("Un email de confirmation vous attend — ouvrez-le, puis revenez vous connecter.");
        err.confirmation = true;
        throw err;
      });
    },
    sessionActuelle: function (opts) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve(null);
      return api("/auth/v1/user", {
        token: m.access_token
      }).then(function (user) {
        return chargerTout(m.access_token, user, opts);
      }).catch(function () {
        if (!m.refresh_token) {
          ecrire(null);
          return null;
        }
        return api("/auth/v1/token?grant_type=refresh_token", {
          method: "POST",
          body: {
            refresh_token: m.refresh_token
          }
        }).then(function (d) {
          ecrire({
            access_token: d.access_token,
            refresh_token: d.refresh_token
          });
          return chargerTout(d.access_token, d.user, opts);
        }).catch(function () {
          ecrire(null);
          return null;
        });
      });
    },
    deconnexion: function () {
      var m = lire();
      ecrire(null);
      compteCourant = null;
      if (m && m.access_token) {
        return api("/auth/v1/logout", {
          method: "POST",
          token: m.access_token
        }).catch(function () {});
      }
      return Promise.resolve();
    },
    perdu: function (email) {
      return api("/auth/v1/recover", {
        method: "POST",
        body: {
          email: email
        }
      });
    },
    sauveMemoire: function (compteId, contenu) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve();
      return api("/rest/v1/archiviste_memoire", {
        method: "POST",
        token: m.access_token,
        prefer: "resolution=merge-duplicates",
        body: {
          compte_id: compteId,
          contenu: contenu
        }
      });
    },
    lireParametres: function () {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve(null);
      return api("/rest/v1/parametres?select=cle,valeur", {
        token: m.access_token
      }).catch(function () {
        return null;
      });
    },
    sauveCompte: function (patch) {
      var m = lire();
      if (!m || !m.access_token || !compteCourant) return Promise.resolve();
      var body = {};
      if (patch && patch.avatarId !== undefined) body.avatar_ref = patch.avatarId;
      return api("/rest/v1/archiviste_comptes?compte_id=eq." + compteCourant, {
        method: "PATCH",
        token: m.access_token,
        body: body
      });
    },
    envoyerConsole: function (compteId, contenu, type, donnees, partieId, packId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve();
      return api("/rest/v1/archiviste_console", {
        method: "POST",
        token: m.access_token,
        body: {
          compte_id: compteId,
          contenu: contenu,
          type: type || "message",
          donnees: donnees || {},
          partie_id: partieId || null,
          jeu: packId || null
        }
      });
    },
    lireConsole: function (partieId, packId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve([]);
      var filtre = partieId ? "partie_id=eq." + encodeURIComponent(partieId) : packId ? "partie_id=is.null&jeu=eq." + encodeURIComponent(packId) : "partie_id=is.null&jeu=is.null";
      return api("/rest/v1/archiviste_console?select=id,pseudo,role,contenu,type,donnees,cree_le,partie_id,jeu&" + filtre + "&order=id.desc&limit=60", {
        token: m.access_token
      }).then(function (l) {
        return l || [];
      }).catch(function () {
        return [];
      });
    },
    lancerDes: function (nb, faces, note, partieId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve();
      return api("/rest/v1/rpc/lancer_des", {
        method: "POST",
        token: m.access_token,
        body: {
          nb: nb,
          faces: faces,
          note: note || null,
          p_partie: partieId || null
        }
      });
    },
    creerPartie: function (jeu, nom, compteId, mod) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve(null);
      var corps = {
        jeu: jeu,
        nom: nom || "Aventure sans nom",
        mj_compte_id: compteId,
        mod: mod || "live"
      };
      if ((mod || "") === "solo") {
        corps.statut = "en_cours";
        corps.lance_le = new Date().toISOString();
        corps.salle_ouverte_le = new Date().toISOString();
        corps.visibilite = "publique";
      }
      return api("/rest/v1/archiviste_parties", {
        method: "POST",
        token: m.access_token,
        prefer: "return=representation",
        body: corps
      }).then(function (l) {
        return l && l[0] || null;
      });
    },
    chargerModsParJeu: function () {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve({});
      return api("/rest/v1/archiviste_parties?select=jeu,mod&supprime_le=is.null&mod=not.is.null&mod=neq.solo", {
        token: m.access_token
      }).then(function (l) {
        var carte = {};
        (l || []).forEach(function (p) {
          if (!p.jeu || !p.mod) return;
          if (!carte[p.jeu]) carte[p.jeu] = {};
          carte[p.jeu][p.mod] = true;
        });
        return carte;
      }).catch(function () {
        return {};
      });
    },
    listerParties: function (jeu) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve([]);
      var qO = api("/rest/v1/archiviste_parties_lobby?select=*" + "&jeu=eq." + encodeURIComponent(jeu) + "&statut=eq.ouverte&salle_ouverte_le=not.is.null&visibilite=in.(publique,privee)&supprime_le=is.null&mod=neq.solo&order=cree_le.asc", {
        token: m.access_token
      }).catch(function () {
        return [];
      });
      var qC = api("/rest/v1/archiviste_parties_lobby?select=*" + "&jeu=eq." + encodeURIComponent(jeu) + "&statut=eq.en_cours&visibilite=in.(publique,privee)&supprime_le=is.null&mod=neq.solo&order=lance_le.desc", {
        token: m.access_token
      }).catch(function () {
        return [];
      });
      return Promise.all([qO, qC]).then(function (l) {
        return (l[0] || []).concat(l[1] || []);
      });
    },
    listerPartiesSolo: function (jeu) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve([]);
      return api("/rest/v1/archiviste_parties_lobby?select=*" + "&jeu=eq." + encodeURIComponent(jeu) + "&mod=eq.solo&supprime_le=is.null&order=cree_le.asc", {
        token: m.access_token
      }).catch(function () {
        return [];
      });
    },
    mesParties: function (jeu, compteId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve([]);
      var qC = api("/rest/v1/archiviste_parties_lobby?select=*" + "&jeu=eq." + encodeURIComponent(jeu) + "&statut=eq.en_cours&supprime_le=is.null&order=lance_le.asc", {
        token: m.access_token
      }).catch(function () {
        return [];
      });
      var qO = api("/rest/v1/archiviste_parties_lobby?select=*" + "&jeu=eq." + encodeURIComponent(jeu) + "&statut=eq.ouverte&salle_ouverte_le=not.is.null&supprime_le=is.null&order=salle_ouverte_le.desc", {
        token: m.access_token
      }).catch(function () {
        return [];
      });
      var qJ = api("/rest/v1/archiviste_partie_joueurs?select=partie_id&compte_id=eq." + compteId, {
        token: m.access_token
      }).catch(function () {
        return [];
      });
      return Promise.all([qC, qO, qJ]).then(function (r) {
        var ids = {};
        (r[2] || []).forEach(function (pj) {
          ids[pj.partie_id] = true;
        });
        var vus = {},
          liste = [];
        (r[0] || []).concat(r[1] || []).forEach(function (p) {
          if (vus[p.id]) return;
          vus[p.id] = true;
          if (p.mj_compte_id === compteId || ids[p.id]) liste.push(p);
        });
        return liste;
      });
    },
    mesAventures: function (jeu, compteId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve([]);
      return api("/rest/v1/archiviste_parties_lobby?select=*" + "&jeu=eq." + encodeURIComponent(jeu) + "&mj_compte_id=eq." + compteId + "&supprime_le=is.null" + "&order=cree_le.desc", {
        token: m.access_token
      }).catch(function () {
        return [];
      });
    },
    supprimerPartie: function (id) {

          p_id: id
        }

    lirePartie: function (id) {

        return l && l[0] || null;
      }).catch(function () {

      });

      });

    rejoindrePartie: function (partieId, compteId) {

    rejoindrePrivee: function (jeu, mdp) {

        }

    ouvrirSalle: function (id, visibilite, mdp) {
      var m = lire();
      if (!m || !m.access_token) return Promise.reject(new Error("Hors ligne."));
      return api("/rest/v1/rpc/archiviste_ouvrir_salle", {
        method: "POST",
        token: m.access_token,
        body: {
