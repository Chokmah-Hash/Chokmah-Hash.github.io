  <script>
    /* Clé publique Supabase — publique par design (RLS protège les données) */
    var CLE_PUBLIQUE = "sb_publishable_U_ADFiAlPqWodkQFybynPg_5Mbctjov";

  <script>
/* ════════════════════════════════════════════════════════════════════
   LARCHIVISTE_CLOUD — le client nuage de L'Archiviste (Alpha Zéro)
   Zéro dépendance : fetch + l'API REST de Supabase.
   Principe cardinal : l'Archiviste ne garde JAMAIS les mots de passe —
   chaque mot de passe part directement chez Supabase Auth, aucun hash
   ne vit dans le code de l'app.
   ════════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";
  var URL = "https://dnbnkdakmobufqcrqzpq.supabase.co";
  var CLE = "larchiviste_session_v1";
  var compteCourant = null; // compte_id de la session en cours

  /* ── Le garde-mième : le navigateur garde le token, jamais un mot de passe ── */
  function lire() {
    try { return JSON.parse(localStorage.getItem(CLE) || "null"); } catch (e) { return null; }
  }
  function ecrire(m) {
    try {
      if (m) localStorage.setItem(CLE, JSON.stringify(m));
      else localStorage.removeItem(CLE);
    } catch (e) { /* mode privé : on vivra sans restauration */ }
  }

  /* ── L'API, avec les messages d'erreur en français de la Tombe ── */
  function api(chemin, opts) {
    opts = opts || {};
    var headers = { apikey: CLE_PUBLIQUE, "Content-Type": "application/json" };
    if (opts.token) headers["Authorization"] = "Bearer " + opts.token;
    if (opts.prefer) headers["Prefer"] = opts.prefer;
    return fetch(URL + chemin, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (!res.ok) {
          var code = (data && (data.error_code || data.code)) || "";
          var msgBrut = (data && (data.msg || data.message)) || "";
          var msgs = {
            invalid_credentials: "Email ou mot de passe incorrect.",
            user_already_exists: "Un compte existe déjà sur cet email — connectez-vous.",
            signups_disabled: "Les inscriptions sont fermées sur le serveur — l'administrateur doit les rouvrir.",
            weak_password: "Mot de passe trop faible — 4 caractères minimum.",
            over_email_rate_limit: "Trop d'emails envoyés par le serveur — patientez quelques minutes.",
            email_not_confirmed: "Cet email n'est pas encore confirmé — ouvrez le message reçu, puis revenez."
          };
          if (msgBrut.indexOf("inscriptions desactivees") >= 0) {
            code = "signups_disabled";
          }
          var err = new Error(msgs[code] || msgBrut || "Serveur injoignable — vérifiez votre connexion.");
          err.code = code;
          err.statut = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  /* ── Profil de compte tel que le launcher l'attend ── */
  function profilDepuis(user, compte) {
    var meta = (user && user.user_metadata) || {};
    return {
      compteId: user.id,
      pseudo: (compte && compte.pseudo) || meta.pseudo || "Joueur",
      tag: (compte && compte.tag) || "JR-????",
      email: user.email,
      avatarId: (compte && compte.avatar_ref) || meta.avatar_ref || "crane",
      memoire: {}
    };
  }

  /* ── Charge la ligne compte (auto-répare si absente) + le sac du compte ── */
  function chargerTout(token, user) {
    var comptes = Promise.resolve(api("/rest/v1/archiviste_comptes?select=*", { token: token }))
      .then(function (lignes) {
        if (lignes && lignes.length) return lignes[0];
        /* Self-heal : la ligne compte manque (signup interrompu ?) → on la recrée */
        var meta = user.user_metadata || {};
        return api("/rest/v1/archiviste_comptes", {
          method: "POST", token: token, prefer: "return=representation",
          body: {
            compte_id: user.id,
            pseudo: meta.pseudo || "Joueur",
            email: user.email,
            avatar_ref: meta.avatar_ref || "crane"
          }
        }).then(function (cree) { return cree && cree[0]; });
      });

    return comptes.then(function (compte) {
      compteCourant = user.id;
      /* Horodatage de dernière connexion (best effort) */
      api("/rest/v1/archiviste_comptes?compte_id=eq." + user.id, {
        method: "PATCH", token: token, body: { derniere_connexion: new Date().toISOString() }
      }).catch(function () {});
      var profil = profilDepuis(user, compte);
      return api("/rest/v1/archiviste_memoire?select=contenu&compte_id=eq." + user.id, { token: token })
        .then(function (mem) {
          profil.memoire = (mem && mem[0] && mem[0].contenu) || {};
          return profil;
        });
    });
  }

  return {
    /* Connexion email + mot de passe → profil + bibliothèque du compte */
    connexion: function (email, mdp) {
      return api("/auth/v1/token?grant_type=password", {
        method: "POST", body: { email: email, password: mdp }
      }).then(function (d) {
        ecrire({ access_token: d.access_token, refresh_token: d.refresh_token });
        return chargerTout(d.access_token, d.user);
      });
    },

    /* Inscription : pseudo part dans user_metadata, le mot de passe chez Auth */
    inscription: function (pseudo, email, mdp, avatarId) {
      return api("/auth/v1/signup", {
        method: "POST",
        body: { email: email, password: mdp, data: { pseudo: pseudo, avatar_ref: avatarId } }
      }).then(function (d) {
        var session = d.session || (d.access_token ? d : null);
        if (session && session.access_token) {
          ecrire({ access_token: session.access_token, refresh_token: session.refresh_token });
          return chargerTout(session.access_token, d.user || session.user);
        }
        /* Compte créé mais email non confirmé → pas de session */
        var err = new Error("Un email de confirmation vous attend — ouvrez-le, puis revenez vous connecter.");
        err.confirmation = true;
        throw err;
      });
    },

    /* Restauration de session au démarrage (token gardé par le navigateur) */
    sessionActuelle: function () {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve(null);
      return api("/auth/v1/user", { token: m.access_token })
        .then(function (user) { return chargerTout(m.access_token, user); })
        .catch(function () {
          /* Token expiré → on tente le refresh avant d'abandonner */
          if (!m.refresh_token) { ecrire(null); return null; }
          return api("/auth/v1/token?grant_type=refresh_token", {
            method: "POST", body: { refresh_token: m.refresh_token }
          }).then(function (d) {
            ecrire({ access_token: d.access_token, refresh_token: d.refresh_token });
            return chargerTout(d.access_token, d.user);
          }).catch(function () { ecrire(null); return null; });
        });
    },

    /* Déconnexion serveur + nettoyage du garde-mième */
    deconnexion: function () {
      var m = lire();
      ecrire(null);
      compteCourant = null;
      if (m && m.access_token) {
        return api("/auth/v1/logout", { method: "POST", token: m.access_token }).catch(function () {});
      }
      return Promise.resolve();
    },

    /* Mot de passe perdu : le lien part chez Supabase Auth */
    perdu: function (email) {
      return api("/auth/v1/recover", { method: "POST", body: { email: email } });
    },

    /* Le sac du compte (installations, favoris, rôles) part dans le nuage */
    sauveMemoire: function (compteId, contenu) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve();
      return api("/rest/v1/archiviste_memoire", {
        method: "POST", token: m.access_token,
        prefer: "resolution=merge-duplicates",
        body: { compte_id: compteId, contenu: contenu }
      });
    },

    /* Mise à jour du compte (avatar, pseudo à venir…) */
    sauveCompte: function (patch) {
      var m = lire();
      if (!m || !m.access_token || !compteCourant) return Promise.resolve();
      var body = {};
      if (patch && patch.avatarId !== undefined) body.avatar_ref = patch.avatarId;
      return api("/rest/v1/archiviste_comptes?compte_id=eq." + compteCourant, {
        method: "PATCH", token: m.access_token, body: body
      });
    }
  };
})();

  </script>

/* Résout une arme PÉ en stats de combat : « A »/« A+1 » contre l'Attaque de
   l'unité, « F+1 »/« F+2 » contre sa Force, « D3 » se lance aux dégâts. */
function peArmeCombat(def, st) {
  const mF = /^F\+(\d)$/.exec(String(def.f));
  return {
    nom: def.nom, tir: def.tir, portee: def.portee, regle: def.regle,
    bs_ws: def.tir ? st.ct : st.cc,
    attaques: def.att === "A" ? st.a : def.att === "A+1" ? st.a + 1 : parseInt(def.att, 10),
    f: mF ? st.f + Number(mF[1]) : parseInt(def.f, 10),
    pa: -parseInt(String(def.pa).replace("−", ""), 10),
    degats: def.d === "D3" ? () => 1 + Math.floor(Math.random() * 3) : parseInt(def.d, 10)
  };
}

/* ══════════ Le noyau-d100 : primitive commune Stormbringer / Bloodlust ══════════
   Même principe que le noyau-40k : le launcher lit de la donnée. Le noyau
   fournit resoudreD100(seuil %, modificateur) + les garde-fous communs
   (plancher 5 % de réussite, « 00 » échec automatique) ; les critiques et les
   tests spéciaux (lutte de POU, paliers de Bloodlust) vivent en surcharge
   de chaque pack — le manifeste v1.2 en action. */
const NOYAU_D100 = {
  id: "noyau-d100", version: "0.1.0",
  tests: {
    de: { nb: 1, faces: 100 }, lecture: "inferieur_ou_egal",
    exceptions: { plancher_reussite: 5, echec_auto: 100 }
  }
};

const d100 = () => 1 + Math.floor(Math.random() * 100); /* 1-100 ; 100 se lit « 00 » */
const fmtD100 = (r) => (r === 100 ? "00" : String(r).padStart(2, "0"));

function resoudreD100(seuil, mod = 0, regles = "brp") {
  const sFinal = Math.max(NOYAU_D100.tests.exceptions.plancher_reussite, seuil + mod);
  const de = d100();
  const autoEchec = de === NOYAU_D100.tests.exceptions.echec_auto;
  const reussi = !autoEchec && de <= sFinal;
  let nat = null;
  if (autoEchec) nat = "« 00 » — échec automatique (garde-fou du noyau)";
  else if (regles === "brp") { if (de === 1) nat = "« 01 » — réussite critique"; }
  else {
    if (reussi && de % 10 === 0) nat = "réussite critique — unités 0";
    if (!reussi && de % 10 === 1) nat = "échec critique — unités 1";
  }
  return { de, sFinal, reussi, nat };
}

/* ══════════ Le moteur : la primitive de test, paramétrée par le noyau ══════════ */
const d6 = () => 1 + Math.floor(Math.random() * 6);
const cibleNum = (c) => parseInt(String(c).replace("+", ""), 10);

function resoudreTest(cible, mod = 0) {
  const de = d6();
  const nat6 = de === NOYAU.tests.exceptions.reussite_auto;
  const nat1 = de === NOYAU.tests.exceptions.echec_auto;
  const reussi = nat6 ? true : nat1 ? false : de + mod >= cibleNum(cible);
  return { de, reussi, nat: nat6 ? "6 naturel — réussite auto" : nat1 ? "1 naturel — échec auto" : null };
}

function cibleBlessure(f, e) {
  if (f >= e * 2) return "2+";
  if (f > e) return "3+";
  if (f === e) return "4+";
  if (f <= e / 2) return "6+";
  return "5+";
}

function cibleSauvegarde(sv, pa) {
  return (cibleNum(sv) - (pa || 0)) + "+";
}

   5 rayons convergents au centre, 10 faces triangulaires visibles — arêtes fines, sans chiffres. */
function IcosaedreSommet({ size = 40, color = "#e8e4d8", fond = "transparent" }) {
  const V = [[50, 6], [93.7, 37.8], [77, 89.2], [23, 89.2], [6.3, 37.8]];
  const A = [[62.2, 35.3], [69.7, 58.4], [50, 72.7], [30.3, 58.4], [37.8, 35.3]];
  const C = [50, 52];
  const P = (p) => p.join(",");
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" style={{ display: "block" }}>
      <rect width="100" height="100" fill={fond} rx="14" />
      <g fill="none" stroke={color} strokeWidth="3.8" strokeLinejoin="round" strokeLinecap="round">
        {/* silhouette : pentagone vu par le sommet */}
        <polygon points={V.map(P).join(" ")} />
        {/* anneau interne inversé (pointe en bas) */}
        <polygon points={A.map(P).join(" ")} />
        {/* 5 rayons : le sommet du dé converge au centre */}
        {A.map((a, i) => <polyline key={"c" + i} points={P(C) + " " + P(a)} />)}
        {/* 10 arêtes : anneau interne vers les sommets du pentagone */}
        {A.map((a, i) => (
          <g key={"v" + i}>
            <polyline points={P(a) + " " + P(V[i])} />
            <polyline points={P(a) + " " + P(V[(i + 1) % 5])} />
          </g>
        ))}
      </g>
    </svg>
  );
}

/* ══════════ L'Icosaèdre — glyphe D20 retenu : fidèle au modèle de Michael ══════════
   Silhouette hexagonale (pointe en haut) + 6 arêtes droites :
   de chaque sommet du contour, une ligne rejoint le point central. Rien d'autre. */
function Icosaedre({ size = 40, color = "#e8e4d8", fond = "transparent" }) {
  const V = [[50, 6], [88.5, 28.5], [88.5, 71.5], [50, 94], [11.5, 71.5], [11.5, 28.5]];
  const C = [50, 50];
  const P = (p) => p.join(",");
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" style={{ display: "block" }}>
      <rect width="100" height="100" fill={fond} rx="14" />
      <g fill="none" stroke={color} strokeWidth="3.8" strokeLinejoin="round" strokeLinecap="round">
        {/* silhouette hexagonale */}
        <polygon points={V.map(P).join(" ")} />
        {/* 6 arêtes : chaque sommet rejoint le point central */}
        {V.map((v, i) => (
          <polyline key={i} points={P(v) + " " + P(C)} />
        ))}
      </g>
    </svg>
  );
}

/* ══════════ La création de compte — pseudo + email + image, UUID gravé ══════════ */
function EcranCreation({ onCreer, onAnnuler }) {
  const [pseudo, setPseudo] = useState("");
  const [email, setEmail] = useState("");
  const [mdp, setMdp] = useState("");
  const [avatarId, setAvatarId] = useState("crane");
  const pret = pseudo.trim() && email.trim().includes("@") && mdp.length >= 4;
  const [enCours, setEnCours] = useState(false);
  const [erreurCreation, setErreurCreation] = useState(null);
  const creer = async () => {
    if (!pret || enCours) return;
    if (!CLOUD) { onCreer({ pseudo: pseudo.trim(), email: email.trim().toLowerCase(), avatarId }); return; }
    setEnCours(true); setErreurCreation(null);
    try {
      onCreer(await CLOUD.inscription(pseudo.trim(), email.trim().toLowerCase(), mdp, avatarId));
    } catch (e) {
      setErreurCreation(e && e.message ? e.message : "Serveur injoignable — vérifiez votre connexion.");
    }
    setEnCours(false);
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "#000000b3" }}>
      <div className="rounded-2xl p-5 w-full max-w-sm"
        style={{ background: "#14161b", border: "1px solid #a8adb844", fontFamily: "'Rajdhani','Segoe UI',system-ui,sans-serif" }}>
        <div className="font-bold text-lg mb-1" style={{ color: "#e8e4d8" }}>＋ Créer un compte</div>
        <div className="text-xs mb-4" style={{ color: "#71717a" }}>
          Un UUID de compte est généré à la création — il restera stable pour toujours. En phase
          serveur, c'est ici que Supabase Auth prendra le relais pour le mot de passe.
        </div>

        <div className="text-xs font-bold mb-1" style={{ color: "#c8c8ce" }}>Pseudo :</div>
        <input value={pseudo} onChange={e => setPseudo(e.target.value)} placeholder="Ex. : Vétéran de la Tombe"
          className="w-full rounded-lg px-3 py-2 mb-3 text-sm"
          style={{ background: "#0c0d10", border: "1px solid #3f3f46", color: "#e8e4d8", outline: "none" }} />

        <div className="text-xs font-bold mb-1" style={{ color: "#c8c8ce" }}>Email :</div>
        <input value={email} onChange={e => setEmail(e.target.value)} placeholder="vous@exemple.fr" type="email"
          className="w-full rounded-lg px-3 py-2 mb-3 text-sm"
          style={{ background: "#0c0d10", border: "1px solid #3f3f46", color: "#e8e4d8", outline: "none" }} />

        <div className="text-xs font-bold mb-1" style={{ color: "#c8c8ce" }}>Mot de passe :</div>
        <input value={mdp} onChange={e => setMdp(e.target.value)} placeholder="4 caractères minimum" type="password"
          className="w-full rounded-lg px-3 py-2 mb-3 text-sm"
          style={{ background: "#0c0d10", border: "1px solid #3f3f46", color: "#e8e4d8", outline: "none" }} />
        <div className="text-xs mb-3" style={{ color: "#52525b" }}>
          En phase serveur, ce mot de passe part chez Supabase Auth — l'Archiviste ne le garde jamais ici.
        </div>

        <div className="text-xs font-bold mb-2" style={{ color: "#c8c8ce" }}>Image de compte :</div>
        <div className="flex flex-wrap gap-2 mb-4">
          {AVATARS.map(a => (
            <button key={a.id} onClick={() => setAvatarId(a.id)} title={a.label}
              className="transition-transform" style={{ transform: a.id === avatarId ? "scale(1.12)" : "none" }}>
              <Avatar a={a} size={38} selectionne={a.id === avatarId} />
            </button>
          ))}
        </div>

        <div className="text-xs mb-5" style={{ color: "#71717a" }}>
          Tous les comptes sont joueurs — le rôle MJ se choisit plus tard, au lancement du pack.
        </div>

        <div className="flex gap-2">
          <button onClick={onAnnuler} className="flex-1 py-2 rounded-lg font-bold text-sm"
            style={{ border: "1px solid #3f3f46", color: "#71717a" }}>Annuler</button>
          <button onClick={creer}

            style={{ background: pret && !enCours ? "#a8adb8" : "#52525b" }}>
            {enCours ? "Création…" : "Créer et entrer"}
          </button>
        </div>
        {erreurCreation && (
          <div className="text-xs mt-3 text-center" style={{ color: "#fb7185" }}>{erreurCreation}</div>
        )}
        <div className="text-xs mt-3 text-center" style={{ color: "#52525b" }}>
          {CLOUD
            ? "Le mot de passe part directement chez Supabase Auth — l'Archiviste ne le garde jamais ici."

        </div>
      </div>
    </div>
  );

/* ══════════ Connexion — écran phase 2 : email + mot de passe ══════════
   Simulation honnête de ce que fera Supabase Auth : l'Archiviste ne garde
   jamais les mots de passe — la vérification sera DÉLÉGUÉE au serveur.
   En local, tout mot de passe ≥ 4 caractères « passe » (décor assumé).
   « Mot de passe perdu » = lien magique par email (boîte simulée). */
function AuthModal({ profils, onLogin, onCreer, onFermer }) {
  const [mode, setMode] = useState("login"); // login | perdu | envoye
  const [enCreation, setEnCreation] = useState(false);
  const [email, setEmail] = useState("");
  const [mdp, setMdp] = useState("");
  const [erreur, setErreur] = useState(null);
  const [apresLien, setApresLien] = useState(false);
  const [enVerif, setEnVerif] = useState(false);
  const [perduEmail, setPerduEmail] = useState("");
  const champ = { background: "#0c0d10", border: "1px solid #3f3f46", color: "#e8e4d8", outline: "none" };

  const tenter = async () => {
    if (!email.trim() || mdp.length < 4) { setErreur("Email et mot de passe requis (4 caractères min.)"); return; }
    if (CLOUD) {
      setEnVerif(true); setErreur(null);
      try {
        onLogin(await CLOUD.connexion(email.trim().toLowerCase(), mdp));
      } catch (e) {
        setErreur(e && e.message ? e.message : "Serveur injoignable — vérifiez votre connexion.");
      }
      setEnVerif(false);
      return;
    }
    const p = profils.find(x => x.email.toLowerCase() === email.trim().toLowerCase());
    if (!p) { setErreur("Aucun compte sur cet email — créez-en un ci-dessous"); return; }
    onLogin(p);
  };

  const envoyerLien = async () => {
    if (!perduEmail.trim() || enVerif) return;
    if (CLOUD) {
      setEnVerif(true); setErreur(null);
      try { await CLOUD.perdu(perduEmail.trim().toLowerCase()); }
      catch (e) {
        setErreur(e && e.message ? e.message : "Serveur injoignable — vérifiez votre connexion.");
        setEnVerif(false);
        return;
      }
      setEnVerif(false);
    }
    setMode("envoye");
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "#000000b3" }}>
      <div className="rounded-2xl p-6 w-full max-w-sm"
        style={{ background: "#14161b", border: "1px solid #a8adb844", fontFamily: "'Rajdhani','Segoe UI',system-ui,sans-serif" }}>

        {mode === "login" && (
          <div>
            <div className="flex items-center justify-between mb-1">
              <div className="font-bold text-lg" style={{ color: "#e8e4d8" }}>Connexion</div>
              <button onClick={onFermer} className="text-xl px-2" style={{ color: "#71717a" }}>✕</button>
            </div>
            <div className="text-xs mb-4" style={{ color: "#71717a" }}>
              Tous les comptes sont joueurs — le rôle MJ se choisit au lancement d'un pack.
            </div>

            {apresLien && (
              <div className="text-xs mb-3 px-2 py-1.5 rounded" style={{ background: "#a8adb814", color: "#a8adb8" }}>
                ✓ Lien magique vérifié — saisissez votre nouveau mot de passe.
              </div>
            )}

            <div className="text-xs font-bold mb-1" style={{ color: "#c8c8ce" }}>Email :</div>
            <input value={email} onChange={e => { setEmail(e.target.value); setErreur(null); }}
              placeholder="vous@exemple.fr" type="email"
              className="w-full rounded-lg px-3 py-2 mb-3 text-sm" style={champ} />

            <div className="text-xs font-bold mb-1" style={{ color: "#c8c8ce" }}>Mot de passe :</div>
            <input value={mdp} onChange={e => { setMdp(e.target.value); setErreur(null); }}
              placeholder="••••••••" type="password"
              className="w-full rounded-lg px-3 py-2 mb-2 text-sm" style={champ} />
            <div className="text-xs mb-3" style={{ color: erreur ? "#fb7185" : "#52525b" }}>
              {erreur || "\u00a0"}
            </div>

            <button onClick={tenter} disabled={enVerif}
              className="w-full py-2.5 rounded-lg font-bold text-sm text-black"
              style={{ background: enVerif ? "#52525b" : "#a8adb8" }}>
              {enVerif ? "Vérification auprès du serveur…" : "Se connecter"}
            </button>

            <div className="flex justify-between mt-3 text-xs font-bold">
              <button onClick={() => { setPerduEmail(email); setErreur(null); setMode("perdu"); }}
                style={{ color: "#71717a" }}>Mot de passe perdu ?</button>
              <button onClick={() => setEnCreation(true)} style={{ color: "#a8adb8" }}>＋ Créer un compte</button>
            </div>

            <div className="text-xs mt-4 text-center" style={{ color: "#52525b" }}>
              {CLOUD
                ? "Comptes vérifiés par Supabase Auth — l'Archiviste ne garde jamais les mots de passe."
                : "Démo : maitre@larchiviste.jdr · signa@larchiviste.jdr · arf@arf.fr — mot de passe : n'importe lequel (4+ caractères)."}
            </div>
          </div>
        )}

        {mode === "perdu" && (
          <div>
            <div className="flex items-center justify-between mb-1">
              <div className="font-bold text-lg" style={{ color: "#e8e4d8" }}>Mot de passe perdu</div>
              <button onClick={() => setMode("login")} className="text-xl px-2" style={{ color: "#71717a" }}>✕</button>
            </div>
            <div className="text-xs mb-4" style={{ color: "#71717a" }}>
              Un lien magique vous est envoyé par email — pas de question secrète sur votre ville natale.
            </div>
            <div className="text-xs font-bold mb-1" style={{ color: "#c8c8ce" }}>Votre email :</div>
            <input value={perduEmail} onChange={e => setPerduEmail(e.target.value)} type="email"
              placeholder="vous@exemple.fr"
              className="w-full rounded-lg px-3 py-2 mb-4 text-sm" style={champ} />
            <button onClick={envoyerLien}
              disabled={!perduEmail.trim() || enVerif}
              className="w-full py-2.5 rounded-lg font-bold text-sm text-black"
              style={{ background: perduEmail.trim() && !enVerif ? "#a8adb8" : "#52525b" }}>
              {enVerif ? "Envoi…" : "Envoyer le lien magique"}
            </button>
            {erreur && (
              <div className="text-xs mt-3 text-center" style={{ color: "#fb7185" }}>{erreur}</div>
            )}
            <button onClick={() => setMode("login")} className="w-full mt-3 text-xs font-bold" style={{ color: "#71717a" }}>
              ← Retour à la connexion
            </button>
          </div>
        )}

        {mode === "envoye" && (
          <div>
            <div className="text-xs font-bold tracking-widest mb-2" style={{ color: "#71717a" }}>
              {CLOUD ? "📧 EMAIL ENVOYÉ" : "📧 SIMULATION DE BOÎTE MAIL"}
            </div>
            {CLOUD ? (
              <div className="rounded-xl p-4 text-left mb-4" style={{ background: "#ffffff08", border: "1px solid #27272a" }}>
                <div className="text-sm" style={{ color: "#c8c8ce" }}>
                  Un lien de réinitialisation part vers <b>{perduEmail}</b> — vérifiez votre boîte (et vos spams),
                  puis revenez choisir un nouveau mot de passe.
                </div>
                <button onClick={() => setMode("login")}
                  className="mt-3 px-4 py-2 rounded-lg font-bold text-sm text-black" style={{ background: "#f0b24a" }}>
                  ← Retour à la connexion
                </button>
              </div>
            ) : (
              <div className="rounded-xl p-4 text-left mb-4" style={{ background: "#ffffff08", border: "1px solid #27272a" }}>
                <div className="text-xs mb-1" style={{ color: "#71717a" }}>
                  De : no-reply@larchiviste.jdr — « Réinitialisation de votre mot de passe »
                </div>
                <div className="text-sm" style={{ color: "#c8c8ce" }}>
                  Bonjour — cliquez sur ce lien pour choisir un nouveau mot de passe. Il expire dans 60 minutes.
                </div>
                <button onClick={() => { setEmail(perduEmail); setMdp(""); setApresLien(true); setMode("login"); }}
                  className="mt-3 px-4 py-2 rounded-lg font-bold text-sm text-black" style={{ background: "#f0b24a" }}>
                  🔗 Ouvrir le lien magique
                </button>
              </div>
            )}
            <div className="text-xs text-center" style={{ color: "#52525b" }}>
              {CLOUD ? "Lien envoyé et vérifié par Supabase Auth." : "En production : ce lien arrive par email, vérifié par Supabase Auth."}
            </div>
          </div>
        )}
      </div>

      {enCreation && <EcranCreation onCreer={onCreer} onAnnuler={() => setEnCreation(false)} />}
    </div>
  );
}

            <div className="text-xs mt-0.5" style={{ color: "#a1a1aa" }}>
              {pack.type} · dépend de {pack.depend_de.map(d => `${d.id}@${d.format_min}`).join(", ")}
            </div>
          </div>
        </div>
        <button
          onClick={() => { onFavori(pack.id); showToast(favori ? "Retiré des favoris" : "Ajouté à la bibliothèque ★"); }}
          className="text-xl px-1 leading-none hover:scale-110 transition-transform"
          title="Favori"
        >
          {favori ? "★" : "☆"}
        </button>
      </div>
      <div className="px-5 pb-4 text-sm" style={{ color: "#c8c8ce" }}>{pack.resume}</div>
      <div className="mt-auto p-4 flex items-center justify-between" style={{ background: "#ffffff08" }}>
        <div className="text-xs flex items-center gap-1.5" style={{ color: "#71717a" }}>
          <span>v{pack.version}{pack.visibilite === "prive" && " · privé"} · {pack.taille}</span>
        </div>
        {contexte === "bibliotheque" ? (
          <button
            onClick={() => onLancer(pack)}
            className="px-4 py-2 rounded-lg font-bold text-sm text-black"
            style={{ background: pack.theme.accent }}
          >
            ▶ Lancer
          </button>
        ) : !connecte ? (
          <span className="text-xs font-bold" style={{ color: "#52525b" }} title="Connectez-vous pour installer">
            🔒 connexion requise
          </span>
        ) : dispo ? (
          installe ? (
            <button
              disabled
              className="px-4 py-2 rounded-lg font-bold text-sm border border-zinc-700 text-zinc-500"
              style={{ background: "#ffffff08", cursor: "not-allowed" }}
            >
              ✓ Déjà installé
            </button>
          ) : (
            <button
              onClick={() => onInstaller(pack)}
              disabled={enInstallation}
              className={"px-4 py-2 rounded-lg font-bold text-sm text-black" + (enInstallation ? " animate-pulse" : "")}
              style={{ background: enInstallation ? "#52525b" : pack.theme.accent }}
            >
              {enInstallation ? "Installation…" : "⬇ Installer"}
            </button>
          )
        ) : (
          <button
            onClick={() => showToast(`${pack.nom} — pack non packagé. À venir !`)}
            className="px-4 py-2 rounded-lg font-bold text-sm border border-zinc-600 text-zinc-400"
          >
            À venir
          </button>
        )}
      </div>
    </div>
  );
}

/* ══════════ Le pack PÉ chargé (light light) ══════════ */
function PvBarre({ pv, pvMax, accent }) {
  return (
    <div className="flex gap-1">
      {Array.from({ length: pvMax }).map((_, i) => (
        <div key={i} className="h-8 flex-1 rounded" style={{ background: i < pv ? accent : "#5c1f1f", border: "1px solid #ffffff18" }} />
      ))}
    </div>
  );
}

function PackView({ pack, onRetour, role }) {
  const T = pack.theme;
  const [journal, setJournal] = useState([]);
  const [pvSigna, setPvSigna] = useState(SIGNA.pvMax);
  const [pvOrk, setPvOrk] = useState(ORK.pvMax);
  const [enCombat, setEnCombat] = useState(false);
  const [finCombat, setFinCombat] = useState(null);
  const [round, setRound] = useState(0);
  const [cibleLibre, setCibleLibre] = useState("4+");
  const [modLibre, setModLibre] = useState(0);
  /* — création d'unité : l'unité éveillée remplace Signa-3 partout — */
  const [enCreationPE, setEnCreationPE] = useState(false);
  const [persoCree, setPersoCree] = useState(null);
  const evId = useRef(1);

  const heure = () => new Date().toLocaleTimeString("fr-FR", { hour12: false });
  const logEvent = (type, texte) =>
    setJournal(j => [...j, { id: evId.current++, quand: heure(), type, texte }]);

  /* Jet libre (la primitive du noyau, étiquetée) */
  const jetLibre = () => {
    const r = resoudreTest(cibleLibre, modLibre);
    const modTxt = modLibre === 0 ? "" : modLibre > 0 ? " (+1)" : " (−1)";
    logEvent("libre.jet", `Jet libre — cible ${cibleLibre}${modTxt} → ${r.de}${r.nat ? " · " + r.nat : ""} — ${r.reussi ? "RÉUSSI" : "ÉCHOUÉ"}`);
  };

  /* Écriture compensatoire : on n'efface JAMAIS, on annule par écrit */
  const corrigerDernier = () => {
    const dernier = journal[journal.length - 1];
    if (!dernier) return;
    setJournal(j => [
      ...j.map(e => (e.id === dernier.id ? { ...e, annule: true } : e)),
      { id: evId.current++, quand: heure(), type: "journal.correction",
        texte: `Écriture compensatoire : annule l'événement #${dernier.id} (« ${dernier.texte.slice(0, 60)}${dernier.texte.length > 60 ? "…" : ""} ») — motif : démonstration append-only` }
    ]);
  };

  /* La fiche active : Signa-3 (démo) ou l'unité éveillée — et son arme de
     combat (les armes du manuel portent « A »/« F+1 »/« D3 », résolues ici) */
  const perso = persoCree || SIGNA;
  const armeCombat = persoCree ? peArmeCombat(persoCree.armeDef, persoCree.st) : ARMES[SIGNA.arme];

  const validerCreationPE = (p) => {
    setPersoCree(p);
    setEnCreationPE(false);
    setPvSigna(p.pvMax);
    logEvent("perso.creation", `Éveil de ${p.nom} — ${p.chassis} · code ${p.code} · PV ${p.pvMax} (W×3) · Rfx +${p.rfx} · ${p.armeDef.nom}`);
  };

  /* Le combat : la séquence du noyau, les surcharges du mod */
  const demarrerCombat = () => {
    setEnCombat(true);
    setFinCombat(null);
    logEvent("scene.debut", `Combat engagé — ${perso.nom} (${perso.chassis}) vs Ork Boy (Kass Krane)`);
  };

  const nouveauCombat = () => {
    setPvSigna(perso.pvMax); setPvOrk(ORK.pvMax);
    setRound(0); setFinCombat(null);
    logEvent("scene.debut", "Nouvel engagement — PV réinitialisés (light light)");
  };

  const jouerRound = () => {
    let pvS = pvSigna, pvO = pvOrk;
    const isJ = d6() + perso.rfx, isO = d6() + ORK.ini;
    logEvent("combat.initiative",
      `Initiative — ${perso.nom} : ${isJ} (1D6 + Rfx +${perso.rfx}, surcharge du mod) vs Ork : ${isO} (1D6 + Ini ${ORK.ini}) — ${isJ >= isO ? perso.nom + " agit d'abord" : "l'Ork agit d'abord"}`);
    const ordre = isJ >= isO ? ["joueur", "ork"] : ["ork", "joueur"];

    ordre.forEach(qui => {
      if (pvS <= 0 || pvO <= 0) return;
      if (qui === "joueur") {
        const arme = armeCombat;
        for (let t = 0; t < arme.attaques; t++) {
          const jt = resoudreTest(arme.bs_ws, 0);
          logEvent("combat.jet", `${arme.tir ? "Tir" : "Frappe"} ${t + 1}/${arme.attaques} — ${arme.nom} : toucher ${arme.tir ? "CT" : "CC"} ${arme.bs_ws} → ${jt.de}${jt.nat ? " · " + jt.nat : ""} — ${jt.reussi ? "touché" : "raté"}`);
          if (!jt.reussi) continue;
          const cb = cibleBlessure(arme.f, ORK.st.e);
          const jb = resoudreTest(cb, 0);
          logEvent("combat.blesse", `Blessure F${arme.f} vs E${ORK.st.e} → ${cb} → ${jb.de} — ${jb.reussi ? "blessé" : "absorbé"}`);
          if (!jb.reussi) continue;
          const cs = cibleSauvegarde(ORK.st.sv, arme.pa);
          const js = resoudreTest(cs, 0);
          logEvent("combat.sauvegarde", `Sauvegarde Ork ${ORK.st.sv} avec PA ${arme.pa} → ${cs} → ${js.de} — ${js.reussi ? "sauvé" : "encaissé"}`);
          if (!js.reussi) {
            const dgt = typeof arme.degats === "function" ? arme.degats() : arme.degats;
            pvO = Math.max(0, pvO - dgt);
            logEvent("combat.degats", `Ork Boy : −${dgt} PV (${pvO}/${ORK.pvMax})`);
          }
        }
      } else {
        const arme = ARMES[ORK.arme];
        const jt = resoudreTest(arme.bs_ws, 0);
        logEvent("combat.riposte", `L'Ork riposte — choppa : toucher CC ${arme.bs_ws} → ${jt.de} — ${jt.reussi ? "touché" : "raté"}`);
        if (jt.reussi) {
          const cb = cibleBlessure(arme.f, perso.st.e);
          const jb = resoudreTest(cb, 0);
          logEvent("combat.blesse", `Blessure F${arme.f} vs E${perso.st.e} → ${cb} → ${jb.de} — ${jb.reussi ? "blessé" : "absorbé"}`);
          if (jb.reussi) {
            const cs = cibleSauvegarde(perso.st.sv, arme.pa);
            const js = resoudreTest(cs, 0);
            logEvent("combat.sauvegarde", `Sauvegarde ${perso.nom} ${perso.st.sv} avec PA ${arme.pa} → ${cs} → ${js.de} — ${js.reussi ? "sauvé" : "encaissé"}`);
            if (!js.reussi) {
              pvS = Math.max(0, pvS - arme.degats);
              logEvent("combat.degats", `${perso.nom} : −${arme.degats} PV (${pvS}/${perso.pvMax})`);
            }
          }
        }
      }
    });

    setPvSigna(pvS); setPvOrk(pvO); setRound(r => r + 1);

    if (pvO <= 0) {
      logEvent("combat.fin", "Ork Boy ☠ à terre — fin du combat, retour au dialogue");
      setFinCombat("victoire");
    } else if (pvS <= 0) {
      /* surcharge hors_combat du mod : le Protocole de Secours */
      const js = resoudreTest("5+", 0);
      logEvent("protocole.secours", `${perso.nom} à 0 PV — Protocole de Secours (surcharge du mod) : 5+ → ${js.de} — ${js.reussi ? "l'unité se redresse ⚡ (1 PV)" : "échec"}`);
      if (js.reussi) {
        pvS = 1; setPvSigna(1);
      } else {
        logEvent("protocole.extraction", `Extraction d'urgence — ${perso.nom} téléporté hors scène (1 PV à la scène suivante)`);
        setFinCombat("extraction");
      }
    }
  };

  const familleCouleur = {
    combat: T.accent, libre: "#7dd3fc", protocole: T.or,
    scene: "#a1a1aa", journal: "#fb7185", perso: T.accent
  };
  const journalInverse = [...journal].reverse();

  return (
    <div className="min-h-screen" style={{ background: T.fond, fontFamily: "'Rajdhani','Segoe UI',system-ui,sans-serif" }}>
      <div className="max-w-4xl mx-auto px-5 py-6">
        <header className="flex items-center justify-between mb-6 pb-4" style={{ borderBottom: "1px solid " + T.accent + "33" }}>
          <button onClick={onRetour} className="px-3 py-1.5 rounded-lg text-sm font-bold" style={{ border: "1px solid " + T.accent + "66", color: T.accent }}>
            ← Hub
          </button>
          <div className="text-center">
            <div className="text-xl font-bold flex items-center justify-center gap-2" style={{ color: "#e8e4d8" }}>
              {pack.nom}
              {role && (
                <span className="text-xs px-1.5 py-0.5 rounded font-bold"
                  style={{ background: role === "mj" ? "#f0b24a22" : "#2ee6c922", color: role === "mj" ? "#f0b24a" : "#2ee6c9" }}>
                  {role === "mj" ? "MJ" : "JOUEUR"}
                </span>
              )}
            </div>
            <div className="text-xs" style={{ color: "#71717a" }}>
              {pack.type} · dépend de {pack.depend_de.map(d => d.id + "@" + d.format_min).join(", ")} · v{pack.version} · privé
            </div>
          </div>
          <div style={{ color: T.or }}>⟁</div>
        </header>

        <div className="grid md:grid-cols-2 gap-4 mb-5">
          {enCreationPE ? (
            <div className="md:col-span-2">
              <EcranCreationUnite accent={T.accent} onValide={validerCreationPE} onAnnule={() => setEnCreationPE(false)} />
            </div>
          ) : (
          <>
          {/* Fiche */}
          <div className="rounded-xl p-4" style={{ background: "#ffffff08", border: "1px solid " + T.accent + "33" }}>
            <div className="flex items-baseline justify-between mb-3">
              <div className="font-bold text-lg" style={{ color: T.accent }}>{perso.nom}</div>
              <div className="text-xs" style={{ color: "#71717a" }}>{persoCree ? `${perso.chassis} · code ${perso.code}` : perso.chassis}</div>
            </div>
            <PvBarre pv={pvSigna} pvMax={perso.pvMax} accent={T.accent} />
            <div className="text-right text-xs mt-1" style={{ color: "#a1a1aa" }}>{pvSigna} / {perso.pvMax} PV</div>
            <div className="grid grid-cols-3 gap-2 mt-3 text-center text-sm">
              {[["CC", perso.st.cc], ["CT", perso.st.ct], ["F", perso.st.f], ["E", perso.st.e], ["Sv", perso.st.sv], ["Cd", perso.st.cd]]
                .concat(perso.st.a ? [["A", perso.st.a]] : [])
                .map(([k, v]) => (
                <div key={k} className="rounded py-1.5" style={{ background: "#ffffff0d", color: "#e8e4d8" }}>
                  <span className="text-xs" style={{ color: "#71717a" }}>{k} </span>{v}
                </div>
              ))}
            </div>
            <div className="mt-2 rounded py-1.5 text-center text-sm" style={{ background: T.or + "22", color: T.or }}>
              Rfx +{perso.rfx} <span className="text-xs">— surcharge du mod PÉ</span>
            </div>
            {persoCree ? (
              <div className="mt-3 rounded p-2 text-xs" style={{ background: "#ffffff08", color: "#c8c8ce" }}>
                <b style={{ color: "#e8e4d8" }}>{perso.armeDef.nom}</b> · {perso.armeDef.tir ? "tir" : "mêlée"} · {perso.armeDef.portee} ·
                A {perso.armeDef.att} · {perso.armeDef.tir ? "CT " + perso.st.ct : "CC " + perso.st.cc} · F {perso.armeDef.f} ·
                PA {perso.armeDef.pa} · D {perso.armeDef.d}
                <span style={{ color: "#71717a" }}> · {perso.armeDef.regle}</span>
              </div>
            ) : (
              <div className="mt-3 rounded p-2 text-xs" style={{ background: "#ffffff08", color: "#c8c8ce" }}>
                <b style={{ color: "#e8e4d8" }}>{ARMES[perso.arme].nom}</b> · {ARMES[perso.arme].type} · {ARMES[perso.arme].portee} ·
                A {ARMES[perso.arme].attaques} · {ARMES[perso.arme].bs_ws} · F {ARMES[perso.arme].f} ·
                PA {ARMES[perso.arme].pa} · D {ARMES[perso.arme].degats}
              </div>
            )}
            {perso.apt && (
              <div className="mt-2 rounded p-2 text-xs" style={{ background: "#ffffff08", color: "#c8c8ce" }}>
                <b style={{ color: "#e8e4d8" }}>Aptitude de châssis — </b>{perso.apt}
              </div>
            )}
            {perso.comps && (
              <div className="flex flex-wrap gap-1 mt-2">
                {perso.comps.map(c => (
                  <span key={c} className="text-xs px-1.5 py-0.5 rounded" style={{ background: T.accent + "22", color: T.accent }}>{c}</span>
                ))}
              </div>
            )}
            <button onClick={() => setEnCreationPE(true)} className="w-full py-2 rounded-lg text-sm font-bold mt-2"
              style={{ background: "#0c0d10", border: "1px solid " + T.accent + "66", color: T.accent }}>
              {persoCree ? "↺ Éveiller une nouvelle unité" : "⚙ Éveiller une unité"}
            </button>
          </div>

          {/* Adversaire + combat */}
          <div className="rounded-xl p-4" style={{ background: "#ffffff08", border: "1px solid #3f3f46" }}>
            <div className="flex items-baseline justify-between mb-3">
              <div className="font-bold text-lg" style={{ color: pvOrk > 0 ? "#e8e4d8" : "#52525b" }}>{pvOrk > 0 ? "Ork Boy" : "Ork Boy ☠"}</div>
              <div className="text-xs" style={{ color: "#71717a" }}>ennemi de test</div>
            </div>
            <PvBarre pv={pvOrk} pvMax={ORK.pvMax} accent="#f0b24a" />
            <div className="text-right text-xs mt-1" style={{ color: "#a1a1aa" }}>{pvOrk} / {ORK.pvMax} PV</div>
            <div className="mt-3 flex flex-col gap-2">
              {!enCombat || finCombat ? (
                <button onClick={enCombat ? nouveauCombat : demarrerCombat}
                  className="py-2.5 rounded-lg font-bold text-black" style={{ background: finCombat ? "#3f3f46" : T.or, color: finCombat ? "#e8e4d8" : "#0a120f" }}>
                  {enCombat ? "↺ Nouvel engagement" : "⚔ Engager le combat (test)"}

/* ══════════ Le journal d100 (append-only, comme le noyau-40k) ══════════ */
function useJournal() {
  const [journal, setJournal] = useState([]);
  const evId = useRef(1);
  const heure = () => new Date().toLocaleTimeString("fr-FR", { hour12: false });
  const log = (type, texte) =>
    setJournal(j => [...j, { id: evId.current++, quand: heure(), type, texte }]);
  const corrigerDernier = () => {
    setJournal(j => {
      const dernier = j[j.length - 1];
      if (!dernier) return j;
      return [
        ...j.map(e => (e.id === dernier.id ? { ...e, annule: true } : e)),
        { id: evId.current++, quand: heure(), type: "journal.correction",
          texte: `Écriture compensatoire : annule l'événement #${dernier.id} (« ${dernier.texte.slice(0, 60)}${dernier.texte.length > 60 ? "…" : ""} ») — motif : démonstration append-only` }
      ];
    });
  };
  return { journal, log, corrigerDernier };
}

function BarrePct({ valeur, max, accent, label }) {
  const pct = Math.max(0, Math.min(100, Math.round((valeur / max) * 100)));
  return (
    <div>
      <div className="h-2 rounded-full overflow-hidden" style={{ background: "#ffffff14" }}>
        <div className="h-full rounded-full transition-all" style={{ width: pct + "%", background: accent }} />
      </div>
      {label && <div className="text-right text-xs mt-0.5" style={{ color: "#a1a1aa" }}>{label}</div>}
    </div>
  );
}

/* ══════════ Bloodlust : création d'un porteur (livre p. 81-88) ══════════ */
function EcranCreationPorteur({ accent, onValide, onAnnule }) {
  const [peuple, setPeuple] = useState(null);
  const [nom, setNom] = useState("");
  const [ajust, setAjust] = useState({}); /* désir → −2..+2 (un PJ ajuste de ±1 à ±2) */
  const [bonus, setBonus] = useState({}); /* compétence → multiple de 5 */

  const listeCombat = BL_BASE_COMBAT, listeSec = BL_BASE_SECONDAIRES;
  const totalGroupe = (liste) => liste.reduce((s, [k]) => s + (bonus[k] || 0), 0);
  const totCombat = totalGroupe(listeCombat), totSec = totalGroupe(listeSec);
  const majBonus = (liste, plafond, k, delta) => {
    const nv = (bonus[k] || 0) + delta;
    if (nv < 0 || nv > 100 || totalGroupe(liste) + delta > plafond) return;
    setBonus(b => ({ ...b, [k]: nv }));
  };
  const peutValider = peuple && nom.trim().length > 0;

  const valider = () => {
    const competences = {};
    [...listeCombat, ...listeSec].forEach(([k, base]) => { competences[k] = base + (bonus[k] || 0); });
    const desirs = {};
    DESIRS_BL.forEach((d, i) => { desirs[d] = BL_DESIRS_PEUPLES[peuple.nom][i] + (ajust[d] || 0); });
    onValide({ id: "cree", nom: nom.trim(), peuple: peuple.nom, caracs: peuple.caracs, desirs, competences });
  };

  return (
    <div className="rounded-xl p-4" style={{ background: "#ffffff08", border: "1px solid " + accent + "33" }}>
      <div className="flex items-baseline justify-between mb-2">
        <div className="font-bold text-lg" style={{ color: accent }}>🧬 Créer un porteur</div>
        <div className="text-xs" style={{ color: "#71717a" }}>livre p. 81-88</div>
      </div>
      <div className="text-xs mb-4" style={{ color: "#a1a1aa" }}>
        Peuple → nom → désirs → compétences. PV = EN×2, contrôle = VO×5.
        Modificateurs par valeur de carac (image p. 87-88) ignorés dans l'alpha.
      </div>

      {/* ① Identité + peuple */}
      <input value={nom} onChange={e => setNom(e.target.value)} placeholder="Nom du porteur…"
        className="w-full rounded-lg px-3 py-2 mb-3 text-sm"
        style={{ background: "#0c0d10", border: "1px solid #3f3f46", color: "#e8e4d8" }} />
      <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
        {BL_PEUPLES.map(p => (
          <button key={p.id} onClick={() => setPeuple(p)}
            className="rounded-lg p-2.5 text-left"
            style={{ border: "1px solid " + (peuple && peuple.id === p.id ? accent : "#3f3f46"),
                     background: peuple && peuple.id === p.id ? "#ffffff0d" : "#ffffff08" }}>
            <div className="font-bold text-sm" style={{ color: peuple && peuple.id === p.id ? accent : "#e8e4d8" }}>{p.nom}</div>
            <div className="text-xs mt-0.5" style={{ color: "#a1a1aa" }}>
              FO {p.caracs.FO} · EN {p.caracs.EN} · Ag {p.caracs.Ag} · RA {p.caracs.RA} · PE {p.caracs.PE} · VO {p.caracs.VO}
            </div>
          </button>
        ))}
      </div>

      {peuple && (<>
        {/* ② Désirs du peuple */}
        <div className="text-xs mt-4 mb-1.5" style={{ color: "#71717a" }}>
          Désirs du peuple {peuple.nom} (livre p. 88) — un PJ ajuste chaque désir de ±1 à ±2
        </div>
        {DESIRS_BL.map((d, i) => {
          const base = BL_DESIRS_PEUPLES[peuple.nom][i];
          return (
            <div key={d} className="flex items-center justify-between rounded-lg px-2.5 py-1.5 mb-1.5" style={{ background: "#ffffff08" }}>
              <span className="text-sm" style={{ color: "#c8c8ce" }}>
                {d} <span style={{ color: "#71717a" }}>peuple : {base}</span>
              </span>
              <span className="flex items-center gap-1">
                {[-2, -1, 0, 1, 2].map(v => (
                  <button key={v} onClick={() => setAjust(a => ({ ...a, [d]: v }))}
                    className="w-7 h-7 rounded text-xs font-bold"
                    style={{ background: (ajust[d] || 0) === v ? accent : "#0c0d10",
                             color: (ajust[d] || 0) === v ? "#0c0d10" : "#c8c8ce", border: "1px solid #3f3f46" }}>
                    {v > 0 ? "+" + v : v}
                  </button>
                ))}
                <span className="ml-2 text-sm font-bold" style={{ color: "#e8e4d8" }}>
                  {base + (ajust[d] || 0)}/10{(base + (ajust[d] || 0)) >= 9 ? " 🔥" : ""}
                </span>
              </span>
            </div>
          );
        })}

        {/* ③ Compétences : budgets PJ (multiples de 5, plancher 5 %) */}
        {[["Compétences de combat — +40 % à répartir", listeCombat, 40, totCombat],
          ["Compétences secondaires — +80 % à répartir", listeSec, 80, totSec]].map(([titre, liste, plafond, tot]) => (
          <div key={titre}>
            <div className="flex justify-between text-xs mt-4 mb-1.5">
              <span style={{ color: "#71717a" }}>{titre}</span>
              <span style={{ color: tot >= plafond ? "#71717a" : accent }}>{tot} / {plafond} %</span>
            </div>
            {liste.map(([k, base]) => (
              <div key={k} className="flex items-center justify-between rounded-lg px-2.5 py-1 mb-1" style={{ background: "#ffffff08" }}>

                  <button onClick={() => majBonus(liste, plafond, k, -5)}

                </span>
              </div>
            ))}

        ))}

        {/* ④ Aperçu dérivé */}
        <div className="flex gap-2 mt-4 text-center text-xs">
          <div className="flex-1 rounded-lg py-1.5" style={{ background: "#ffffff0d", color: "#e8e4d8" }}>
            PV = EN×2 <b>{peuple.caracs.EN * 2}</b>
          </div>
          <div className="flex-1 rounded-lg py-1.5" style={{ background: "#ffffff0d", color: "#e8e4d8" }}>
            Contrôle = VO×5 <b>{peuple.caracs.VO * 5} %</b>
          </div>
        </div>
      </>)}

      {/* Pied : annuler / faire naître */}
      <div className="flex gap-2 mt-4">
        <button onClick={onAnnule} className="flex-1 py-2 rounded-lg text-sm font-bold"
          style={{ background: "#0c0d10", color: "#a1a1aa", border: "1px solid #3f3f46" }}>✕ Annuler</button>
        <button onClick={valider} disabled={!peutValider}
          className="flex-1 py-2 rounded-lg text-sm font-bold"
          style={{ background: peutValider ? accent : "#27272a", color: peutValider ? "#0c0d10" : "#71717a" }}>
          {peutValider ? `🧬 Faire naître ${nom.trim()}` : "🧬 Choisir un peuple et un nom"}
        </button>
      </div>
    </div>
  );
}

/* ══════════ Stormbringer : création de l'aventurier (Livre du Joueur) ══════════

            <div className="text-xs" style={{ color: "#a1a1aa" }}>{trop ? "> 52 — relance autorisée" : "≤ 52 ✓"}</div>
          </div>

        <div className="flex gap-2 mt-3 text-center text-xs">
          <div className="flex-1 rounded-lg py-1.5" style={{ background: "#ffffff0d", color: "#e8e4d8" }}>
            SAN = POU×5 <b>{caracs.POU * 5}</b>
