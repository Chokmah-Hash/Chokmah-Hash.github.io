<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>L'Archiviste — Alpha Zéro</title>
  <meta name="description" content="L'Archiviste — le launcher des JDR papier : un moteur, des packs." />
  <!-- PWA : l'Archiviste est une APP à installer -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0c0d10" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="L'Archiviste" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- React vit DANS le dépôt : plus aucun CDN critique, la page s'ouvre même si le réseau extérieur sommeille -->
  <script src="react.production.min.js"></script>
  <script src="react-dom.production.min.js"></script>
  <!-- Tailwind COMPILÉ à la forge et hébergé dans le dépôt : plus AUCUN CDN dans la page -->
  <link rel="stylesheet" href="app.css" />
  <style>
    body { margin: 0; background: #0c0d10; font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif; }
    #racine { min-height: 100vh; }
    #attente { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #71717a; font-size: 14px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div id="attente">⟁ L'ARCHIVISTE OUVRE SES ARCHIVES…</div>
  <div id="racine"></div>
  <noscript>L'Archiviste a besoin de JavaScript pour ouvrir ses archives.</noscript>

  <!-- La garde de l'antichambre : si les archives n'ouvrent pas, elle parle au lieu de figer -->
  <script>
    setTimeout(function () {
      var a = document.getElementById("attente");
      if (a) a.innerHTML = "⚠ Les archives tardent — rechargez la page (Ctrl+Shift+R).";
    }, 12000);
  </script>

  <script>
    /* Clé publique Supabase — publique par design (RLS protège les données) */
    var CLE_PUBLIQUE = "sb_publishable_U_ADFiAlPqWodkQFybynPg_5Mbctjov";
  </script>

  <script>
window.LARCHIVISTE_CLOUD = (function () {
  "use strict";
  var URL = "https://dnbnkdakmobufqcrqzpq.supabase.co";
  var CLE = "larchiviste_session_v1";
  var compteCourant = null; // compte_id de la session en cours

  /* ── Le garde-mième : le navigateur garde le token, jamais un mot de passe ── */
  function lire() {
    try { return JSON.parse(localStorage.getItem(CLE) || "null"); } catch (e) { return null; }
  }
  function ecrire(m) {
    try {
      if (m) localStorage.setItem(CLE, JSON.stringify(m));
      else localStorage.removeItem(CLE);
    } catch (e) { /* mode privé : on vivra sans restauration */ }
  }

  /* ── L'API, avec les messages d'erreur en français de la Tombe ── */
  function api(chemin, opts) {
    opts = opts || {};
    var headers = { apikey: CLE_PUBLIQUE, "Content-Type": "application/json" };
    if (opts.token) headers["Authorization"] = "Bearer " + opts.token;
    if (opts.prefer) headers["Prefer"] = opts.prefer;
    return fetch(URL + chemin, {
      cache: "no-store",
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (!res.ok) {
          var code = (data && (data.error_code || data.code)) || "";
          var msgBrut = (data && (data.msg || data.message)) || "";
          var msgs = {
            invalid_credentials: "Email ou mot de passe incorrect.",
            user_already_exists: "Un compte existe déjà sur cet email — connectez-vous.",
            signups_disabled: "Les inscriptions sont fermées sur le serveur — l'administrateur doit les rouvrir.",
            weak_password: "Mot de passe trop faible — 4 caractères minimum.",
            over_email_rate_limit: "Trop d'emails envoyés par le serveur — patientez quelques minutes.",
            email_not_confirmed: "Cet email n'est pas encore confirmé — ouvrez le message reçu, puis revenez.",
            email_address_invalid: "Adresse email invalide — vérifiez son orthographe."
          };
          if (msgBrut.indexOf("inscriptions desactivees") >= 0) {
            code = "signups_disabled";
          }
          var err = new Error(msgs[code] || msgBrut || "Serveur injoignable — vérifiez votre connexion.");
          err.code = code;
          err.statut = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  /* ── Profil de compte tel que le launcher l'attend ── */
  function profilDepuis(user, compte) {
    var meta = (user && user.user_metadata) || {};
    return {
      compteId: user.id,
      pseudo: (compte && compte.pseudo) || meta.pseudo || "Joueur",
      tag: (compte && compte.tag) || "JR-????",
      email: user.email,
      avatarId: (compte && compte.avatar_ref) || meta.avatar_ref || "crane",
      statut: (compte && compte.statut) || "actif",
      memoire: {}
    };
  }

  /* ── Charge la ligne compte (auto-répare si absente) + le sac du compte ── */
  function chargerTout(token, user, opts) {
    var comptes = Promise.resolve(api("/rest/v1/archiviste_comptes?select=*", { token: token }))
      .then(function (lignes) {
        if (lignes && lignes.length) return lignes[0];
        /* Self-heal : la ligne compte manque (signup interrompu ?) → on la recrée */
        var meta = user.user_metadata || {};
        return api("/rest/v1/archiviste_comptes", {
          method: "POST", token: token, prefer: "return=representation",
          body: {
            compte_id: user.id,
            pseudo: meta.pseudo || "Joueur",
            email: user.email,
            avatar_ref: meta.avatar_ref || "crane"
          }
        }).then(function (cree) { return cree && cree[0]; });
      });

    return comptes.then(function (compte) {
      compteCourant = user.id;
      /* Horodatage de dernière connexion (best effort) — SAUF en simple
         vérification (horodater: false) : le temps réel ne doit jamais
         déclencher la Tombe, sinon la Tombe s'annonce à elle-même. */
      if (!opts || opts.horodater !== false) {
        api("/rest/v1/archiviste_comptes?compte_id=eq." + user.id, {
          method: "PATCH", token: token, body: { derniere_connexion: new Date().toISOString() }
        }).catch(function () {});
      }
      var profil = profilDepuis(user, compte);
      return api("/rest/v1/archiviste_memoire?select=contenu&compte_id=eq." + user.id, { token: token })
        .then(function (mem) {
          profil.memoire = (mem && mem[0] && mem[0].contenu) || {};
          return profil;
        });
    });
  }

  /* ══ TEMPS RÉEL — la poussée de la Tombe (Supabase Realtime) ══
     La base PRÉVIENT : plus de pulsation, la vérité arrive en poussée.
     WebSocket zéro dépendance, protocole Phoenix : jointure d'un canal
     postgres_changes (filtre serveur : chaque joueur n'écoute QUE sa
     ligne) + battement de cœur toutes les 25 s. La RLS s'applique AUSSI
     au canal. En coupure, on rebranche seul ; l'app relit alors la
     Tombe pour rattraper ce qui a poussé pendant l'absence. */
  function tempsReel(opts) {
    opts = opts || {};
    var tables = opts.tables || [];
    var surChangement = opts.surChangement || function () {};
    var surEtat = opts.surEtat || function () {};
    var presenceCle = opts.presenceKey || null; /* s'annoncer sur le canal des présents */
    var surPresence = opts.surPresence || null; /* écouter qui entre et qui sort */
    /* V47 : le track porte compte_id + pseudo + jeu — la ronde des présents
       dit QUI est en ligne et OÙ il se tient (null = au hub). */
    var presenceInfo = typeof opts.presenceInfo === "function" ? opts.presenceInfo : null;
    var pister = function (payload) {
      if (!ws || ws.readyState !== 1 || !presenceCle) return;
      ws.send(JSON.stringify({
        topic: "realtime:tombe", event: "presence",
        payload: { type: "presence", event: "track", payload: payload || { compte_id: presenceCle } },
        ref: "piste"
      }));
    };
    if (typeof WebSocket === "undefined") { surEtat("coupure"); return { fermer: function () {} }; }
    var m0 = lire();
    if (!m0 || !m0.access_token) { surEtat("coupure"); return { fermer: function () {} }; }

    var ws = null, coeur = null, ferme = false, essais = 0;

    function brancher() {
      if (ferme) return;
      var jeton = ((lire() || m0) || {}).access_token || "";
      try {
        ws = new WebSocket("wss://dnbnkdakmobufqcrqzpq.supabase.co/realtime/v1/websocket?apikey=" + CLE_PUBLIQUE + "&vsn=1.0.0");
      } catch (e) { retomber(); return; }
      ws.onopen = function () {
        essais = 0;
        if (coeur) clearInterval(coeur);
        coeur = setInterval(function () {
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ topic: "phoenix", event: "heartbeat", payload: {}, ref: "battement" }));
          }
        }, 25000);
        tables.forEach(function (t) {
          var suivi = { event: "*", schema: "public", table: t.table };
          if (t.filtre) suivi.filter = t.filtre;
          ws.send(JSON.stringify({
            topic: "realtime:public:" + t.table,
            event: "phx_join",
            payload: {
              config: { broadcast: { self: false }, presence: { key: "" }, postgres_changes: [suivi] },
              access_token: jeton
            },
            ref: t.table
          }));
        });
        /* La PRÉSENCE : tant que cette socket vit, le joueur est « en ligne ».
           Fermer la fenêtre ferme la socket — le serveur le remarque seul,
           aucune écriture en base, aucun code à la fermeture (impossible
           de rester vert par accident). */
        if (presenceCle) {
          ws.send(JSON.stringify({
            topic: "realtime:tombe",
            event: "phx_join",
            payload: {
              config: { broadcast: { self: false }, presence: { key: presenceCle }, postgres_changes: [] },
              access_token: jeton
            },
            ref: "presence"
          }));
          /* Le track : joindre ne suffit pas, il faut S'ANNONCER — la ronde
             ne diffuse que les états trackés (protocole Supabase v1 :
             event "presence", payload {type:"presence", event:"track"}).
             Le serveur traite les pushes dans l'ordre : join puis track. */
          pister(presenceInfo ? presenceInfo() : { compte_id: presenceCle });
        }
        surEtat("branche");
      };
      ws.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.event === "postgres_changes" && msg.payload && msg.payload.data) {
          surChangement(msg.payload.data);
        }
        /* La ronde des présents : état initial puis entrées/sorties —
           V47 : l'événement part avec le payload (state ou diff). */
        if (surPresence && (msg.event === "presence_state" || msg.event === "presence_diff")) {
          surPresence(msg.payload || {}, msg.event);
        }
      };
      ws.onclose = retomber;
      ws.onerror = function () { try { ws.close(); } catch (e) {} };
    }
    function retomber() {
      if (coeur) { clearInterval(coeur); coeur = null; }
      if (ferme) return;
      surEtat("coupure");
      setTimeout(brancher, Math.min(5000 + essais * 5000, 30000));
      essais++;
    }
    brancher();
    return {
      fermer: function () {
        ferme = true;
        if (coeur) clearInterval(coeur);
        if (ws) { try { ws.close(); } catch (e) {} }
        ws = null;
      },
      /* V47 : re-pister sans re-joindre — quand on entre dans un pack ou
         qu'on le quitte, les présents voient notre nouvelle place. */
      annoncer: function (payload) { pister(payload); }
    };
  }

  return {
    /* Connexion email + mot de passe → profil + bibliothèque du compte */
    connexion: function (email, mdp) {
      return api("/auth/v1/token?grant_type=password", {
        method: "POST", body: { email: email, password: mdp }
      }).then(function (d) {
        ecrire({ access_token: d.access_token, refresh_token: d.refresh_token });
        return chargerTout(d.access_token, d.user);
      });
    },

    /* Inscription : pseudo part dans user_metadata, le mot de passe chez Auth */
    inscription: function (pseudo, email, mdp, avatarId) {
      return api("/auth/v1/signup", {
        method: "POST",
        body: { email: email, password: mdp, data: { pseudo: pseudo, avatar_ref: avatarId } }
      }).then(function (d) {
        var session = d.session || (d.access_token ? d : null);
        if (session && session.access_token) {
          ecrire({ access_token: session.access_token, refresh_token: session.refresh_token });
          return chargerTout(session.access_token, d.user || session.user);
        }
        /* Compte créé mais email non confirmé → pas de session */
        var err = new Error("Un email de confirmation vous attend — ouvrez-le, puis revenez vous connecter.");
        err.confirmation = true;
        throw err;
      });
    },

    /* Restauration de session au démarrage (token gardé par le navigateur) */
    sessionActuelle: function (opts) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve(null);
      return api("/auth/v1/user", { token: m.access_token })
        .then(function (user) { return chargerTout(m.access_token, user, opts); })
        .catch(function () {
          /* Token expiré → on tente le refresh avant d'abandonner */
          if (!m.refresh_token) { ecrire(null); return null; }
          return api("/auth/v1/token?grant_type=refresh_token", {
            method: "POST", body: { refresh_token: m.refresh_token }
          }).then(function (d) {
            ecrire({ access_token: d.access_token, refresh_token: d.refresh_token });
            return chargerTout(d.access_token, d.user, opts);
          }).catch(function () { ecrire(null); return null; });
        });
    },

    /* Déconnexion serveur + nettoyage du garde-mième */
    deconnexion: function () {
      var m = lire();
      ecrire(null);
      compteCourant = null;
      if (m && m.access_token) {
        return api("/auth/v1/logout", { method: "POST", token: m.access_token }).catch(function () {});
      }
      return Promise.resolve();
    },

    /* Mot de passe perdu : le lien part chez Supabase Auth */
    perdu: function (email) {
      return api("/auth/v1/recover", { method: "POST", body: { email: email } });
    },

    /* Le sac du compte (installations, favoris, rôles) part dans le nuage */
    sauveMemoire: function (compteId, contenu) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve();
      return api("/rest/v1/archiviste_memoire", {
        method: "POST", token: m.access_token,
        prefer: "resolution=merge-duplicates",
        body: { compte_id: compteId, contenu: contenu }
      });
    },

    /* L'état de la base tel que la Tombe l'annonce : le pied de page du
       launcher dit ce qu'il charge (parametre « version_launcher ») —
       même vérité que l'Archivisterium, partout où il tourne. */
    lireParametres: function () {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve(null);
      return api("/rest/v1/parametres?select=cle,valeur", { token: m.access_token })
        .catch(function () { return null; });
    },

    /* Mise à jour du compte (avatar, pseudo à venir…) */
    sauveCompte: function (patch) {
      var m = lire();
      if (!m || !m.access_token || !compteCourant) return Promise.resolve();
      var body = {};
      if (patch && patch.avatarId !== undefined) body.avatar_ref = patch.avatarId;
      return api("/rest/v1/archiviste_comptes?compte_id=eq." + compteCourant, {
        method: "PATCH", token: m.access_token, body: body
      });
    },

    /* La Console Globale : le canal des événements de jeu (MJ et joueurs
       s'y parlent). Chaque message est GRAVÉ dans la Tombe — prémice du
       journal — et pousse en temps réel chez tous. Le serveur signe
       lui-même le pseudo et le rôle (trigger console_verite) : personne
       ne peut se déguiser. V0.37 : le canal à DEUX dimensions — le
       GLOBAL (null/null), le SALON D'UN JDR (jeu, null), et le
       canal privé d'une partie (null, partie_id). */
    envoyerConsole: function (compteId, contenu, type, donnees, partieId, packId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve();
      return api("/rest/v1/archiviste_console", {
        method: "POST", token: m.access_token,
        body: {
          compte_id: compteId, contenu: contenu, type: type || "message",
          donnees: donnees || {}, partie_id: partieId || null, jeu: packId || null
        }
      });
    },

    /* Le fil de la Console, relu à la connexion : le journal commence
       où l'on arrive — les 60 derniers messages font le bord. Le canal
       est CONTEXTUEL : le Global (null/null), le salon d'un JDR
       (jeu), ou le canal privé d'une partie (membres et MJ seuls
       le lisent). */
    lireConsole: function (partieId, packId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve([]);
      var filtre = partieId ? "partie_id=eq." + encodeURIComponent(partieId)
        : packId ? "partie_id=is.null&jeu=eq." + encodeURIComponent(packId)
        : "partie_id=is.null&jeu=is.null";
      return api("/rest/v1/archiviste_console?select=id,pseudo,role,contenu,type,donnees,cree_le,partie_id,jeu&"
        + filtre + "&order=id.desc&limit=60", { token: m.access_token })
        .then(function (l) { return (l || []); })
        .catch(function () { return []; });
    },

    /* V3 : le dé roule DANS LA TOMBE (rpc lancer_des) — le serveur seul
       connaît le résultat avant de le graver, le client ne choisit plus
       son jet ; il l'apprend par la poussée, comme les autres. V4 : le
       jet se grave dans le canal de la partie quand il y en a une. */
    lancerDes: function (nb, faces, note, partieId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve();
      return api("/rest/v1/rpc/lancer_des", {
        method: "POST", token: m.access_token,
        /* le paramètre serveur s'appelle p_partie : jamais ambigu avec la colonne */
        body: { nb: nb, faces: faces, note: note || null, p_partie: partieId || null }
      });
    },

    /* ══ LA PARTIE (moteur générique) : une aventure partagée — un MJ
       (le créateur), un code d'invitation, des joueurs qui se joignent.
       Les mêmes fonctions serviront TOUT pack multijoueur : elles ne
       connaissent que l'id du jeu, jamais son nom. ══ */

    /* Ouvrir une aventure : le créateur en devient le MJ (policy : on ne
       crée que SOI MJ d'une partie OUVERTE). */
    creerPartie: function (jeu, nom, compteId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve(null);
      return api("/rest/v1/archiviste_parties", {
        method: "POST", token: m.access_token, prefer: "return=representation",
        body: { jeu: jeu, nom: nom || "Aventure sans nom", mj_compte_id: compteId }
      }).then(function (l) { return (l && l[0]) || null; });
    },

    /* Le lobby : les aventures OUVERTES du jeu — via la VUE lobby (le
       pseudo du MJ et le nombre de joueurs sont servis par la Tombe,
       les comptes ne se lisent pas entre eux). V47 : ne montrent que les
       salles que le MJ a OUVERTES — publiques ET privées (V48.3 : les
       privées apparaissent dans AVENTURES OUVERTES, leur mot de passe se
       demande dans la ligne), les fermées n'existent pour personne.
       V48.8 : les parties LANCÉES (en_cours) y vivent AUSSI — le joueur
       voit ce que le MJ vient de lancer, et peut arriver en cours. */
    listerParties: function (jeu) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve([]);
      var qO = api("/rest/v1/archiviste_parties_lobby?select=*"
        + "&jeu=eq." + encodeURIComponent(jeu)
        + "&statut=eq.ouverte&salle_ouverte_le=not.is.null&visibilite=in.(publique,privee)&supprime_le=is.null&order=cree_le.asc", { token: m.access_token })
        .catch(function () { return []; });
      var qC = api("/rest/v1/archiviste_parties_lobby?select=*"
        + "&jeu=eq." + encodeURIComponent(jeu)
        + "&statut=eq.en_cours&visibilite=in.(publique,privee)&supprime_le=is.null&order=lance_le.desc", { token: m.access_token })
        .catch(function () { return []; });
      return Promise.all([qO, qC]).then(function (l) { return (l[0] || []).concat(l[1] || []); });
    },

    /* Mes aventures EN COURS (MJ ou joueur) — pour REPRENDRE après un
       reload : la partie survit à l'appareil, elle vit dans la Tombe.
       V47 : les salles d'attente que le MJ TIENT (ouverte + salle
       ouverte) vivent ici aussi — on reprend la table sans attendre le
       lancement. REPRENDRE reste grisée si la salle est fermée. */
    mesParties: function (jeu, compteId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve([]);
      var qC = api("/rest/v1/archiviste_parties_lobby?select=*"
        + "&jeu=eq." + encodeURIComponent(jeu) + "&statut=eq.en_cours&supprime_le=is.null&order=lance_le.asc", { token: m.access_token })
        .catch(function () { return []; });
      var qO = api("/rest/v1/archiviste_parties_lobby?select=*"
        + "&jeu=eq." + encodeURIComponent(jeu) + "&statut=eq.ouverte&salle_ouverte_le=not.is.null&supprime_le=is.null&order=salle_ouverte_le.desc", { token: m.access_token })
        .catch(function () { return []; });
      var qJ = api("/rest/v1/archiviste_partie_joueurs?select=partie_id&compte_id=eq." + compteId,
        { token: m.access_token }).catch(function () { return []; });
      return Promise.all([qC, qO, qJ]).then(function (r) {
        var ids = {};
        (r[2] || []).forEach(function (pj) { ids[pj.partie_id] = true; });
        var vus = {}, liste = [];
        (r[0] || []).concat(r[1] || []).forEach(function (p) {
          if (vus[p.id]) return;
          vus[p.id] = true;
          if (p.mj_compte_id === compteId || ids[p.id]) liste.push(p);
        });
        return liste;
      });
    },

    /* Toutes les aventures créées par ce compte (tout statut) — registre MJ */
    mesAventures: function (jeu, compteId) {
      var m = lire();
      if (!m || !m.access_token) return Promise.resolve([]);
      return api("/rest/v1/archiviste_parties_lobby?select=*"

    sauverFichePartie: function (partieId, compteId, contenu) {

    listerPersonnages: function (jeu) {

    creerPersonnage: function (jeu, compteId, nom, contenu) {

    },

    /* Le canal temps réel : la Tombe pousse ses changements à l'écran —
       la synchro devient de la poussée, pas du polling. */
    tempsReel: tempsReel
  };
})();

      connexion: function (email, mdp) {

/* ── V48.4 — LA FUSION DE LA RONDE DES PRÉSENTS (pure) ──
   Un diff de présence du protocole Phoenix porte, pour une MÊME clé,
   le neuf (joins : le méta re-pisté) ET le départ de l'ancien méta
   (leaves) quand un joueur CHANGE DE PLACE (hub ↔ pack : l'app
   re-piste sans re-joindre). La sortie ne compte donc que si la clé
   n'est PAS revenue dans le même diff — sinon le delete écrasait le
   join et le joueur s'évanouissait de CONNECTÉS à chaque déplacement.
   Les fantômes sans pseudo (canal de l'institution) restent dehors. */
const fondrePresents = (precedent, diff) => {
  const suivant = {
    ...(precedent || {})
  };
  const d = diff && typeof diff === "object" ? diff : {};
  const arrives = d.joins || {};
  Object.keys(arrives).forEach(cle => {
    const m = arrives[cle] && arrives[cle].metas && arrives[cle].metas[0] || null;
    if (m && m.pseudo) suivant[cle] = m;else delete suivant[cle];
  });
  const partis = d.leaves || {};
  Object.keys(partis).forEach(cle => {
    if (!(cle in arrives)) delete suivant[cle];
  });
  return suivant;
};

/* §PACKS_CHARGES§ — en page construite, le chargeur de packs (forge) fetch
   packs/*.json AVANT le boot et pose window.LARCHIVISTE_PACKS ; chargerPack
   relit la fenêtre à CHAQUE appel (le boot n'arrive qu'une fois les packs
   chargés). En canvas, la fenêtre n'a rien posé → les données inline font foi. */
const PACKS_CHARGES = typeof window !== "undefined" && window.LARCHIVISTE_PACKS || null;
const NOYAUX = PACKS_CHARGES && PACKS_CHARGES.noyaux || {};
const CONTENU = PACKS_CHARGES && PACKS_CHARGES.packs || {};
const NOYAU = NOYAUX["noyau-40k"] || {};
const NOYAU_D100 = NOYAUX["noyau-d100"] || {};
/* §FIN:PACKS_DATA§ */

/* Le chargeur universel : manifeste → dépendance résolue → noyau + contenu.
   Règle d'or du manifeste : un mod dont une référence ne résout pas est
   refusé avec un message clair — jamais de crash mystérieux.
   Trajectoire pragmatique : les packs peuvent venir de FICHIERS
   (window.LARCHIVISTE_PACKS, posés par le chargeur de la page construite
   avant le boot) — on relit la fenêtre à CHAQUE appel, le repli INLINE
   (canvas) reste la même source de vérité côté simulation. */
function chargerPack(manifeste) {
  const dep = manifeste.depend_de[0];
  const fichiers = typeof window !== "undefined" && window.LARCHIVISTE_PACKS || PACKS_CHARGES || {};
  return {
    ...manifeste,
    noyau: dep ? fichiers.noyaux && fichiers.noyaux[dep.id] || NOYAUX[dep.id] || null : null,
    contenu: fichiers.packs && fichiers.packs[manifeste.id] || CONTENU[manifeste.id] || null
  };
}

/* Le gabarit de journal : le pack donne un TEXTE à trous « {champ} », jamais
   du code — l'écran qui connaît le perso calcule les valeurs. */
function rendreGabarit(gabarit, vals) {
  return String(gabarit).replace(/\{(\w+)\}/g, (m, k) => vals && vals[k] !== undefined ? vals[k] : m);
}

/* §SECTION:MOTEUR§ — LE MOTEUR DU LIVRE GRAVÉ (Stormbringer 2ᵉ éd.).
   REGLES_SB : une fonction pure par règle des chapitres 2-8, copie
   mécanique de regles/regles-sb.js de la crypte (sources jumelles —
   tout écart doit être reflété des deux côtés). Les données ne vivent
   PAS ici : le livre gravé (packs/livre-sb-v2.json, v7.0) est fetché
   par chargerLivre à l'entrée d'un pack qui déclare « livre », puis
   injecté via charger(). Adaptations app : le require node est retiré
   (DONNEES = null au boot), l'export module devient window.REGLES_SB.
   V0.63 : invisible — aucun panneau ne l'utilise encore. */
/* ═══════════════════════════════════════════════════════════════════════
   REGLES-SB — LES FONCTIONS DU LIVRE GRAVÉ (Stormbringer 2ᵉ éd., §2-§8)
   ─────────────────────────────────────────────────────────────────────
   Une fonction pure par règle du chapitres 2 (Création du personnage), 3 (Déplacements, combats et dommages) 4 (Compétences), 5 (Sorcellerie), 6 (Cultes et prêtres), 7 (Santé mentale) et 8 (Animaux, créatures et monstres),
   tirée de regles/livre-sb.json (les données) et testée par
   test-regles-sb.js contre les exemples DU LIVRE (Merak Gren §2.6, Minakh Meen §2.3.7.1, les points de vie §2.1.8,
   les parades de Merak §3.3.3, les ripostes d'Elric §3.3.7, la table des armes §3.5.2,
   les blessures §3.9, l'exemple naval §3.11, Lucria §4.1-4.9, Tristelune §4.9.4,
   la liste des compétences §4.11, Goor-Rai-Huuz §5.2.1.2, Elric §5.6.1, Zanat Sarka §5.6, Xonat §5.4, Marlen Malkor §5.7.1.5, la table de résistance §5.7, Donblas §5.11.1.2, Vadin-gor §6.5, les Vertus et Champions de la Loi §6.7.4-6.7.5, Tarz §7.4, le gorille §8.2.1 et Bellbane §8.3.6).

   Convention : les fonctions de CALCUL sont pures (résultats de dés
   passés en paramètre) ; les fonctions de TIRAGE acceptent une
   fonction r(expr) qui lance « 1D6 », « 2D4 »… (par défaut Math.random).
   Les bonus de famille utilisent les MÊMES formules que le moteur du
   launcher V0.62 (bonusFamilles de VueNoyauD100) — sources jumelles.
   ─────────────────────────────────────────────────────────────────────
   Usage node   : const REGLES = require("./regles-sb.js")
   Usage app    : injecter les données puis appeler (module embarquable)
   ═══════════════════════════════════════════════════════════════════════ */

let DONNEES = null;
const REGLES_SB = {
  version: "7.0",
  charger(donnees) {
    DONNEES = donnees;
    return REGLES_SB;
  },
  /* — Le dé du livre : « 3D6 », « 1D10 », « 2D4 »… — */
  lancer(expr, r) {
    const jet = typeof r === "function" ? r : (n, f) => 1 + Math.floor(Math.random() * f);
    const m = /^(\d*)D(\d+)$/.exec(String(expr).trim().toUpperCase());
    if (!m) throw new Error("expression de dé inconnue : " + expr);
    const nb = m[1] ? Number(m[1]) : 1,
      faces = Number(m[2]);
    let s = 0;
    for (let i = 0; i < nb; i++) s += jet(nb, faces);
    return s;
  },
  /* ════════ §2.1 CARACTÉRISTIQUES ════════ */

  /* 3D6 pour chacune des 7 ; total ≤ 52 → relance autorisée */
  tirerCaracteristiques(r) {
    const caracs = {};
    for (const k of DONNEES.caracteristiques.liste) caracs[k] = REGLES_SB.lancer("3D6", r);
    const total = Object.values(caracs).reduce((a, b) => a + b, 0);
    return {
      caracs,
      total,
      relanceAutorisee: total <= 52
    };
  },
  /* §2.1.8 — PV = CON ± TAI ; plancher = moitié de la CON */
  pointsDeVie(con, tai) {
    const brut = con + (tai > 12 ? tai - 12 : tai < 9 ? tai - 9 : 0);
    return Math.max(brut, Math.floor(con / 2));
  },
  blessureMajeure(pv) {
    return Math.ceil(pv / 2);
  },
  /* §2.1.9 — SAN = 5×POU (+ mod. nationalité) ; SFT = SAN/2, immuable */
  santeMentale(pou, modNationalite) {
    const san = 5 * pou + (modNationalite || 0);
    return {
      san,
      sft: Math.floor(san / 2)
    };
  },
  folieTemporaire(pertes, sft, rounds) {
    return {
      fou: pertes >= sft && rounds <= 50
    };
  },
  /* §2.1.3.1 — Tailles humaines */
  tailleHumaine(tai) {
    const l = DONNEES.taillesHumaines.lignes.find(x => x[0] === tai);
    if (!l) return null;
    return {
      tai: l[0],
      hauteurCm: l[1],
      poidsKgLeger: l[2],
      poidsKgMoyen: l[3],
      poidsKgLourd: l[4]
    };
  },
  /* ════════ §2.2 NATIONALITÉS ════════ */

  nationaliteParJet(jet100) {
    const n = DONNEES.nationalites.liste.find(x => {
      const [a, b] = x.plage.split("-").map(Number);
      return jet100 >= a && jet100 <= (b || a);
    });
    return n || null;
  },
  nationaliteParId(id) {
    return DONNEES.nationalites.liste.find(n => n.id === id) || null;
  },
  /* Applique les ajustements d'une nationalité aux caracs.
     r = fonction de tirage ; opts = { sexe } (Myrrhyn : CHA femme). */
  appliquerNationalite(caracs, nation, r, opts) {
    const c = Object.assign({}, caracs);
    for (const a of nation.ajustements || []) {
      if (a.siSexe && (!opts || opts.sexe !== a.siSexe)) continue;
      if (a.si && !(c[a.c] >= Number(a.si.replace(">=", "")))) continue;
      const v = a.des ? REGLES_SB.lancer(a.des, r) : a.fixe;
      c[a.c] = c[a.c] + (a.signe === -1 ? -v : v);
    }
    return {
      caracs: c,
      sanMod: nation.san || 0
    };
  },
  isSorcier(caracs) {
    return caracs.INT + caracs.POU >= 32;
  },
  /* ════════ §2.3 CLASSES ET ORIGINE SOCIALE ════════ */

  origineSociale(jet100, jet10) {
    const e = DONNEES.origineSociale.table.find(x => {
      const [a, b] = x.plage.split("-").map(Number);
      return jet100 >= a && jet100 <= (b || a);
    });
    if (!e) return null;
    const res = {
      classe: e.classe,
      special: null,
      modCompetences: 0
    };
    if (e.classe === "Guerrier" && jet10 >= 9) res.special = "Assassin";
    if (e.classe === "Marchand") res.special = jet10 >= 8 ? "Négociant" : "Commerçant";
    if (e.classe === "Marin" && jet10 === 9) {
      res.special = "Second";
      res.modCompetences = 5;
    }
    if (e.classe === "Marin" && jet10 === 10) {
      res.special = "Capitaine";
      res.modCompetences = 10;
    }
    return res;
  },
  /* §2.3 — l'âge plie les compétences */
  ajustementAge(age) {
    if (age < 25) return {
      type: "jeune",
      parAn: -5,
      max: null
    };
    if (age <= 40) return {
      type: "adulte",
      parAn: Math.min(age - 25, 15),
      max: 15
    };
    return {
      type: "vieux",
      parAn: -(age - 40),
      physiqueSeulement: true,
      max: null
    };
  },
  /* Les compétences d'une classe, calculées avec les bonus de famille.
     opts = { modCompetences (Second/Capitaine), de100 (bases 1D100), de6 (Équitation guerrier 60%) }.
     Les armes « attaque_parade » rendent Attaque ET Parade séparément. */
  competencesClasse(idClasse, bonus, opts) {
    const cl = DONNEES.classes.liste[idClasse];
    if (!cl) throw new Error("classe inconnue : " + idClasse);
    const o = opts || {};
    const lignes = [];
    const sources = idClasse === "assassin" ? DONNEES.classes.liste.assassin.competences.concat(DONNEES.classes.liste.guerrier.competences) : cl.competences;
    for (const s of sources) {
      const b = s.bonus === "attaque_parade" ? null : bonus[s.bonus] || 0;
      const base = typeof s.base === "number" ? s.base : s.base === "1D100" ? o.de100 != null ? o.de100 : REGLES_SB.lancer("1D100") : s.base;
      if (s.bonus === "attaque_parade") {
        lignes.push({
          nom: s.nom,
          type: "arme",
          base,
          attaque: base + bonus.attaque + (o.modCompetences || 0),
          parade: base + bonus.parade + (o.modCompetences || 0),

        });
      } else {

  /* §2.3.7 — Grand Prêtre : 1D100 ≤ (POU+CHA)/10 */
  grandPretre(pou, cha, jet100) {

  nombreAfflictions(jet4) {

  bonusFamilles(caracs, opts) {
    const o = opts || {};

    const inv = k => cr[k] > 12 ? 12 - cr[k] : cr[k] < 9 ? 9 - cr[k] : 0;
    const age = o.age != null ? o.age : 25;
    const taux = o.taux != null ? o.taux : o.classe === "Prêtre" || o.classe === "pretre" ? 3 : o.classe === "Noble" || o.classe === "noble" ? 2 : 1;
    return {
      attaque: plus("FOR") + plus("INT") + plus("POU") + plus("DEX"),
      parade: plus("FOR") + plus("POU") + plus("DEX") + inv("TAI"),
      agilite: plus("FOR") + plus("POU") + plus("DEX") + inv("TAI"),
      manipulation: plus("FOR") + plus("INT") + plus("POU") + plus("DEX"),
      perception: plus("INT") + plus("POU"),
      discretion: plus("INT") + plus("DEX") + inv("TAI"),
      connaissance: Math.max(0, cr.INT - 12) * 2 + Math.max(0, age - 25) * taux,

  /* §2.5.3 — Bonus aux dommages (table FOR+TAI) */
  bonusDommages(forc, tai) {
    const t = forc + tai;

      if (x.plage.endsWith("+")) return t >= Number(x.plage.replace("+", ""));

  /* ════════ §2.7 AUGMENTATION DES CARACTÉRISTIQUES ════════ */

  /* Jet sauveur réussi → 2D6 : 7 = +1 pt, 2 = −1 pt, sinon rien */
  augmentationCarac(jet2d6) {

  /* ════════ §2.9 PETITE HISTOIRE PERSONNELLE ════════ */

  histoire(jet100) {
    const e = DONNEES.histoirePersonnelle.table.find(x => {

  /* ════════ §3.1 DÉPLACEMENTS ════════ */

  /* Terrain cumulatif : chaque réduction s'applique au reste, floor à chaque étape.

  deplacementJournalier(baseKm, terrains) {
    let km = baseKm;
    for (const t of terrains || []) {
      const f = DONNEES.deplacement.terrain.find(x => x.id === t);
      if (!f) throw new Error("terrain inconnu : " + t);

  /* Scénario, 5 minutes : 120 m prudent, 300 m normal, 1600 m course ; monture ×2 */
  deplacementScenario(mode, monte) {

  /* Mêlée, 12 secondes : 60 m en course, 30 m si gêné */
  deplacementMelee(mode) {

  /* Plaques complètes avec FOR < 11 : mouvement /3, −1 DEX par point manquant */

  /* ════════ §3.2 ROUND DE MÊLÉE ════════ */

  roundMelee() {

      sequence: DONNEES.roundDeMelee.sequence.slice()

  },
  initiative(jetA, dexA, jetB, dexB) {

  attaquantsActifs(nAttaquants) {

  /* ════════ §3.3 COMPÉTENCES AUX ARMES ════════ */

  /* Arme inconnue ramassée : max(5, bonus) — l'exemple de Merak : max(5, 7) = 7 */
  armeInconnue(bonus) {

  apprendreArme(jet100, bonus) {

  /* §3.3.1.1 — progression : 1D100 + mod INT > compétence actuelle → +1D10 */
  experienceArme(jet100, competence, int) {

  /* Parades successives : −20% cumulatifs (Merak : 41 → 21 → 1) */
  paradeSeuil(seuil, tentative) {

  paradeProjectile(seuil) {

  paradePossibleContre(projectile, arme) {

  /* Ripostes du Maître : chaque attaque du round −20% (Elric : 112 → 92 → 72) */
  attaqueSeuilRound(seuil, rang) {

  /* Critique : jet ≤ compétence/10, minimum 01 */
  estCritique(jet, seuil) {

  /* Maladresse : 00 toujours ; 99 si compétence < 50% */
  estMaladresse(jet, seuil) {

  maladresseEffets(categorie, jet100) {

  /* ════════ §3.4 TACTIQUES ════════ */

  /* ════════ §3.5.2 TABLE DES ARMES ════════ */

  armeParNom(nom, cat) {

  armureProtection(type, jet, heaume) {

  classeBlessure(degats, pv) {

  degatsChute(metres, opts) {

    const res = {

    };

  /* ════════ §4.1 LE CHAPITRE DES COMPÉTENCES ════════ */

  determinerCompetence(jet100, bonus) {

  echangerSecretsPoisons(jetD10) {

  antidoteSeuil(compPoisons) {

  immuniteNaturelle(classe, jet100, con) {

  useEffect(() => {
    if (vue !== "pack" || !packActif || !CLOUD || !session) return;
    let vivant = true;
    CLOUD.listerPersonnages(packActif.id).then(l => {
      if (vivant) setMesPersonnages(l || []);
    }).catch(() => {});
    return () => {
      vivant = false;
    };
  }, [vue, packActif ? packActif.id : null, session ? session.compteId : null]);

  /* Parler dans la Console : le message part à la Tombe (elle le signe et
     le pousse à tous, nous compris), dans le canal du CONTEXTE. */
  const [consoleEnvoi, setConsoleEnvoi] = useState(false);
  const envoyerConsoleMessage = texte => {
    if (!CLOUD || !session) return;
    const ctx = contexteConsoleRef.current || {};
    const ev = interpreterConsole(texte); /* /de 3d6 et /tour X deviennent typés */
    if (!ev.contenu && !ev.des) return;
    /* V0.37 : les dés se roulent dans le canal de la PARTIE (la Tombe
       grave p_partie) ou au hub (fil global) — jamais dans le salon
       d'un JDR, qui n'est qu'un canal de paroles. */
    if (ev.des && !ctx.partieId && ctx.packId) {
      showToast("Les dés se roulent à la table — le salon est fait pour parler.");
      return;
    }
    setConsoleEnvoi(true);
    /* V3 : /de part à la Tombe — elle roule et grave elle-même ; V4 :
       dans le canal de la partie quand il y en a une. */
    const envoi = ev.des ? CLOUD.lancerDes(ev.des.nb, ev.des.faces, undefined, ctx.partieId || null).catch(() => showToast("La Tombe n'a pas gravé le dé — réessayez.")) : CLOUD.envoyerConsole(session.compteId, ev.contenu, ev.type, ev.donnees, ctx.partieId || null, ctx.packId || null).catch(() => showToast("La Console n'a pas gravé — réessayez."));
    envoi.then(() => setConsoleEnvoi(false));
  };

  /* V0.66 — PARLER DANS LE SALON DU JEU : la Taverne du d100 est le lobby
     de SON JDR — le canal (jeu, null) reçoit les paroles, jamais les dés
     (ils vivront à la table de l'aventure, sur sa page future). */
  const envoyerSalonJeu = texte => {
    if (!CLOUD || !session || !salonJeuIdRef.current) return;
    const ev = interpreterConsole(texte);
    if (!ev.contenu && !ev.des) return;
    if (ev.des) {
      showToast("Les dés se roulent à la table — le salon est fait pour parler.");
      return;
    }
    setConsoleEnvoi(true);
    CLOUD.envoyerConsole(session.compteId, ev.contenu, ev.type, ev.donnees, null, salonJeuIdRef.current).catch(() => showToast("Le salon n'a pas gravé — réessayez.")).finally(() => setConsoleEnvoi(false));
  };

  /* V3 : le journal de chaque moteur se grave aussi dans la Console —
     les jets du pack deviennent des événements partagés, vus de tous.
     V4 : dans le canal de la partie quand il y en a une. */
  const journalVersConsole = (type, texte) => {
    if (!CLOUD || !session) return;
    const ctx = contexteConsoleRef.current || {};
    CLOUD.envoyerConsole(session.compteId, texte, "journal", {
      evenement: type
    }, ctx.partieId || null, ctx.packId || null).catch(() => {});
  };

  /* ── Les gestes de LA PARTIE : tous génériques, tous pour le moteur ── */
  const creerAventure = nomAventure => {
    if (!CLOUD || !session || !packPartie) return Promise.resolve();
    return CLOUD.creerPartie(packPartie.id, (nomAventure || "").trim(), session.compteId).then(p => {
      /* V46b : l'aventure NAIT sans lancer la salle — le MJ reste dans le
         moteur d'aventure, la ligne apparaît dans MES AVENTURES, et le
         lancement se fait depuis la liste (⚙ → OUVRIR LA SALLE). */
      if (p) {
        showToast("Aventure « " + p.nom + " » créée — ouvrez-la quand vous voulez dans AVENTURES (⚙ → OUVRIR LA SALLE).");
        rechargerListes();
      }
    }).catch(() => showToast("La Tombe n'a pas ouvert l'aventure — réessayez."));
  };
  const rejoindreAventure = p => {
    if (!CLOUD || !session) return Promise.resolve();
    /* V42b : le MJ ne rejoint pas sa propre aventure — il en est déjà le
       MJ ; deux fenêtres du même compte ne peuvent plus s'y dédoubler. */
    if (p.mj_compte_id === session.compteId) {
      showToast("C'est votre aventure — vous en êtes déjà le MJ.");
      setPartie(p);
      return rechargerPartie(p.id);
    }
    return CLOUD.rejoindrePartie(p.id, session.compteId).then(() => {
      setPartie(p);
      return rechargerPartie(p.id);
    }).catch(() => showToast("Impossible de rejoindre — la salle est peut-être fermée, privée, ou l'aventure close."));
  };
  /* V47 — OUVRIR LA SALLE : le MJ tranche, publique ou privée. La Tombe
     grave et rend la salle ; le MJ y entre. Le mot de passe reste en
     mémoire de session : il s'affiche à lui seul dans la salle. */
  const ouvrirSalleAventure = (p, visibilite, mdpSaisi) => {
    if (!CLOUD || !session) return Promise.resolve();
    return CLOUD.ouvrirSalle(p.id, visibilite, mdpSaisi).then(ligne => {
      setMdpSalle(visibilite === "privee" ? (mdpSaisi || "").trim() : null);
      showToast("Salle ouverte — " + (visibilite === "publique" ? "elle vit dans « AVENTURES OUVERTES » du lobby de tous." : "vos joueurs entrent avec le mot de passe que vous avez choisi."));
      setPartie(ligne || p);
      rechargerScelles(); /* V0.39 : le scellé suit — privée le pose, publique l'efface */
      return rechargerPartie(p.id);
    }).catch(e => showToast(e && e.message || "La Tombe refuse d'ouvrir la salle — réessayez."));
  };
  /* V49 — GRAVER LE MOT DE PASSE DE LA SALLE DEPUIS L'ÉCROU : vide = la
     porte s'ouvre à tous, texte = cadenassée (hash côté Tombe). mdpSalle
     suit pour que la salle d'attente montre au MJ son propre mot de passe. */
  const graverMdpSalle = (p, mdpSaisi) => {
    const cadenas = (mdpSaisi || "").trim().length > 0;
    return CLOUD.majMotDePasseSalle(p.id, mdpSaisi).then(ligne => {
      showToast(cadenas ? "« " + p.nom + " » est cadenassée — son mot de passe sera demandé aux joueurs." : "« " + p.nom + " » est ouverte à tous — plus de mot de passe.");
      setMdpSalle(cadenas ? (mdpSaisi || "").trim() : null);
      return rechargerListes().then(() => ligne);
    }).catch(e => showToast(e && e.message || "La Tombe refuse de graver le scellé — réessayez."));
  };
  const rejoindreAventureMdp = mdpSaisi => {
    if (!CLOUD || !session || !packPartie) return Promise.resolve();
    return CLOUD.rejoindrePrivee(packPartie.id, mdpSaisi).then(p => {
      if (!p) {
        showToast("Aucune salle privée ne porte ce mot de passe.");
        return;
      }
      if (p.mj_compte_id === session.compteId) {
        showToast("Ce mot de passe est celui de VOTRE salle — vous en êtes le MJ.");
      } else {
        showToast("Vous rejoignez « " + p.nom + " »");
      }
      setPartie(p);
      return rechargerPartie(p.id);
    }).catch(e => showToast(e && e.message || "Aucune salle privée ne porte ce mot de passe."));
  };
  const reprendreAventure = p => {
    if (!CLOUD || !session) return Promise.resolve();
    /* V47 : le MJ qui REPREND une partie lancée RÉOUVRE la salle — les
       joueurs peuvent le suivre. Le joueur, lui, ne reprend QUE si la
       salle est ouverte (le bouton est grisé sinon — la vue décide). */
    if (p.mj_compte_id === session.compteId && p.statut === "en_cours" && !p.salle_ouverte_le) {
      CLOUD.rouvrirSalle(p.id).then(() => rechargerPartie(p.id)).catch(() => {});
    }
    setPartie(p);
    return rechargerPartie(p.id);
  };
  const lancerAventure = p => {
    if (!CLOUD) return;
    /* V0.37 — [▶ LANCER] direct : la porte naît PUBLIQUE, sauf si la
       salle est déjà tenue ou qu'un SCELLÉ PRIVÉ a été gravé par
       l'écrou — LANCER respecte alors le cadenas et ouvre privée. */
    CLOUD.lancerPartie(p.id, !(p.salle_ouverte_le || p.visibilite === "privee")).catch(() => showToast("La Tombe refuse le lancement — réessayez."));
    /* RIEN d'autre ici : l'entrée se fait par la POUSSÉE, le même chemin
       pour le MJ et les joueurs — un seul code, une seule vérité. */
  };
  /* V0.37 — [■ FERMER] : LA SEULE SENTENCE qui referme l'aventure. Les
     joueurs connectés sortent par la poussée temps réel (statut close :
     toast + retour au hub), et plus personne ne peut la rejoindre —
     elle quitte les AVENTURES À REJOINDRE. */
  const fermerAventure = p => {
    if (!CLOUD || !p) return;
    CLOUD.fermerPartie(p.id).then(() => showToast("« " + p.nom + " » est close — les joueurs ont rendu la table.")).catch(() => showToast("La Tombe refuse de clore — réessayez."));
  };
  /* V46 : EFFACER une aventure — la Tombe la garde en Corbeille ; elle
     disparaît de nos écrans (les listes se rechargent par la poussée
     temps réel, on force une resynchro de sécurité). */
  const supprimerAventure = p => {
    if (!CLOUD || !session) return;
    CLOUD.supprimerPartie(p.id).then(() => {
      showToast("Aventure effacée — elle repose en Corbeille, visible de l'institution seule.");
      rechargerListes();
    }).catch(() => showToast("La Tombe a refusé la sentence."));
  };
  const quitterAventure = p => {
    if (!CLOUD || !session) return;
    if (p.mj_compte_id === session.compteId) {
      /* V0.37 — QUITTER NE CASSE PLUS RIEN : la salle d'attente seule
         se referme (l'aventure reste dans MES AVENTURES, relançable) ;
         une partie EN COURS survit ENTIÈRE au départ du MJ — joueurs,
         salle, EN LIGNE — il revient par ⚙ → REPRENDRE sans rien casser.
         Seul [■ FERMER] referme l'aventure pour de bon. */
      if (p.statut === "ouverte" && p.salle_ouverte_le) {
        CLOUD.fermerSalle(p.id).catch(() => {});
        showToast("Salle refermée — l'aventure reste dans MES AVENTURES (▶ LANCER).");
      } else {
        showToast("Vous quittez la table — l'aventure reste en ligne dans MES AVENTURES (⚙ → REPRENDRE).");
      }
    } else {
      CLOUD.quitterPartie(p.id, session.compteId).catch(() => {});
      showToast("Vous quittez la table.");
    }
    setPartie(null);
    setPartieJoueurs([]);
    setFichesPartie([]);
  };

  /* L'auto-entrée : quand la partie (dont on est membre) passe en_cours
     et qu'on est sur l'écran partie — on ENTRE dans le pack, le rôle
     dérivé de la table (MJ = le créateur, joueur = le reste). */
  useEffect(() => {
    if (vue !== "partie" || !partie || partie.statut !== "en_cours" || !packPartie || !session) return;
    const estMj = partie.mj_compte_id === session.compteId;
    const estMembre = estMj || partieJoueurs.some(j => j.compte_id === session.compteId);
    if (!estMembre) return; /* spectateur d'une partie close à notre table */
    const role = estMj ? "mj" : "joueur";
    setRolesPacks(r => ({
      ...r,
      [packPartie.id]: role
    }));
    setPackActif(chargerPack(packPartie)); /* le manifeste devient un pack CHARGÉ */
    setVue("chargement");
    setEtapes([]);
    const liste = etapesChargement(packPartie, role);
    setTotalEtapes(liste.length);
    liste.forEach((t, i) => setTimeout(() => setEtapes(e => [...e, t]), 320 * (i + 1)));
    setTimeout(() => setVue("pack"), 320 * liste.length + 550);
  }, [vue, partie, partieJoueurs, packPartie]);

  /* ════════ V0.76 — LE PERSO POUR L'AVENTURE ════════
     La sélection du registre vit dans le sac du compte (la Tombe) :
     un perso par jeu, le clic sur un perso pris le DÉPOSE. Le bouton
     vit dans « MES PERSONNAGES » (PRENDRE à gauche de l'écrou) ; la
     fiche s'affiche à la prise. */
  const choisirPersoAventure = (jeu, p) => {
    const deja = persoChoisi[jeu] === p.id;
    setPersoChoisi({
      ...persoChoisi,
      [jeu]: deja ? null : p.id
    });
    showToast(deja ? "« " + p.nom + " » rend sa place au registre." : "« " + p.nom + " » partira à l'aventure.");
  };

  /* Mode CLOUD — le sac du compte (installations, favoris, rôles) part dans le
     nuage dès qu'il change (débouncé) : l'état vit dans le compte, jamais
     dans l'appareil. */
  useEffect(() => {
    if (!CLOUD || !session) return;
    const t = setTimeout(() => CLOUD.sauveMemoire(session.compteId, {
      installes,
      favoris,
      rolesPacks,
      persoChoisi
    }).catch(() => {}), 700);
    return () => clearTimeout(t);
  }, [session, installes, favoris, rolesPacks, persoChoisi]);

  /* ════════ Le module de Synchronisation (Core) — TEMPS RÉEL ════════
     La Tombe POUSSÉ ses changements (Supabase Realtime, WebSocket) : un
     sceau apposé depuis l'Archivisterium, une suspension, un avatar
     changé d'un autre appareil — tout arrive à l'écran instantanément,
     plus aucune pulsation. Les vérifications n'écrivent RIEN en base
     (horodater: false) — la Tombe ne s'annonce pas à elle-même. En
     coupure de canal, une pulsation de secours (30 s) reprend le
     relais ; à chaque rebranchement et au retour sur l'onglet, la
     vérité repart de la Tombe. */
  const [etatTempsReel, setEtatTempsReel] = useState("coupure");
  const verifierSession = async () => {
    try {
      const p = await CLOUD.sessionActuelle({
        horodater: false
      });
      if (!p) {
        seDeconnecter();
        showToast("Session scellée par la Tombe — reconnexion requise.");
        return;
      }
      if (p.statut === "en_attente") {
        if (session.statut !== "en_attente") {
          setSession(p);
          setVue("attente");
          showToast("Votre compte attend le sceau de l'Archiviste.");
        }
        return;
      }
      if (session.statut === "en_attente") {
        /* Le sceau est apposé pendant l'attente : les archives s'ouvrent. */
        seConnecter(p);
        return;
      }
      setSession(s => s ? {
        ...s,
        pseudo: p.pseudo,
        tag: p.tag,
        email: p.email,
        statut: p.statut
      } : s);
    } catch (e) {/* la Tombe sommeille — le canal rebranché relancera */}
  };
  useEffect(() => {
    if (!CLOUD || !session) return;
    let attente = null;
    const relance = () => {
      if (attente) return;
      attente = setTimeout(() => {
        attente = null;
        verifierSession();
      }, 400);
    };
    const canal = CLOUD.tempsReel({
      presenceKey: session.compteId,
      /* le pouls : présent tant que la socket vit */
      presenceInfo: () => ({
        /* V47 : la ronde dit qui est en ligne et où il se tient */
        compte_id: session.compteId,
        pseudo: session.pseudo,
        jeu: packPartieRef.current && packPartieRef.current.id || null
      }),
      surPresence: (p, ev) => {
        /* V47 : LA RONDE DES PRÉSENTS — l'état initial remplace tout ; les
           diffs ne fondent que les entrées et sorties. Les fantômes sans
           pseudo (sessions d'une autre ère) restent invisibles. */
        if (!p || typeof p !== "object") return;
        if (ev === "presence_state") {
          const liste = {};
          Object.keys(p).forEach(cle => {
            const m = p[cle] && p[cle].metas && p[cle].metas[0] || null;
            if (m && m.pseudo) liste[cle] = m;
          });
          setPresents(liste);
          return;
        }
        if (ev === "presence_diff") {
          /* V48.4 : la fusion vit dans fondrePresents — pure, éprouvée au
             harnais contre les VRAIS payloads de la Tombe. */
          setPresents(prev => fondrePresents(prev, p));
        }
      },
      tables: [{
        table: "archiviste_comptes",
        filtre: "compte_id=eq." + session.compteId
      }, {
        table: "archiviste_memoire",
        filtre: "compte_id=eq." + session.compteId
      }, {
        table: "archiviste_console"
      }, /* le fil de tous — aucune surveillance de session là-dessus */
      {
        table: "archiviste_parties"
      }, /* le lobby et la partie courante, poussés */
      {
        table: "archiviste_partie_joueurs"
      }, /* la table qui vit : arrivées et départs */
      {
        table: "archiviste_partie_fiches"
      } /* V43 : les fiches de la table — création, PV */],
      surChangement: donnee => {
        const evType = donnee && (donnee.type || donnee.eventType); /* payload réel : « type » (eventType ancien accepté) */
        const ligne = donnee && (donnee.record || donnee.new); /* payload réel : « record » (le « new » de la doc JS n'arrive jamais ici) */
        /* Les messages de la Console arrivent DROIT au fil — gravés en
           base, poussés par la Tombe. On n'ajoute que le canal du
           CONTEXTE (global au hub, la partie dans le pack) : les autres
           canaux ne sont pas les nôtres. */
        if (donnee && donnee.table === "archiviste_console" && evType === "INSERT" && ligne) {
          const ctx = contexteConsoleRef.current || {};
          if ((ligne.partie_id || null) === (ctx.partieId || null) && (ligne.jeu || null) === (ctx.packId || null)) {
            setConsoleFil(f => {
              if (f.some(x => x.id === ligne.id)) return f; /* anti-écho */
              return [ligne, ...f].slice(0, 80); /* V0.43 : le plus récent naît EN TÊTE */
            });
          }
          /* V0.66 — LE SALON DU JEU : la Taverne du d100 vit le canal de
             SON JDR, hors de toute aventure. */
          const sidJeu = salonJeuIdRef.current;
          if (sidJeu && (ligne.partie_id || null) === null && (ligne.jeu || null) === sidJeu) {
            setSalonJeuFil(f => {
              if (f.some(x => x.id === ligne.id)) return f; /* anti-écho */
              return [ligne, ...f].slice(0, 80);
            });
          }
          return;
        }
        /* LA PARTIE : les poussées du lobby et de la table. */
        if (donnee && donnee.table === "archiviste_parties" && ligne) {
          if (evType === "INSERT") {
            rechargerListes();
            return;
          } /* une aventure s'ouvre */
          if (evType === "UPDATE") {
            if (partieIdRef.current && ligne.id === partieIdRef.current) {
              /* V46 : la partie a été SUPPRIMÉE (par nous ou l'institution) —
                 on quitte la table sans demander pardon. */
              if (ligne.supprime_le) {
                setVue("hub");
                setPartie(null);
                setPartieJoueurs([]);
                setFichesPartie([]);
                setPackPartie(null);
                setModePartie(null);
                showToast("Cette aventure a été effacée.");
                return;
              }
              /* fusion : la ligne poussée est brute (sans mj_pseudo) — on
                 garde le pseudo du MJ déjà connu de la vue lobby */
              /* V47 : la salle est REFERMÉE (le MJ s'en est allé) — les
                 joueurs présents dans la salle d'attente sortent sans
                 demander pardon ; plus personne ne reprend une salle
                 que personne ne tient. */
              if (!ligne.salle_ouverte_le && ligne.statut === "ouverte" && vueRef.current === "partie") {
                setPartie(null);
                setPartieJoueurs([]);
                setFichesPartie([]);
                showToast("La salle est refermée — le MJ ne la tient plus.");
                rechargerListes();
                return;
              }
              setPartie(prev => ({
                ...(prev || {}),
                ...ligne,
                mj_pseudo: ligne.mj_pseudo || prev && prev.mj_pseudo
              })); /* notre salle suit : ouverte → en_cours, ou close */
              if (ligne.statut === "close") {
                setVue("hub");
                setPartie(null);
                setPartieJoueurs([]);
                setFichesPartie([]);
                showToast("L'aventure est close par le MJ.");
              }
            }
            rechargerListes(); /* V48.9 elle RESTE au lobby — tenue, rejoignable */
          }
          return;
        }
        if (donnee && donnee.table === "archiviste_partie_joueurs") {
          if (partieIdRef.current && ligne && ligne.partie_id === partieIdRef.current) {
            rechargerPartie(); /* la table de NOTRE partie vit */
          }
          return;
        }
        /* V43 — LES FICHES : une création d'unité, une blessure, un PV
           gravé — la table entière le voit. On recharge TOUTES les
           fiches de la partie (la vue lobby porte les pseudos). */
        if (donnee && donnee.table === "archiviste_partie_fiches") {
          if (partieIdRef.current && ligne && ligne.partie_id === partieIdRef.current) {
            rechargerFiches();
          }
          return;
        }
        relance();
      },
      surEtat: etat => {
        setEtatTempsReel(etat);
        if (etat === "branche") relance(); /* on a peut-être raté des poussées pendant la coupure */
      }
    });
    canalPresenceRef.current = canal; /* V47 : pour re-pister au changement de pack */
    const auRetour = () => {
      if (document.visibilityState === "visible") verifierSession();
    };
    document.addEventListener("visibilitychange", auRetour);
    return () => {
      canal.fermer();
      canalPresenceRef.current = null;
      document.removeEventListener("visibilitychange", auRetour);
      if (attente) clearTimeout(attente);
    };
  }, [CLOUD, session ? session.compteId : null]); /* ⚠️ compteId SEUL, et JAMAIS
                                                  nu : les deps sont évaluées à CHAQUE rendu, même session null (avant
                                                  connexion) — « session.compteId » nu = écran noir. Avec « session »
                                                  entier en dépendance, l'effet bouclait (fermer → leave → rejoindre →
                                                  track) et le point clignotait rouge/vert au registre. */

  /* V47 : quand on entre dans le pack d'une aventure (ou qu'on le quitte),
     on RE-PISTE — les présents voient notre nouvelle place sans attendre. */
  useEffect(() => {
    if (!CLOUD || !session) return;
    if (canalPresenceRef.current && canalPresenceRef.current.annoncer) {
      canalPresenceRef.current.annoncer({
        compte_id: session.compteId,
        pseudo: session.pseudo,
        jeu: packPartie && packPartie.id || null
      });
    }
  }, [packPartie ? packPartie.id : null]); /* le pack seul — pas session (bouclerait) */

  /* La pulsation de SECOURS : seulement quand le canal temps réel est coupé. */
  useEffect(() => {
    if (!CLOUD || !session || etatTempsReel === "branche") return;
    const secours = setInterval(() => verifierSession(), 30000);
    return () => clearInterval(secours);
  }, [session, etatTempsReel]);

  /* Le glyphe du launcher : l'Icosaèdre D20 — CHOISI par Michael, point final.
